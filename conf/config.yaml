project: oilwell-lifecycle-sec
db:
  # SQLite 零配置起步；换 PostgreSQL 只需改 url 并使用 sql/schema.sql（DDL 两边通用）
  url: "sqlite:///data/warehouse.db"
paths:
  data_dir: "data"
  artifacts_dir: "data/artifacts"
  standards_dir: "data/standards"

synth:
  n_wells: 600
  seed: 20260908
  blocks: ["GL-A", "GL-B", "SB-C"]
  layers: ["Q1", "Q2", "F1"]
  data_end: "2026-12-31"       # 数据截止日：在产井的记录统一截到这一天，单元级汇总才有公共时点
  recent_frac: 0.10            # 上一评估年投产的井占基础井数的比例（让相邻两期都有新井）
  extension_frac: 0.25         # 新井中位于已探明范围之外的扩边井比例
  plan_years: [2025, 2026]     # 生成计划值的年份
  reactivation_frac: 0.08      # 在产老井中插入"停井后复产"的比例（PDNP 转 PDP 有数据可跟踪）
  pud_locations_per_unit: 8    # 每个单元生成的未钻部署井位数
  asset_nbv_factor: 0.35       # 合成资产净值的整体缩放（让少数单元出现减值，演示用）

model:
  obs_days: 90                 # 新井早期观测窗口
  quantiles: [0.1, 0.5, 0.9]
  targets: ["t_oil_break", "t_peak", "q_peak", "p_peak", "eur"]
  conformal_alpha: 0.2         # 名义覆盖率 1-alpha = 80%
  split:
    method: "time"             # time | group | random（正式评测只用 time / group）
    calib_ratio: 0.2
    test_ratio: 0.25
  seq:                         # 早期序列模型（纯 numpy 膨胀卷积 TCN），与梯度提升按目标融合
    enabled: true
    n_seeds: 3
    hidden: 16
    max_epochs: 200

# 带物理约束的递减模型（src/reserves/physics_dca.py）：线性流 → 边界控制流 → 终端递减
physics_dca:
  enabled: true
  min_analogs: 5               # 同区块成熟井少于此数时用宽先验
  n_bootstrap: 30
  eur_cap_rf: high_pct         # EUR 上限 = 容积法 OOIP P50 × 区块采收率 90% 分位
  hindcast_horizons: [6, 12, 24]

llm:
  # backend: internal | glm | mock
  # mock 后端不需要任何模型即可跑通整条智能体链路，用于离线测试与评测
  backend: "mock"
  internal:
    base_url: "http://内网大模型地址/v1"
    model: "Qwen3.8-27B"
    api_key_env: "INTERNAL_LLM_API_KEY"
  glm:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "glm-5.3-flash"
    api_key_env: "GLM_API_KEY"
  timeout_s: 60
  max_tool_calls: 8            # 单会话工具调用上限（§7.4 任务边界）

# SEC 单元"新-老-措"构成评估（docs/dev-plan-sec-unit.md）
sec_unit:
  evaluation_dates: ["2025-12-31", "2026-12-31"]   # 可选评估基准日，须在价格册里有对应 as_of
  period_months: 12            # 评估期长度：基准日前 N 个月内投产的井算本期新井，实施的措施算本期措施
  new_well:                    # 提采新井 / 扩边井识别：看周边有没有评估期前已投产的老井
    radius_m: 1500
    min_old_neighbors: 3
  measure:
    max_pre_months: 24         # 措施前基线最长回看月数
    min_pre_months: 6          # 措施前至少这么多个有效月，否则基线不可信、不评
    min_post_months: 3         # 措施后至少这么多个有效月，否则"观察期不足"、不计增储
  decline:
    exclude_years: [3, 5]      # 老井基础递减：扣除近 N 年投产新井与近 N 年措施增油
    min_fit_months: 12         # 单元递减拟合的最少月数
  type_curve:
    min_history_months: 24     # 进入类型曲线的老井至少要有这么长历史
  oil_density_t_per_m3: 0.85   # 含水率换算用的原油密度
  pdnp:                        # 已开发未生产（停产井）
    max_shut_in_months: 24     # 停产超过该时长为长停井，不计入 PDNP
  pud:                         # 已探明未开发（部署井位）
    radius_m: 1000             # 连续性：井位半径内须有当期在产井
    min_producing_neighbors: 3
    horizon_years: 5           # 五年规则：须在首次入账后 5 年内钻井
    certainty_factor: 0.85     # 单元类型曲线折减，体现合理确定性
  finance:                     # 折耗与减值（金额单位：万元；示例值，正式使用由财务部门提供）
    fx_cny_per_usd: 7.10
    discount_rate: 0.10        # 减值测试折现率（年）
    well_capex_wan: {水平井: 450, 直井: 200, default: 400}       # 单井钻完井投资
    measure_cost_wan: {frac: 90, perforation: 20, acid: 15, workover: 35, sand_control: 25, waterflood: 10, default: 30}
    restart_cost_wan: 15       # 停产井复产作业费：PDNP 剩余可采的净收入须覆盖它
    pud_capex_wan: 500         # 部署井位未给投资时的默认钻完井投资
  measure_types:
    perforation: "补孔"
    frac: "压裂"
    acid: "酸化"
    workover: "大修"
    sand_control: "防砂"
    waterflood: "注水受益"

agent:
  intents: ["predict_lifecycle","find_analogs","fit_dca","estimate_reserves",
            "cross_check","sec_screen","query_well","gen_report",
            "unit_composition","unit_decline","measure_effect","new_well_identify",
            "unit_reconcile","unit_sensitivity","fallback"]
  router_confidence_threshold: 0.35
