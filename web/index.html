<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>油井全生命周期与 SEC 储量预评估平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C16 3 6 15 6 21a10 10 0 0 0 20 0C26 15 16 3 16 3z' fill='%231F5BB8'/%3E%3C/svg%3E">
<style>
/* ────────────────────────────────────────────────────────────────
   零依赖：不引 Vue / ECharts / 任何 CDN。
   内网装不了 npm 也连不了外网，图表全部手写 SVG。
   布局：企业业务系统 —— 深色侧栏分组导航 + 白色工作区 + 紧凑表格。
   ──────────────────────────────────────────────────────────────── */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --sunk:#F4F6F9;
  --ink:#1A2332; --ink-2:#3F4A5A; --muted:#667185; --rule:#DCE1E8; --rule-soft:#EBEEF2;
  --brand:#1F5BB8; --brand-hover:#194C9C; --brand-soft:#EAF1FB; --brand-ink:#1A4F9E;
  --side:#101B2D; --side-2:#18263D; --side-ink:#C5CEDB; --side-muted:#7D8AA0; --side-rule:#1F2D45;
  /* 分类色：validate_palette.js 在 #FFFFFF / #141B26 两种表面上全项通过（四色相邻 CVD ΔE ≥ 10） */
  --c1:#0E8F7F; --c2:#C25E12; --c3:#3B4FA8; --c4:#B8487F;
  --c1-soft:#8CC7BE;
  --neutral:#A9B1BC; --neutral-2:#6F7A89;
  --ok:#1E7A4C; --warn:#9A6700; --crit:#B3372B;
  --ok-bg:#E8F4EE; --warn-bg:#FBF3E0; --crit-bg:#FBECEA;
  --shadow:0 1px 2px rgba(16,27,45,.06);
  --shadow-pop:0 6px 24px -6px rgba(16,27,45,.22);
  --side-w:220px; --nav-active:#1F5BB8;
  /* 顺序色（量级）：单一色相由浅到深，井位图"累产 / 投产年份"着色用 */
  --seq:#C9DBF2,#8FB5E6,#5689D0,#2D63B0,#173F7C;
  /* 证实储量类别色：与构成身份色分开，避免"同色不同义" */
  --k1:#1F7FB8; --k2:#A67A0C; --k3:#7E57C2;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B111A; --surface:#141B26; --surface-2:#19212E; --sunk:#111823;
  --ink:#E3E8EF; --ink-2:#B8C2D0; --muted:#8A95A6; --rule:#283243; --rule-soft:#1F2835;
  --brand:#5B8FE0; --brand-hover:#77A3E8; --brand-soft:#1A2940; --brand-ink:#8DB3EE;
  --side:#080D15; --side-2:#131C2B; --side-ink:#C5CEDB; --side-muted:#707D92; --side-rule:#172133; --nav-active:#2A5AA8; --seq:#1F3050,#2A5591,#3F7CC8,#74A8E6,#B9D6F8; --k1:#3A9AD6; --k2:#B8891F; --k3:#9A7AD8;
  /* dark 模式单独选步，不是自动翻转 */
  --c1:#19A492; --c2:#D2731F; --c3:#5468C4; --c4:#D0679B;
  --c1-soft:#2F6F66;
  --neutral:#566070; --neutral-2:#8A95A5;
  --ok:#5CBB86; --warn:#D3A74E; --crit:#E57E70;
  --ok-bg:#16291F; --warn-bg:#2B2413; --crit-bg:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 8px 28px -6px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0B111A; --surface:#141B26; --surface-2:#19212E; --sunk:#111823;
  --ink:#E3E8EF; --ink-2:#B8C2D0; --muted:#8A95A6; --rule:#283243; --rule-soft:#1F2835;
  --brand:#5B8FE0; --brand-hover:#77A3E8; --brand-soft:#1A2940; --brand-ink:#8DB3EE;
  --side:#080D15; --side-2:#131C2B; --side-ink:#C5CEDB; --side-muted:#707D92; --side-rule:#172133; --nav-active:#2A5AA8; --seq:#1F3050,#2A5591,#3F7CC8,#74A8E6,#B9D6F8; --k1:#3A9AD6; --k2:#B8891F; --k3:#9A7AD8;
  --c1:#19A492; --c2:#D2731F; --c3:#5468C4; --c4:#D0679B;
  --c1-soft:#2F6F66;
  --neutral:#566070; --neutral-2:#8A95A5;
  --ok:#5CBB86; --warn:#D3A74E; --crit:#E57E70;
  --ok-bg:#16291F; --warn-bg:#2B2413; --crit-bg:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 8px 28px -6px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:13px; line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
              "Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);padding:6px 10px;border-radius:4px}
.skip:focus{left:8px}

/* ── 侧栏 ── */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;z-index:30}
.brandbox{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--side-rule);min-height:60px}
.brandbox .mark{width:28px;height:28px;border-radius:6px;background:var(--brand);display:grid;place-items:center;flex:none}
.brandbox .mark svg{width:16px;height:16px;fill:#fff}
.brandbox b{display:block;font-size:14.5px;color:#fff;font-weight:600;letter-spacing:.02em;line-height:1.25}
.brandbox small{display:block;font-size:11px;color:var(--side-muted);line-height:1.3}
.navscroll{flex:1;overflow-y:auto;padding:10px 0 16px}
.ngroup{padding:12px 18px 6px;font-size:11px;letter-spacing:.08em;color:var(--side-muted)}
.nav a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:0 10px;height:36px;border-radius:5px;
  color:var(--side-ink);text-decoration:none;font-size:13px;position:relative}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a[aria-current="page"]{background:var(--nav-active);color:#fff;font-weight:500}
.nav a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.sidefoot{border-top:1px solid var(--side-rule);padding:12px 18px;font-size:11px;color:var(--side-muted);line-height:1.7}
.sidefoot .mono{color:var(--side-ink);font-size:11px}

/* ── 顶栏 + 页头 ── */
.shell{margin-left:var(--side-w);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.topbar{height:48px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--rule-soft)}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumb .sep{color:var(--rule)}
.crumb .cur{color:var(--ink)}
.spacer{flex:1}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:5px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink-2);cursor:pointer}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.pagebar{display:flex;align-items:center;gap:10px 16px;padding:10px 20px;flex-wrap:wrap;min-height:54px}
.pagebar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.ctx{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-left:auto;min-width:0;max-width:100%}
.cf{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.cf>label{font-size:12px;color:var(--muted);white-space:nowrap}
.cf select{min-width:0}
main{padding:16px 20px 32px;flex:1}
.view[hidden]{display:none!important}

/* ── 标签 ── */
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:3px;font-size:12px;
  background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;line-height:1}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.tag.crit{color:var(--crit);background:var(--crit-bg);border-color:transparent}
.tag.brand{color:var(--brand-ink);background:var(--brand-soft);border-color:transparent}
.tag .dotc{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── 控件 ── */
select,input[type=text],textarea{background:var(--surface);color:var(--ink);border:1px solid var(--rule);
  border-radius:4px;padding:0 8px;height:32px;font-size:13px;font-family:inherit;max-width:100%}
textarea{height:auto;padding:8px 10px;resize:vertical;line-height:1.55}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);
  font-size:13px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--nav-active);border-color:var(--nav-active);color:#fff}
.btn.primary:hover{filter:brightness(1.12);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{height:24px;padding:0 9px;border:0;background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.ibtn{height:24px;padding:0 7px;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:4px;border-radius:4px}
.ibtn svg.ic{width:14px;height:14px}
.ibtn:hover,.ibtn[aria-expanded="true"]{color:var(--brand);background:var(--brand-soft)}

/* ── 布局 ── */
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:grid;gap:16px;margin-top:16px;align-items:start}
.row:first-child{margin-top:0}
.row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.c21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row.c12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
@media(max-width:1180px){.row.c2,.row.c21,.row.c12{grid-template-columns:minmax(0,1fr)}}

/* ── 面板 ── */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:6px 12px;padding:0 14px 0 16px;min-height:44px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.ph h3{margin:0;font-size:13.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
.ph h3::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}
.ph .pm{font-size:12px;color:var(--muted);min-width:0;flex:1 1 120px;padding:6px 0}
.ph .pa{display:flex;align-items:center;gap:6px;margin-left:auto;padding:8px 0}
.pnote{padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--rule-soft);font-size:12px;color:var(--ink-2);line-height:1.7}
.pnote p{margin:0}
.pnote p+p{margin-top:4px}
.pb{padding:14px 16px}
.pb.flush{padding:0}
.pfoot{padding:8px 16px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ── 指标条 ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.kpi{padding:12px 16px;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);margin-right:-1px;margin-bottom:-1px;min-width:0}
.kl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kval{font-size:22px;font-weight:600;line-height:1.3;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kval small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.kn{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.45}
.kn .up{color:var(--ok)} .kn .dn{color:var(--crit)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.kpis.inset{box-shadow:none;margin-bottom:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));background:var(--surface-2)}
.kpis.inset .kpi{padding:9px 12px}
.kpis.inset .kval{font-size:17px}

/* ── 实体页头（单井） ── */
.ehead{display:flex;align-items:center;gap:10px 28px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);margin-bottom:16px}
.ehead .et{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ehead .et b{font-size:17px;font-weight:600;letter-spacing:.01em}
dl.facts{display:flex;flex-wrap:wrap;gap:4px 26px;margin:0}
dl.facts div{display:flex;flex-direction:column;min-width:0}
dl.facts dt{font-size:11.5px;color:var(--muted)}
dl.facts dd{margin:0;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 提示条 ── */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:12.5px;line-height:1.6;
  border:1px solid transparent}
.alert svg.ic{margin-top:2px}
.alert.warn{background:var(--warn-bg);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.warn svg.ic{color:var(--warn)}
.alert.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.alert.crit svg.ic{color:var(--crit)}
.alert.info{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent)}
.alert.info svg.ic{color:var(--brand)}
.alert b{font-weight:600}

/* ── 表格 ── */
.tw{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-size:12.5px}
.dt td{white-space:nowrap}
.dt td.wrap{white-space:normal;min-width:220px}
.dt th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:0 12px;height:34px;background:var(--surface-2);
  border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0}
.dt td{padding:0 12px;height:36px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
.dt td.wrap{padding-top:7px;padding-bottom:7px;height:auto;line-height:1.5}
.dt tbody tr:hover td{background:var(--surface-2)}
.dt tr:last-child td{border-bottom:0}
.dt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt tr.total td{font-weight:600;background:var(--surface-2)}
.dt tr.click{cursor:pointer}
.dt tr.grp td{background:var(--sunk);font-size:12px;color:var(--muted);height:30px;font-weight:500}
.dt td .sub2{color:var(--muted);font-size:11.5px}
.delta.up{color:var(--ok)} .delta.dn{color:var(--crit)} .delta.flat{color:var(--muted)}
.tscroll{max-height:420px;overflow:auto}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted)}

/* ── 键值列表 ── */
dl.kv{display:grid;grid-template-columns:max-content 1fr;margin:0;font-size:12.5px}
dl.kv dt{color:var(--muted);padding:7px 16px 7px 0;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
dl.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--rule-soft);font-variant-numeric:tabular-nums;min-width:0}
dl.kv dt:nth-last-of-type(1),dl.kv dd:last-child{border-bottom:0}

/* ── 子页签 ── */
.subtabs{position:relative;display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:0 0 16px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);height:38px;
  padding:0 14px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected="true"]{color:var(--brand);font-weight:600}
.subtabs .cnt{display:inline-block;margin-left:5px;padding:0 6px;border-radius:9px;background:var(--surface-2);border:1px solid var(--rule-soft);
  font-size:11px;color:var(--muted);font-weight:400;line-height:16px}

/* ── 图表 ── */
figure{margin:0}
figure svg{display:block;width:100%;height:auto;overflow:visible}
figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:2.5px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.band{height:9px;border-radius:2px;opacity:.5}
.legend i.dash{background:none;border-top:2px dashed var(--muted);height:0}
.legend i.box{height:9px;width:9px;border-radius:2px}
.legend i.dot{height:9px;width:9px;border-radius:50%}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--rule);
  border-radius:5px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow-pop);z-index:60;
  opacity:0;transform:translateY(4px);transition:opacity .14s,transform .16s cubic-bezier(.22,1,.36,1);max-width:280px}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:600}
.tip .row{display:flex;gap:10px;justify-content:space-between}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 20px}
.mini h4{margin:0 0 2px;font-size:12.5px;font-weight:600}
.mini .kn{margin-bottom:4px}

/* ── 检查清单 / 发现 ── */
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule-soft);font-size:12.5px}
.chk li:last-child{border-bottom:0}
.chk .it{font-weight:500}
.chk .ev{color:var(--ink-2);font-size:12px;margin-top:2px}
.chk .ct{color:var(--muted);font-size:11px;margin-top:2px}
.finding{display:grid;grid-template-columns:3px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px}
.finding:last-child{border-bottom:0}
.finding::before{content:"";border-radius:2px;background:var(--rule)}
.finding.warn::before{background:var(--warn)} .finding.critical::before{background:var(--crit)} .finding.info::before{background:var(--ok)}
.finding .act{color:var(--muted);font-size:12px;margin-top:2px}

/* ── 智能问答 ── */
.chat{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1280px){.chat{grid-template-columns:220px minmax(0,1fr)}.chat .trace-col{grid-column:1/-1}}
@media(max-width:900px){.chat{grid-template-columns:minmax(0,1fr)}.chat .qcol{order:2}.chat .trace-col{order:3}}
.qlist{padding:6px 0}
.qlist .qg{padding:10px 16px 4px;font-size:11.5px;color:var(--muted)}
.qlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 16px;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;font-family:inherit;line-height:1.45}
.qlist button:hover{background:var(--brand-soft);color:var(--brand-ink)}
.ameta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

  animation-duration:.62s;animation-timing-function:var(--ease-out);animation-fill-mode:both;animation-delay:var(--d,0ms)}

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   1. 基础工具
   ══════════════════════════════════════════════════════════════ */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c === null || c === undefined) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
};
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v))

async function apiPost(path, body) {
  const r = await fetch('/api/v1' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: '响应不是合法 JSON' }));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

async function api(path, params) {
  const q = params ? '?' + new URLSearchParams(params) : '';
  const r = await fetch('/api/v1' + path + q);
  const j = await r.json().catch(() => ({ error: '响应不是合法 JSON' }));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* ══════════════════════════════════════════════════════════════
   2. 手写 SVG 图表
   规矩：单一坐标轴（绝不双轴）、细笔画、网格退到背景、
   文字用文本色不用系列色、每张图都有 hover 层。
   尺寸：按容器的实际像素宽度 1:1 绘制 —— 文字恒定 11~12px，

   ══════════════════════════════════════════════════════════════ */
const NS = 'http://www.w3.org/2000/svg';
const s_ = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs))
    if (v !== null && v !== undefined) n.setAttribute(k, v);

function showTip(evt, html) {

const FS = { tick: 11, label: 12, note: 10.5 };
const MOTION = !matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 数值紧凑写法：图上刻度用，精确值在提示框和表格视图里 */
const compactT = v => Math.abs(v) >= 1e4 ? fmt(v / 1e4, 1) + '万' : fmt(v, 0);
const fmtT = v => (v === null || v === undefined) ? '—'
  : Math.abs(v) >= 1e4 ? fmt(v / 1e4, 2) + ' 万 t' : fmt(v, 0) + ' t';

/* 挂载：等容器有了真实宽度再画，宽度变化时重画（图高固定，不会引发重画循环） */
const _ro = 'ResizeObserver' in window ? new ResizeObserver(entries => entries.forEach(e => {
  const host = e.target;
  if (!host.isConnected) { _ro.unobserve(host); return; }
  const w = Math.floor(e.contentRect.width);
  if (w > 0 && w !== host._w) { host._w = w; host.innerHTML = ''; hideTip(); host._draw(w); introOnce(host); }
})) : null;
function mount(host, draw) {
  host.innerHTML = '';
  host._draw = draw; host._w = 0; host._intro = MOTION;

/* 首绘入场动画：柱从基线长出、点弹出、线与区间带从左向右展开。
   只在第一次绘制时播放 —— 容器尺寸变化引起的重画不再重播；系统要求减少动态效果时不播。 */
let _clipSeq = 0;
function introOnce(host) {
  if (!host._intro) return;
  host._intro = false;
  const svg = host.querySelector(':scope > svg');
  if (!svg) return;
  svg.classList.add('anim');
  const clips = svg.querySelectorAll('.a-clip');
  if (clips.length) {
    const vb = svg.viewBox.baseVal, id = 'reveal' + (++_clipSeq);
    const rect = s_('rect', { x: 0, y: -40, width: 0, height: vb.height + 80 });
    const cp = s_('clipPath', { id }), defs = s_('defs');
    cp.appendChild(rect); defs.appendChild(cp); svg.insertBefore(defs, svg.firstChild);
    clips.forEach(c => c.setAttribute('clip-path', `url(#${id})`));
    const t0 = performance.now(), dur = 950;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      rect.setAttribute('width', vb.width * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
      else { clips.forEach(c => c.removeAttribute('clip-path')); defs.remove(); }

const svgX = (svg, ev, W) => { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * (W / (r.width || W)); };

function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

/* 整数步长刚好越过数据范围时（如 ±4938 配 5000 步长）只剩一个刻度：退到更细的步长 */
function ticks(lo, hi, n) {
  const t = niceTicks(lo, hi, n);
  return t.length >= 3 ? t : niceTicks(lo, hi, n + 2);
}

function frame(w, h, pad) {
  const svg = s_('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: 'img' });

}
function axes(g, xd, yd, xLabel, yLabel, xFmt, yFmt) {
  const { svg, pad, iw, ih } = g;
  const X = v => pad.l + (v - xd[0]) / (xd[1] - xd[0] || 1) * iw;
  const Y = v => pad.t + ih - (v - yd[0]) / (yd[1] - yd[0] || 1) * ih;
  const grid = cssVar('--rule-soft'), muted = cssVar('--muted');
  ticks(yd[0], yd[1], Math.max(4, Math.floor(ih / 45))).forEach(t => {
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(t), y2: Y(t), stroke: grid, 'stroke-width': 1 }));
    svg.appendChild(svgText({ x: pad.l - 8, y: Y(t) + 4, 'text-anchor': 'end', fill: muted, 'font-size': FS.tick }, yFmt ? yFmt(t) : fmt(t, 2)));
  });
  ticks(xd[0], xd[1], Math.max(3, Math.floor(iw / 80))).forEach(t =>
    svg.appendChild(svgText({ x: X(t), y: pad.t + ih + 16, 'text-anchor': 'middle', fill: muted, 'font-size': FS.tick }, xFmt ? xFmt(t) : fmt(t, 0))));
  svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: pad.t + ih, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1 }));
  if (xLabel) svg.appendChild(svgText({ x: pad.l + iw / 2, y: g.h - 4, 'text-anchor': 'middle', fill: muted, 'font-size': FS.note }, xLabel));
  if (yLabel) svg.appendChild(svgText({ x: 12, y: pad.t + ih / 2, 'text-anchor': 'middle', fill: muted, 'font-size': FS.note, transform: `rotate(-90 12 ${pad.t + ih / 2})` }, yLabel));
  return { X, Y };
}

function yGrid(g, yd, Y, tickFmt) {
  const { svg, pad, iw, ih } = g;
  ticks(yd[0], yd[1], Math.max(4, Math.floor(ih / 45))).forEach(t => {
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(t), y2: Y(t), stroke: cssVar(t === 0 ? '--rule' : '--rule-soft'), 'stroke-width': 1 }));
    svg.appendChild(svgText({ x: pad.l - 8, y: Y(t) + 4, 'text-anchor': 'end', fill: cssVar('--muted'), 'font-size': FS.tick }, (tickFmt || compactT)(t)));

/* 只圆"数据端"（4px），基线端保持方角 */
function barPath(x, y, w, h, end) {

/* 折线 + 不确定性带。单一 y 轴：压力另起一张小图，绝不做双轴。 */

/* 发散条形图：零点中性轴；标签列与数值列各自留宽，长条也不会压到文字 */
function divergingBars(host, rows, unit, opts = {}) {
  mount(host, W => {

    const svg = s_('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: 'img' });

/* 直方图：单一色相，P10/P50/P90 用参考线标注 */
function histogram(host, values, refs, xLabel) {
  mount(host, W => {
    const g = frame(W, 240, { l: 50, r: 16, t: 22, b: 40 });
    const lo = Math.min(...values), hi = Math.max(...values), nb = W < 520 ? 16 : 26;

/* 井位图：等比例投影（东西、南北同一比例尺）+ 区块范围 + 缩放平移 + 三种着色。
   交互：拖动平移、双击放大、⌘/Ctrl + 滚轮（触控板双指）缩放；点区块图例聚焦该区块，点井进入单井。
   颜色按"工作"分：区块 = 分类色；累产 / 投产年份 = 单一色相顺序色（量级）。 */
const _hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function rampColor(t) {
  const stops = cssVar('--seq').split(',').map(x => _hex(x.trim()));
  const k = Math.max(0, Math.min(1, Number.isFinite(t) ? t : 0)) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(k)), f = k - i;
  return `rgb(${stops[i].map((v, j) => Math.round(v + (stops[i + 1][j] - v) * f)).join(',')})`;
}
function convexHull(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower.at(-2), lower.at(-1), q) <= 0) lower.pop(); lower.push(q); }
  for (const q of p.slice().reverse()) { while (upper.length >= 2 && cross(upper.at(-2), upper.at(-1), q) <= 0) upper.pop(); upper.push(q); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function wellMap(host, cfg) {
  const st = { mode: cfg.mode || 'block', focus: null, view: null, hi: null };
  const wells = cfg.wells.filter(w => Number.isFinite(w.x) && Number.isFinite(w.y));
  const api = { setMode: m => { st.mode = m; }, focus: b => { st.focus = b; }, highlight: c => { st.hi = c; }, frame: f => { st.frame = f; } };
  host.classList.add('wmap');
  if (!wells.length) { show(host, el('div', { class: 'empty', text: '没有可显示的井位' })); return api; }
  const blocks = [...new Set(wells.map(w => w.block))].sort();
  const yearOf = w => +String(w.first_prod_date).slice(0, 4);
  const years = wells.map(yearOf).filter(Number.isFinite);
  const yr = [Math.min(...years), Math.max(...years)];
  const cumS = wells.map(w => Math.sqrt(Math.max(w.cum_oil_t || 0, 0)));
  const cr = [Math.min(...cumS), Math.max(...cumS)];
  const cmax = Math.max(...wells.map(w => w.cum_oil_t || 0)) || 1;
  const fillOf = (w, i) => cfg.fill ? (cfg.fill(w) || cssVar('--neutral')) : st.mode === 'cum' ? rampColor((cumS[i] - cr[0]) / (cr[1] - cr[0] || 1))
    : st.mode === 'year' ? rampColor((yearOf(w) - yr[0]) / (yr[1] - yr[0] || 1))
    : (cfg.colors[w.block] || cssVar('--muted'));

  function drawLegend() {
    const lg = cfg.legendHost;
    if (!lg) return;
    if (st.mode === 'block') {
      lg.replaceChildren(...blocks.map(b => {
        const btn = el('button', { type: 'button', 'aria-pressed': String(st.focus === b), class: st.focus && st.focus !== b ? 'off' : null,
          title: st.focus === b ? '取消聚焦' : `聚焦 ${b}` },
          [el('i', { class: 'dotk', style: `background:${cfg.colors[b] || cssVar('--muted')}` }), `${b}　${wells.filter(w => w.block === b).length} 口`]);
        btn.addEventListener('click', () => api.focus(st.focus === b ? null : b));
        return btn;
      }), el('span', { class: 'muted', text: '大小 = 累产 · 深色描边 = 新井' }));
    } else {
      const grad = `linear-gradient(90deg,${[0, .25, .5, .75, 1].map(rampColor).join(',')})`;
      const isCum = st.mode === 'cum';
      lg.replaceChildren(el('span', { text: isCum ? '累产油' : '投产年份' }),
        el('span', { class: 'muted', text: isCum ? '0' : String(yr[0]) }), el('i', { class: 'ramp', style: `background:${grad}` }),
        el('span', { class: 'muted', text: isCum ? compactT(cmax) + ' t' : String(yr[1]) }),
        el('span', { class: 'muted', text: isCum ? '颜色越深累产越高（按平方根分级）' : '颜色越深投产越晚' }));
    }
  }

  mount(host, W => {
    const H = W < 520 ? 320 : 440, pad = { l: 46, r: 12, t: 10, b: 30 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const xs = wells.map(w => w.x).concat((cfg.extra || []).map(e => e.x));
    const ys = wells.map(w => w.y).concat((cfg.extra || []).map(e => e.y));
    const ext = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    const full = { cx: (ext[0] + ext[1]) / 2, cy: (ext[2] + ext[3]) / 2,
      s: Math.min(iw / ((ext[1] - ext[0]) * 1.12 || 1), ih / ((ext[3] - ext[2]) * 1.25 || 1)) };
    let v = st.view ? { ...st.view } : { ...full };
    const PX = x => pad.l + iw / 2 + (x - v.cx) * v.s, PY = y => pad.t + ih / 2 - (y - v.cy) * v.s;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': '井位分布图' });
    const clipId = 'mapclip' + (++_clipSeq), defs = s_('defs'), cp = s_('clipPath', { id: clipId });
    cp.appendChild(s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih })); defs.appendChild(cp);
    const gGrid = s_('g'), gData = s_('g', { 'clip-path': `url(#${clipId})` }), gAxis = s_('g');
    const gHull = s_('g'), gDots = s_('g'), gMark = s_('g');
    gData.append(gHull, gDots, gMark);
    svg.append(defs, s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, rx: 4, fill: cssVar('--surface-2') }), gGrid, gData, gAxis);

    const hulls = blocks.map((b, k) => {
      const color = cfg.colors[b] || cssVar('--muted');
      const hp = convexHull(wells.filter(w => w.block === b).map(w => [w.x, w.y]));
      const path = s_('path', { class: 'hull a-fade', style: `--d:${k * 120}ms`, fill: color, 'fill-opacity': .08, stroke: color,
        'stroke-opacity': .14, 'stroke-width': 26, 'stroke-linejoin': 'round' });
      const label = svgText({ class: 'hull a-fade', style: `--d:${k * 120 + 500}ms`, 'text-anchor': 'middle', fill: cssVar('--ink-2'),
        'font-size': 12, 'font-weight': 600, 'paint-order': 'stroke', stroke: cssVar('--surface-2'), 'stroke-width': 4, 'stroke-linejoin': 'round' },
        `${b} · ${wells.filter(w => w.block === b).length} 口`);
      gHull.append(path, label);
      return { b, hp, path, label };
    });

    const rmax = W < 520 ? 5 : 7;
    const rank = new Array(wells.length);
    wells.map((w, i) => i).sort((p, q) => wells[p].x - wells[q].x).forEach((idx, k) => { rank[idx] = k; });
    let dragMoved = false;
    const tipHtml = w => `<b>${w.well_code}</b>　<span class="mono">${w.block} ${w.layer}</span>` +
      `<div class="row"><span>投产</span><span class="mono">${w.first_prod_date}</span></div>` +
      `<div class="row"><span>累产油</span><span class="mono">${fmt(w.cum_oil_t, 0)} t</span></div>` +
      `<div class="row"><span>生产历史</span><span class="mono">${w.history_days} d</span></div>` +
      `<div style="margin-top:4px;color:var(--muted)">${w.is_new ? '新井 · 尚未走完生命周期 · ' : ''}点击进入单井分析</div>`;
    const dots = wells.map((w, i) => {
      const c = s_('circle', { class: 'dot a-pop', r: 2.6 + Math.sqrt((w.cum_oil_t || 0) / cmax) * rmax,
        'stroke-width': w.is_new ? 1.4 : 1, style: `--d:${Math.round(rank[i] / wells.length * 800) + 250}ms` });
      c._r0 = c.getAttribute('r');
      c.addEventListener('mousemove', ev => { if (!dragMoved) showTip(ev, tipHtml(w)); });
      c.addEventListener('mouseleave', hideTip);
      c.addEventListener('click', () => { if (!dragMoved && cfg.onPick) cfg.onPick(w.well_code); });
      gDots.appendChild(c);
      return c;
    });

    const ring = s_('circle', { class: 'pulse', r: 8, fill: 'none', stroke: cssVar('--brand'), 'stroke-width': 2 });
    const core = s_('circle', { r: 6, fill: 'none', stroke: cssVar('--brand'), 'stroke-width': 2.4 });
    const mlabel = svgText({ 'font-size': 11.5, 'font-weight': 600, fill: cssVar('--ink'), 'paint-order': 'stroke',
      stroke: cssVar('--surface'), 'stroke-width': 4, 'stroke-linejoin': 'round' }, '');
    gMark.append(ring, core, mlabel);
    const gExtra = s_('g');
    gData.insertBefore(gExtra, gMark);
    const extras = (cfg.extra || []).map((e, k) => {
      const node = s_('path', { class: 'xloc a-pop', style: `--d:${900 + Math.min(k, 120) * 5}ms`,
        fill: e.hollow ? cssVar('--surface') : e.color, stroke: e.color, 'stroke-width': e.hollow ? 1.8 : 1.2 });
      node.addEventListener('mousemove', ev => { if (!dragMoved) showTip(ev, e.tip); });
      node.addEventListener('mouseleave', hideTip);
      gExtra.appendChild(node);
      return node;
    });

    function placeMark() {
      const code = st.hi || cfg.current, i = wells.findIndex(w => w.well_code === code);
      [ring, core, mlabel].forEach(n => { n.style.display = i < 0 ? 'none' : ''; });
      if (i < 0) return;
      const x = PX(wells[i].x), y = PY(wells[i].y), right = x < pad.l + iw - 140;
      [ring, core].forEach(n => { n.setAttribute('cx', x); n.setAttribute('cy', y); });
      mlabel.textContent = (st.hi && st.hi !== cfg.current ? '' : '当前井 ') + code;
      mlabel.setAttribute('x', right ? x + 12 : x - 12); mlabel.setAttribute('y', y - 10);
      mlabel.setAttribute('text-anchor', right ? 'start' : 'end');
    }

    function render() {
      const vx0 = v.cx - iw / 2 / v.s, vx1 = v.cx + iw / 2 / v.s, vy0 = v.cy - ih / 2 / v.s, vy1 = v.cy + ih / 2 / v.s;
      gGrid.replaceChildren(); gAxis.replaceChildren();
      ticks(vx0, vx1, Math.max(3, Math.floor(iw / 110))).forEach(t => {
        const x = PX(t);
        if (x < pad.l || x > pad.l + iw) return;
        gGrid.appendChild(s_('line', { x1: x, x2: x, y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule-soft'), 'stroke-width': 1 }));
        gAxis.appendChild(svgText({ x, y: pad.t + ih + 16, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, fmt(t / 1000, 1)));
      });
      ticks(vy0, vy1, Math.max(3, Math.floor(ih / 70))).forEach(t => {
        const y = PY(t);
        if (y < pad.t || y > pad.t + ih) return;
        gGrid.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: y, y2: y, stroke: cssVar('--rule-soft'), 'stroke-width': 1 }));
        gAxis.appendChild(svgText({ x: pad.l - 8, y: y + 4, 'text-anchor': 'end', fill: cssVar('--muted'), 'font-size': FS.tick }, fmt(t / 1000, 1)));
      });
      gAxis.appendChild(svgText({ x: pad.l + iw, y: H - 4, 'text-anchor': 'end', fill: cssVar('--muted'), 'font-size': FS.note }, '东西向 km（坐标已偏移）'));
      gAxis.appendChild(svgText({ x: 12, y: pad.t + ih / 2, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.note,
        transform: `rotate(-90 12 ${pad.t + ih / 2})` }, '南北向 km'));
      const L = [100, 200, 500, 1000, 2000, 5000, 10000, 20000].find(m => m * v.s >= 70) || 20000;
      const sx = pad.l + 14, sy = pad.t + ih - 14, len = L * v.s;
      gAxis.append(
        s_('rect', { x: sx - 6, y: sy - 22, width: len + 12, height: 28, rx: 4, fill: cssVar('--surface'), 'fill-opacity': .82 }),
        s_('path', { d: `M${sx},${sy - 5}V${sy}H${sx + len}V${sy - 5}`, fill: 'none', stroke: cssVar('--ink-2'), 'stroke-width': 1.5 }),
        svgText({ x: sx + len / 2, y: sy - 8, 'text-anchor': 'middle', fill: cssVar('--ink-2'), 'font-size': FS.note }, L >= 1000 ? `${L / 1000} km` : `${L} m`));
      hulls.forEach(h => {
        if (h.hp.length < 3) { h.path.setAttribute('d', ''); h.label.textContent = ''; return; }
        h.path.setAttribute('d', h.hp.map((p, k) => `${k ? 'L' : 'M'}${PX(p[0]).toFixed(1)},${PY(p[1]).toFixed(1)}`).join('') + 'Z');
        h.label.setAttribute('x', h.hp.reduce((acc, p) => acc + PX(p[0]), 0) / h.hp.length);
        h.label.setAttribute('y', Math.min(...h.hp.map(p => PY(p[1]))) - 18);
      });
      dots.forEach((c, i) => { c.setAttribute('cx', PX(wells[i].x).toFixed(1)); c.setAttribute('cy', PY(wells[i].y).toFixed(1)); });
      extras.forEach((node, k) => {
        const x = PX(cfg.extra[k].x), y = PY(cfg.extra[k].y), r = 6;
        node.setAttribute('d', `M${x.toFixed(1)},${(y - r).toFixed(1)}L${(x + r).toFixed(1)},${y.toFixed(1)}L${x.toFixed(1)},${(y + r).toFixed(1)}L${(x - r).toFixed(1)},${y.toFixed(1)}Z`);
      });
      placeMark();
      st.view = { ...v };
    }

    function paint() {
      dots.forEach((c, i) => {
        const w = wells[i];
        c.setAttribute('fill', fillOf(w, i));
        c.setAttribute('fill-opacity', cfg.fill ? .85 : st.mode === 'block' ? (w.is_new ? .95 : .55) : .92);
        c.setAttribute('stroke', w.is_new ? cssVar('--ink') : cssVar('--surface'));
        c.classList.toggle('dim', !!st.focus && w.block !== st.focus);
      });
      hulls.forEach(h => [h.path, h.label].forEach(n => n.classList.toggle('dim', !!st.focus && h.b !== st.focus)));
      drawLegend();
    }

    /* 缩放：按对数插值，平移与缩放同步，看起来像在"飞"过去 */
    const clampS = x => Math.max(full.s * .8, Math.min(full.s * 14, x));
    let raf = 0;
    function animateTo(target, dur = 420) {
      cancelAnimationFrame(raf);
      if (!MOTION) { v = { ...target }; render(); return; }
      const from = { ...v }, t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        v = { cx: from.cx + (target.cx - from.cx) * e, cy: from.cy + (target.cy - from.cy) * e,
          s: Math.exp(Math.log(from.s) + (Math.log(target.s) - Math.log(from.s)) * e) };
        render();
        if (k < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }
    function zoomAt(px, py, factor, animated = true) {
      const s2 = clampS(v.s * factor), ox = px - pad.l - iw / 2, oy = py - pad.t - ih / 2;
      const mx = v.cx + ox / v.s, my = v.cy - oy / v.s;          // 光标下的地理坐标保持不动
      const target = { s: s2, cx: mx - ox / s2, cy: my + oy / s2 };
      if (animated) animateTo(target); else { cancelAnimationFrame(raf); v = target; render(); }
    }
    function fitBlock(b) {
      const sel = wells.filter(w => w.block === b);
      const x0 = Math.min(...sel.map(w => w.x)), x1 = Math.max(...sel.map(w => w.x));
      const y0 = Math.min(...sel.map(w => w.y)), y1 = Math.max(...sel.map(w => w.y));
      return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 + 60 / v.s,
        s: clampS(Math.min(iw / ((x1 - x0) * 1.35 || 1), ih / ((y1 - y0) * 1.6 || 1))) };
    }

    const local = ev => { const r = svg.getBoundingClientRect(); return [(ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * H / r.height]; };
    let drag = null;
    svg.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      const [x, y] = local(ev);
      drag = { x, y, cx: v.cx, cy: v.cy, id: ev.pointerId };
      dragMoved = false;
    });
    svg.addEventListener('pointermove', ev => {
      if (!drag) return;
      const [x, y] = local(ev);
      if (!dragMoved && Math.hypot(x - drag.x, y - drag.y) < 4) return;
      if (!dragMoved) { dragMoved = true; svg.setPointerCapture(drag.id); svg.classList.add('dragging'); hideTip(); cancelAnimationFrame(raf); }
      v = { ...v, cx: drag.cx - (x - drag.x) / v.s, cy: drag.cy + (y - drag.y) / v.s };
      render();
    });
    const endDrag = () => { if (!drag) return; drag = null; svg.classList.remove('dragging'); setTimeout(() => { dragMoved = false; }, 0); };
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
    svg.addEventListener('dblclick', ev => { const [x, y] = local(ev); zoomAt(x, y, 2); });
    const hint = el('div', { class: 'hint', text: '按住 ⌘ / Ctrl 再滚动可缩放地图' });
    let hintTimer = 0;
    svg.addEventListener('wheel', ev => {
      if (!(ev.ctrlKey || ev.metaKey)) {
        hint.classList.add('on'); clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hint.classList.remove('on'), 1200);
        return;
      }
      ev.preventDefault();
      const [x, y] = local(ev);
      zoomAt(x, y, Math.exp(-ev.deltaY * .0022), false);
    }, { passive: false });
    const zbtn = (ic, label, fn) => { const b = el('button', { type: 'button', title: label, 'aria-label': label }, icon(ic)); b.addEventListener('click', fn); return b; };
    const controls = el('div', { class: 'zoom' }, [
      zbtn('plus', '放大', () => zoomAt(pad.l + iw / 2, pad.t + ih / 2, 1.6)),
      zbtn('minus', '缩小', () => zoomAt(pad.l + iw / 2, pad.t + ih / 2, 1 / 1.6)),
      zbtn('reset', '复位视图', () => { st.focus = null; paint(); animateTo(full); })]);

    api.setMode = m => { st.mode = m; paint(); };
    api.focus = b => { st.focus = b; paint(); animateTo(b ? fitBlock(b) : full); };
    api.highlight = c => { st.hi = c; placeMark(); };
    /* 生产回放：一帧 = 一个月。点大小 = 当月日均产油；未投产隐藏，停产变灰；新投产的井闪一下 */
    const idxOf = new Map(wells.map((w, i) => [w.well_code, i]));
    function applyFrame(fresh) {
      const fr = st.frame;
      dots.forEach((c, i) => {
        if (!fr) { c.setAttribute('r', c._r0); c.style.opacity = ''; return; }
        const s = fr.state(wells[i].well_code);
        if (s.phase === 'on') { c.setAttribute('r', (2 + Math.sqrt(Math.min(s.rate / fr.max, 1.8)) * rmax * 1.45).toFixed(2)); c.style.opacity = '1'; }
        else if (s.phase === 'pre') { c.setAttribute('r', '0.01'); c.style.opacity = '0'; }
        else { c.setAttribute('r', '1.8'); c.style.opacity = '.3'; }
      });
      if (fr && fresh && MOTION) fresh.forEach(code => {
        const i = idxOf.get(code);
        if (i === undefined) return;
        const ring = s_('circle', { class: 'pulse', cx: PX(wells[i].x), cy: PY(wells[i].y), r: 5, fill: 'none', stroke: cssVar('--brand'), 'stroke-width': 2 });
        gMark.appendChild(ring);
        setTimeout(() => ring.remove(), 1800);
      });
    }
    api.frame = (fr, fresh) => { st.frame = fr; applyFrame(fresh); };

    host.append(svg, controls, hint);
    render();
    paint();
    if (st.frame) applyFrame();
  });
  return api;
}

/* 堆叠柱：正值向上堆、负值向下堆；段与段之间留 2px 表面色间隙 */
function stackedColumns(host, cfg) {
  mount(host, W => {
    const g = frame(W, W < 520 ? 240 : 290, { l: 54, r: 12, t: 12, b: 40 });
    const { svg, pad, iw, ih } = g, n = cfg.categories.length;
    const sums = sign => cfg.categories.map((_, i) => cfg.series.reduce((a, s) =>
      a + (sign > 0 ? Math.max(s.values[i] || 0, 0) : Math.min(s.values[i] || 0, 0)), 0));
    const ymax = (Math.max(...sums(1), 0) * 1.08) || 1, ymin = Math.min(...sums(-1), 0) * 1.08;
    const Y = v => pad.t + ih - (v - ymin) / (ymax - ymin) * ih;
    yGrid(g, [ymin, ymax], Y);
    const band = iw / n, bw = Math.max(Math.min(24, band - 2), 1), every = Math.ceil(n / Math.max(2, Math.floor(iw / 72)));
    cfg.categories.forEach((c, i) => {
      const x = pad.l + i * band + (band - bw) / 2;
      let up = 0, dn = 0;
      const segs = [];
      cfg.series.forEach(s => {
        const v = s.values[i] || 0;
        if (!v) return;
        const a = v > 0 ? up : dn, b = a + v;
        if (v > 0) up = b; else dn = b;
        segs.push({ s, a, b, v });
      });
      const lastPos = segs.filter(z => z.v > 0).at(-1), lastNeg = segs.filter(z => z.v < 0).at(-1);
      const col = s_('g', { class: 'a-up', style: `--d:${Math.round(i / n * 650)}ms` });
      segs.forEach(z => {
        const top = Y(Math.max(z.a, z.b)), h = Math.abs(Y(z.a) - Y(z.b)), gap = h > 3 ? 1 : 0;
        col.appendChild(s_('path', { d: barPath(x, top + gap, bw, Math.max(h - 2 * gap, .5), z === lastPos ? 'top' : z === lastNeg ? 'bottom' : null), fill: z.s.color }));
      });
      svg.appendChild(col);
      const hit = s_('rect', { x: pad.l + i * band, y: pad.t, width: band, height: ih, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, `<b>${c}</b>` + cfg.series.map(s =>
        `<div class="row"><span><i class="sw" style="background:${s.color}"></i>${s.name}</span><span class="mono">${fmt(s.values[i], 0)} ${cfg.unit || ''}</span></div>`).join('') +
        `<div class="row"><span>合计</span><span class="mono">${fmt(cfg.series.reduce((a, s) => a + (s.values[i] || 0), 0), 0)} ${cfg.unit || ''}</span></div>`));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
      if (i % every === 0)
        svg.appendChild(svgText({ x: pad.l + i * band + band / 2, y: pad.t + ih + 16, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, c));
    });
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0), stroke: cssVar('--rule'), 'stroke-width': 1 }));
    if (cfg.yLabel) svg.appendChild(svgText({ x: 12, y: pad.t + ih / 2, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.note, transform: `rotate(-90 12 ${pad.t + ih / 2})` }, cfg.yLabel));
    host.appendChild(svg);
  });
}

/* 横向堆叠条：类别名长、行数多时比竖柱好读；行尾标合计，段值在提示框 */
function hStackedBars(host, cfg) {
  mount(host, W => {
    const rowH = 30, bh = 14, labelW = Math.min(cfg.labelW || 150, Math.round(W * .34)), padR = 64;
    const H = cfg.rows.length * rowH + 4;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img' });
    const totals = cfg.rows.map(r => cfg.series.reduce((a, s) => a + Math.max(r.values[s.key] || 0, 0), 0));
    const X = v => v / (Math.max(...totals, 0) || 1) * (W - labelW - padR);
    cfg.rows.forEach((r, i) => {
      const y = i * rowH + (rowH - bh) / 2;
      svg.appendChild(svgText({ x: labelW - 10, y: y + bh / 2 + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, r.label));
      const segs = cfg.series.map(s => ({ s, v: Math.max(r.values[s.key] || 0, 0) })).filter(z => z.v > 0);
      let acc = 0;
      const rowG = s_('g', { class: 'a-right', style: `--d:${i * 50}ms` });
      svg.appendChild(rowG);
      segs.forEach((z, k) => {
        const x = labelW + X(acc), ww = X(z.v), last = k === segs.length - 1;
        acc += z.v;
        rowG.appendChild(s_('path', { d: barPath(x, y, Math.max(ww - (last || ww <= 3 ? 0 : 2), .5), bh, last ? 'right' : null), fill: z.s.color }));
        const hit = s_('rect', { x, y: i * rowH, width: Math.max(ww, 4), height: rowH, fill: 'transparent' });
        hit.addEventListener('mousemove', ev => showTip(ev, `<b>${r.tip || r.label}</b>` +
          `<div class="row"><span><i class="sw" style="background:${z.s.color}"></i>${z.s.name}</span><span class="mono">${fmt(z.v, 0)} ${cfg.unit || ''}</span></div>` +
          `<div class="row"><span>占该行</span><span class="mono">${fmt(z.v / totals[i] * 100, 1)}%</span></div>`));
        hit.addEventListener('mouseleave', hideTip);
        svg.appendChild(hit);
      });
      svg.appendChild(svgText({ class: 'a-fade', style: `--d:${i * 50 + 380}ms`, x: labelW + X(acc) + 7, y: y + bh / 2 + 4, fill: cssVar('--muted'), 'font-size': FS.note }, compactT(totals[i])));
    });
    host.appendChild(svg);
  });
}

/* 瀑布图：期初/期末从零起，行项悬浮在累计值上；数值只标期初、期末和影响最大的两项 */
function waterfall(host, rows, opts = {}) {
  const unit = opts.unit || 't', cf = opts.compact || compactT;
  mount(host, W => {
    const g = frame(W, 290, { l: 54, r: 10, t: 26, b: 40 });
    const { svg, pad, iw, ih } = g;
    let run = 0;
    const steps = rows.map(r => {
      const s = r.total ? { r, a: 0, b: r.value } : { r, a: run, b: run + r.value };
      run = s.b; return s;
    });
    const vals = steps.flatMap(s => [s.a, s.b]);
    const ymax = (Math.max(...vals, 0) * 1.1) || 1, ymin = Math.min(...vals, 0) * 1.1;
    const Y = v => pad.t + ih - (v - ymin) / (ymax - ymin) * ih;
    yGrid(g, [ymin, ymax], Y, cf);
    const band = iw / rows.length, bw = Math.min(24, band * .55);
    const big = steps.filter(s => !s.r.total).sort((p, q) => Math.abs(q.r.value) - Math.abs(p.r.value)).slice(0, 2);
    steps.forEach((s, i) => {
      const x = pad.l + i * band + (band - bw) / 2, up = s.b >= s.a;
      const top = Y(Math.max(s.a, s.b)), h = Math.max(Math.abs(Y(s.a) - Y(s.b)), 1);

        svg.appendChild(s_('line', { class: 'a-fade', style: `--d:${i * 110 + 300}ms`, x1: x + bw, x2: x + band + (band - bw) / 2, y1: Y(s.b), y2: Y(s.b), stroke: cssVar('--rule'), 'stroke-width': 1 }));

          (s.r.total || s.r.value < 0 ? '' : '+') + cf(s.r.value)));
      const hit = s_('rect', { x: pad.l + i * band, y: pad.t, width: band, height: ih, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, `<b>${s.r.item}</b>` +
        `<div class="row"><span>${s.r.total ? (opts.totalLabel || '储量') : '变动'}</span><span class="mono">${s.r.total || s.r.value < 0 ? '' : '+'}${fmt(s.r.value, 1)} ${unit}</span></div>` +

/* 敏感性小图：一个参数一张图（横轴单位各不相同，绝不合进一张双轴图） */
function deltaLine(host, cfg) {
  mount(host, W => {
    const g = frame(W, 210, { l: 52, r: 14, t: 14, b: 40 });
    const lo = Math.min(...cfg.y, 0), hi = Math.max(...cfg.y, 0), py = (hi - lo) * .08 || 1;
    const xd = [Math.min(...cfg.x), Math.max(...cfg.x)];
    const xDigits = (xd[1] - xd[0]) < 10 ? 2 : 0;
    const { X, Y } = axes(g, xd, [lo - py, hi + py], cfg.xLabel, null, t => fmt(t, xDigits), compactT);
    const { svg, pad, iw, ih } = g;
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0), stroke: cssVar('--rule'), 'stroke-width': 1 }));
    if (Number.isFinite(cfg.baseX)) {
      svg.appendChild(s_('line', { x1: X(cfg.baseX), x2: X(cfg.baseX), y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: X(cfg.baseX) + 5, y: pad.t + 11, fill: cssVar('--muted'), 'font-size': FS.note }, '基准'));
    }
    const pts = cfg.x.map((x, i) => ({ x, y: cfg.y[i] }));
    svg.appendChild(s_('polyline', { class: 'a-clip', points: pts.map(p => `${X(p.x)},${Y(p.y)}`).join(' '), fill: 'none', stroke: cfg.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    [pts[0], pts.at(-1)].forEach(p => svg.appendChild(s_('circle', { class: 'a-clip', cx: X(p.x), cy: Y(p.y), r: 4, fill: cfg.color, stroke: cssVar('--surface'), 'stroke-width': 2 })));
    const cross = s_('line', { y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1, opacity: 0 });
    svg.appendChild(cross);
    const hit = s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      const xv = xd[0] + (svgX(svg, ev, W) - pad.l) / iw * (xd[1] - xd[0]);
      const p = pts.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a, pts[0]);
      cross.setAttribute('x1', X(p.x)); cross.setAttribute('x2', X(p.x)); cross.setAttribute('opacity', 1);
      showTip(ev, `<b>${cfg.xLabel} ${fmt(p.x, xDigits)}</b><div class="row"><span>PDP 变化</span><span class="mono">${p.y >= 0 ? '+' : ''}${fmt(p.y, 0)} t</span></div>`);
    });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
    svg.appendChild(hit);
    host.appendChild(svg);
  });
}

/* ══════════════════════════════════════════════════════════════
   2b. 可解释性与诊断图表：SHAP 瀑布、蜂群、区间对比、时间归因热力条、双对数诊断、回放曲线

const FEAT = f => FEATURE_CN[f] || f;
const CHANNEL_CN = { log_oil: '日产油', on: '开井', whp_rel: '相对井口压力', water_cut: '含水', log_gor: '气油比', log_cum: '累产' };
const lerpHex = (a, b, t) => {
  const A = _hex(a), B = _hex(b), k = Math.max(0, Math.min(1, t));
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`;
};
const rampLegend = (label, lo, hi, extra) => el('div', { class: 'legend' }, [
  el('span', { text: label }), el('span', { class: 'muted', text: lo }),
  el('i', { class: 'swatchbar', style: `background:linear-gradient(90deg,${[0, .25, .5, .75, 1].map(rampColor).join(',')})` }),
  el('span', { class: 'muted', text: hi }), extra ? el('span', { class: 'muted', text: extra }) : null]);

/* 条款号可点：智能问答里的 [Rule 4-10(a)(24)] 直接跳到条文原文 */
const CITE_RE = /\[((?:Rule|Item)\s[^\]]+)\]/g;
function citeNodes(text) {
  const out = [];
  let last = 0;
  for (const m of String(text || '').matchAll(CITE_RE)) {
    out.push(text.slice(last, m.index));
    out.push(el('a', { class: 'cite', href: '#/standards', text: m[0], title: '查看条款原文', onclick: () => { S.clause = m[1]; } }));
    last = m.index + m[0].length;
  }
  out.push(String(text || '').slice(last));
  return out.filter(x => x !== '');
}

/* SHAP 瀑布：基准值 → 逐个特征的推动 → 模型输出。TreeSHAP 可加，首尾严格闭合 */
function shapWaterfall(host, sh, opts = {}) {
  const d = opts.digits ?? 2, unit = opts.unit || '';
  const rows = [{ label: '基准值（训练集平均）', kind: 'base', v: sh.expected_value }];
  let run = sh.expected_value;
  sh.contributions.forEach(c => { rows.push({ label: FEAT(c.feature), raw: c.value, from: run, to: run + c.contrib, d: c.contrib }); run += c.contrib; });
  if (sh.n_rest) { rows.push({ label: `其余 ${sh.n_rest} 个特征`, from: run, to: run + sh.rest, d: sh.rest, rest: true }); run += sh.rest; }
  rows.push({ label: '模型输出 · P50', kind: 'total', v: sh.prediction });
  mount(host, W => {
    const rowH = 26, labelW = W < 480 ? 112 : 172, valW = 78, top = 6, h = rows.length * rowH + top + 26;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: 'img', 'aria-label': 'SHAP 瀑布图' });

    lo -= padv; hi += padv;
    const x0 = labelW, x1 = W - valW, X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);

      svg.appendChild(svgText({ x: X(t), y: h - 8, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, compactT(t)));
    });

        svg.appendChild(s_('circle', { class: 'a-pop', style: `--d:${i * 55}ms`, cx: x, cy, r: 4, fill: c, stroke: cssVar('--surface'), 'stroke-width': 1.5 }));
        txt = fmt(r.v, d);
      } else {

        svg.appendChild(s_('path', { class: up ? 'a-right' : 'a-left', style: `--d:${i * 55}ms`, d: barPath(a, cy - 7, bw, 14, up ? 'right' : 'left'),

/* 全局 SHAP 蜂群：每个点一口井，横轴 = 贡献，颜色 = 该井的特征取值（顺序色） */
function beeswarm(host, g, opts = {}) {
  const feats = g.features.slice(0, opts.top || 10);
  mount(host, W => {
    const rowH = W < 520 ? 30 : 34, labelW = W < 480 ? 112 : 168, padR = 16, top = 6, h = feats.length * rowH + top + 28;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: 'img', 'aria-label': '全局 SHAP 蜂群图' });
    const all = feats.flatMap(f => f.points.map(p => p[0]));
    let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
    const pd = (hi - lo) * .05 || 1;
    lo -= pd; hi += pd;
    const X = v => labelW + (v - lo) / (hi - lo) * (W - labelW - padR);
    niceTicks(lo, hi, Math.max(3, Math.floor((W - labelW) / 90))).forEach(t => {
      svg.appendChild(s_('line', { x1: X(t), x2: X(t), y1: top, y2: h - 22, stroke: cssVar(Math.abs(t) < 1e-12 ? '--rule' : '--rule-soft'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: X(t), y: h - 8, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, compactT(t)));
    });
    const neutral = cssVar('--neutral'), surf = cssVar('--surface');
    feats.forEach((f, i) => {
      const cy = top + i * rowH + rowH / 2, amp = rowH / 2 - 3;

      svg.appendChild(svgText({ x: labelW - 10, y: cy + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, FEAT(f.feature)));
      const gRow = s_('g', { class: 'a-fade', style: `--d:${i * 70}ms` });
      const pts = f.points.map(p => ({ x: X(p[0]), v: p[0], n: p[1] })).sort((a, b) => a.x - b.x);
      const cells = new Map();
      pts.forEach(p => {
        const key = Math.round(p.x / 3.2), k = cells.get(key) || 0;
        cells.set(key, k + 1);
        p.y = cy + Math.max(-amp, Math.min(amp, (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 2.6));
        gRow.appendChild(s_('circle', { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: 2.3, fill: p.n == null ? neutral : rampColor(p.n), 'fill-opacity': .92, stroke: surf, 'stroke-width': .4 }));
      });
      svg.appendChild(gRow);
      const hit = s_('rect', { x: 0, y: cy - rowH / 2, width: W, height: rowH, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => {
        const xv = svgX(svg, ev, W), p = pts.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a, pts[0]);
        showTip(ev, `<b>${FEAT(f.feature)}</b><div class="row"><span>平均 |SHAP|</span><span class="mono">${fmt(f.mean_abs)}</span></div>` +
          `<div class="row"><span>光标处一口井的贡献</span><span class="mono">${signed(p.v, 2)}</span></div>` +
          `<div class="row"><span>该井取值位置</span><span class="mono">${p.n == null ? '缺失' : fmt(p.n * 100, 0) + '%'}</span></div>`);
      });
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);

    host.appendChild(svg);

}

/* 时间归因热力条：上 = 前 90 天日产油；中 = 6 个输入通道 × 逐日积分梯度（发散色）；下 = 逐日合计 */
function heatStrip(host, t) {
  const C = t.matrix.length, T = t.matrix[0].length;
  const flat = t.matrix.flat().map(Math.abs).sort((a, b) => a - b);
  const vmax = flat[Math.floor(flat.length * .98)] || flat.at(-1) || 1;
  const oil = new Map(t.daily_oil.map(p => [p[0], p[1]]));
  mount(host, W => {
    const labelW = W < 480 ? 80 : 104, padR = 10, oilH = 58, cellH = W < 520 ? 14 : 17, gap = 10, sumH = 36, top = 4;
    const heatTop = top + oilH + gap, sumTop = heatTop + C * cellH + gap, h = sumTop + sumH + 24;
    const iw = W - labelW - padR, cw = iw / T;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: 'img', 'aria-label': '序列模型时间归因热力图' });
    const surf = cssVar('--surface'), pos = cssVar('--c1'), neg = cssVar('--c2'), muted = cssVar('--muted');
    const colorOf = v => lerpHex(surf, v >= 0 ? pos : neg, Math.pow(Math.min(1, Math.abs(v) / vmax), .75));
    const DX = day => labelW + (day - .5) * cw;
    const pts = t.daily_oil.filter(p => p[1] != null && p[0] <= T);
    const omax = Math.max(...pts.map(p => p[1]), 0) || 1, OY = v => top + oilH - v / omax * (oilH - 6);
    if (pts.length) {
      const line = pts.map(p => `${DX(p[0]).toFixed(1)},${OY(p[1]).toFixed(1)}`).join(' L');
      svg.appendChild(s_('path', { class: 'a-clip', d: `M${DX(pts[0][0]).toFixed(1)},${top + oilH} L${line} L${DX(pts.at(-1)[0]).toFixed(1)},${top + oilH}Z`, fill: cssVar('--c3'), 'fill-opacity': .14 }));
      svg.appendChild(s_('path', { class: 'a-clip', d: 'M' + line, fill: 'none', stroke: cssVar('--c3'), 'stroke-width': 1.6, 'stroke-linejoin': 'round' }));
    }
    svg.appendChild(svgText({ x: labelW - 10, y: top + oilH / 2 + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, '实测曲线'));
    svg.appendChild(svgText({ x: labelW + 4, y: top + 10, fill: muted, 'font-size': FS.note }, `最高 ${fmt(omax, 1)} t/d`));
    t.matrix.forEach((row, c) => {
      const y = heatTop + c * cellH;
      svg.appendChild(svgText({ x: labelW - 10, y: y + cellH / 2 + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, CHANNEL_CN[t.channels[c]] || t.channels[c]));
      row.forEach((v, d) => svg.appendChild(s_('rect', { class: 'a-fade', style: `--d:${Math.round(d * 7)}ms`, x: (labelW + d * cw).toFixed(2), y, width: Math.max(cw - .5, .6).toFixed(2), height: cellH - 1.5, fill: colorOf(v) })));
    });
    const smax = Math.max(...t.per_day.map(Math.abs)) || 1, mid = sumTop + sumH / 2;
    svg.appendChild(s_('line', { x1: labelW, x2: labelW + iw, y1: mid, y2: mid, stroke: cssVar('--rule'), 'stroke-width': 1 }));
    t.per_day.forEach((v, d) => {
      const bh = Math.abs(v) / smax * (sumH / 2 - 1);
      svg.appendChild(s_('rect', { class: v >= 0 ? 'a-up' : 'a-down', style: `--d:${Math.round(d * 7) + 200}ms`, x: (labelW + d * cw + .5).toFixed(2), y: v >= 0 ? mid - bh : mid,
        width: Math.max(cw - 1, .6).toFixed(2), height: Math.max(bh, .4), fill: v >= 0 ? pos : neg }));
    });
    svg.appendChild(svgText({ x: labelW - 10, y: mid + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, '逐日合计'));
    [1, 15, 30, 45, 60, 75, 90].filter(d => d <= T).forEach(d => svg.appendChild(
      svgText({ x: DX(d), y: h - 8, 'text-anchor': 'middle', fill: muted, 'font-size': FS.tick }, `第 ${d} 天`)));
    const col = s_('rect', { x: 0, y: heatTop - 3, width: Math.max(cw, 2), height: sumTop + sumH - heatTop + 3, fill: 'none', stroke: cssVar('--ink'), 'stroke-width': 1, opacity: 0, rx: 1 });
    svg.appendChild(col);
    const hit = s_('rect', { x: labelW, y: top, width: iw, height: sumTop + sumH - top, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      const d = Math.max(0, Math.min(T - 1, Math.floor((svgX(svg, ev, W) - labelW) / cw)));
      col.setAttribute('x', labelW + d * cw); col.setAttribute('opacity', .6);
      let html = `<b>投产第 ${d + 1} 天</b><div class="row"><span>日产油</span><span class="mono">${oil.has(d + 1) ? fmt(oil.get(d + 1), 2) + ' t' : '—'}</span></div>`;
      t.matrix.forEach((row, c) => { html += `<div class="row"><span>${CHANNEL_CN[t.channels[c]] || t.channels[c]}</span><span class="mono">${signed(row[d], 4)}</span></div>`; });
      html += `<div class="row"><span><b>当日合计</b></span><span class="mono">${signed(t.per_day[d], 4)}</span></div>`;
      showTip(ev, html);
    });
    hit.addEventListener('mouseleave', () => { col.setAttribute('opacity', 0); hideTip(); });
    svg.appendChild(hit);
    host.appendChild(svg);
  });
}

/* 双对数诊断：斜率参考线（线性流 −1/2 等）从首个实测点出发 */
function logLogChart(host, cfg) {
  mount(host, W => {
    const pts = cfg.series.flatMap(s => s.points).filter(p => p[0] > 0 && p[1] > 0);
    if (!pts.length) { host.appendChild(el('div', { class: 'empty', text: cfg.empty || '数据不足，无法绘制诊断图' })); return; }
    const g = frame(W, W < 520 ? 240 : 290, { l: 54, r: 18, t: 14, b: 40 });
    const { svg, pad, iw, ih } = g, L = Math.log10;
    let x0 = L(Math.min(...pts.map(p => p[0]))), x1 = L(Math.max(...pts.map(p => p[0])));
    let y0 = L(Math.min(...pts.map(p => p[1]))), y1 = L(Math.max(...pts.map(p => p[1])));
    const px = Math.max((x1 - x0) * .05, .06), py = Math.max((y1 - y0) * .1, .06);
    x0 -= px; x1 += px; y0 -= py; y1 += py;
    const X = v => pad.l + (L(v) - x0) / (x1 - x0) * iw, Y = v => pad.t + ih - (L(v) - y0) / (y1 - y0) * ih;
    const logTicks = (a, b) => {
      const out = [], dense = b - a < 2.2;
      for (let k = Math.floor(a); k <= Math.ceil(b); k++) [1, 2, 5].forEach(m => {
        const v = m * Math.pow(10, k), lv = L(v);
        if (lv >= a && lv <= b && (m === 1 || dense)) out.push(v);
      });
      return out;
    };
    const lab = v => v >= 1e4 ? compactT(v) : v >= 1 ? fmt(v, 0) : fmt(v, 3);
    const grid = cssVar('--rule-soft'), muted = cssVar('--muted');
    logTicks(y0, y1).forEach(v => {
      svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(v), y2: Y(v), stroke: grid, 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: pad.l - 8, y: Y(v) + 4, 'text-anchor': 'end', fill: muted, 'font-size': FS.tick }, lab(v)));
    });
    logTicks(x0, x1).forEach(v => {
      svg.appendChild(s_('line', { x1: X(v), x2: X(v), y1: pad.t, y2: pad.t + ih, stroke: grid, 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: X(v), y: pad.t + ih + 16, 'text-anchor': 'middle', fill: muted, 'font-size': FS.tick }, lab(v)));
    });
    svg.appendChild(s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'none', stroke: cssVar('--rule'), 'stroke-width': 1 }));
    if (cfg.xLabel) svg.appendChild(svgText({ x: pad.l + iw / 2, y: g.h - 4, 'text-anchor': 'middle', fill: muted, 'font-size': FS.note }, cfg.xLabel));
    if (cfg.yLabel) svg.appendChild(svgText({ x: 12, y: pad.t + ih / 2, 'text-anchor': 'middle', fill: muted, 'font-size': FS.note, transform: `rotate(-90 12 ${pad.t + ih / 2})` }, cfg.yLabel));
    (cfg.guides || []).forEach((gd, k) => {
      const [ax, ay] = gd.anchor;
      let xe = Math.pow(10, x1 - (x1 - x0) * .03);
      const yb = Math.pow(10, gd.slope < 0 ? y0 : y1);
      xe = Math.min(xe, ax * Math.pow(yb / ay, 1 / gd.slope));
      if (!(xe > ax)) return;
      const ye = ay * Math.pow(xe / ax, gd.slope);
      svg.appendChild(s_('line', { class: 'a-fade', style: `--d:${500 + k * 120}ms`, x1: X(ax), y1: Y(ay), x2: X(xe), y2: Y(ye), stroke: cssVar('--neutral-2'), 'stroke-width': 1.3, 'stroke-dasharray': '6 4' }));
      svg.appendChild(svgText({ class: 'a-fade', style: `--d:${600 + k * 120}ms`, x: X(xe) - 4, y: Y(ye) + (gd.slope < 0 ? -6 : 14), 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.note }, gd.label));
    });
    cfg.series.forEach(s => {
      const sp = s.points.filter(p => p[0] > 0 && p[1] > 0);
      if (!sp.length) return;
      if (s.line !== false) svg.appendChild(s_('polyline', { class: 'a-clip', points: sp.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' '), fill: 'none', stroke: s.color, 'stroke-width': s.dots ? 1 : 2, 'stroke-opacity': s.dots ? .45 : 1 }));
      if (s.dots) sp.forEach(p => svg.appendChild(s_('circle', { class: 'a-clip', cx: X(p[0]).toFixed(1), cy: Y(p[1]).toFixed(1), r: 3, fill: s.color, stroke: cssVar('--surface'), 'stroke-width': 1 })));
    });
    const main = cfg.series[0].points.filter(p => p[0] > 0 && p[1] > 0);
    const ring = s_('circle', { r: 6, fill: 'none', stroke: cssVar('--ink'), 'stroke-width': 1.5, opacity: 0 });
    svg.appendChild(ring);
    const hit = s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      const lx = x0 + (svgX(svg, ev, W) - pad.l) / iw * (x1 - x0);
      const p = main.reduce((a, b) => Math.abs(L(b[0]) - lx) < Math.abs(L(a[0]) - lx) ? b : a, main[0]);
      ring.setAttribute('cx', X(p[0])); ring.setAttribute('cy', Y(p[1])); ring.setAttribute('opacity', 1);
      showTip(ev, `<b>${cfg.series[0].name}</b><div class="row"><span>${cfg.xName || 'x'}</span><span class="mono">${fmt(p[0], 2)}</span></div>` +
        `<div class="row"><span>${cfg.yName || 'y'}</span><span class="mono">${fmt(p[1], 4)}</span></div>`);
    });
    hit.addEventListener('mouseleave', () => { ring.setAttribute('opacity', 0); hideTip(); });
    svg.appendChild(hit);
    host.appendChild(svg);
  });
}

/* 带播放头的面积曲线：点击 / 拖动跳到任意月份，set(i) 由回放控制器驱动 */
function areaPlayhead(host, cfg) {
  const st = { i: cfg.index ?? cfg.values.length - 1, ph: null };
  const place = () => {
    if (!st.ph) return;
    const { X, Y, line, dot, label, pad, W } = st.ph, x = X(st.i), y = Y(cfg.values[st.i] || 0);
    line.setAttribute('x1', x); line.setAttribute('x2', x);
    dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    label.setAttribute('x', Math.min(Math.max(x, pad.l + 28), W - 30));
    label.textContent = cfg.labels[st.i];
  };
  mount(host, W => {
    const g = frame(W, cfg.height || 196, { l: 50, r: 14, t: 22, b: 28 });
    const { svg, pad, iw, ih } = g, n = cfg.values.length;
    const ymax = Math.max(...cfg.values) * 1.1 || 1;
    const X = i => pad.l + i / Math.max(n - 1, 1) * iw, Y = v => pad.t + ih - v / ymax * ih;
    yGrid(g, [0, ymax], Y, compactT);
    cfg.labels.forEach((m, i) => {
      if (!/-01$/.test(m)) return;
      svg.appendChild(s_('line', { x1: X(i), x2: X(i), y1: pad.t + ih, y2: pad.t + ih + 4, stroke: cssVar('--rule'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: X(i), y: pad.t + ih + 17, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, m.slice(0, 4)));
    });
    const c = cssVar('--c1'), pts = cfg.values.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' L');
    svg.appendChild(s_('path', { class: 'a-clip', d: `M${X(0)},${pad.t + ih} L${pts} L${X(n - 1)},${pad.t + ih}Z`, fill: c, 'fill-opacity': .15 }));
    svg.appendChild(s_('path', { class: 'a-clip', d: 'M' + pts, fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-linejoin': 'round' }));
    const line = s_('line', { y1: pad.t, y2: pad.t + ih, stroke: cssVar('--brand'), 'stroke-width': 1.5 });
    const dot = s_('circle', { r: 4.5, fill: cssVar('--brand'), stroke: cssVar('--surface'), 'stroke-width': 2 });
    const label = svgText({ y: pad.t - 7, 'text-anchor': 'middle', fill: cssVar('--ink'), 'font-size': FS.label, 'font-weight': 600 }, '');
    svg.append(line, dot, label);
    const idxAt = ev => Math.max(0, Math.min(n - 1, Math.round((svgX(svg, ev, W) - pad.l) / iw * (n - 1))));
    const hit = s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent', style: 'cursor:pointer' });
    let dragging = false;
    hit.addEventListener('pointerdown', ev => { dragging = true; hit.setPointerCapture(ev.pointerId); cfg.onSeek && cfg.onSeek(idxAt(ev)); });
    hit.addEventListener('pointerup', () => { dragging = false; });
    hit.addEventListener('mousemove', ev => {
      const i = idxAt(ev);
      if (dragging && cfg.onSeek) cfg.onSeek(i);
      showTip(ev, `<b>${cfg.labels[i]}</b><div class="row"><span>${cfg.name || ''}</span><span class="mono">${fmt(cfg.values[i], 1)} ${cfg.unit || ''}</span></div><div style="color:var(--muted);margin-top:3px">点击跳到该月</div>`);
    });
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
    st.ph = { X, Y, line, dot, label, pad, W };
    place();
    host.appendChild(svg);
  });
  return { set: i => { st.i = i; place(); } };
}

/* 内容就位：面板依次浮现，指标数值从 0 滚动到目标值（只动 transform / opacity 与文字） */
function show(target, ...nodes) {
  nodes = nodes.filter(Boolean);
  target.replaceChildren(...nodes);
  if (!MOTION) return;
  let i = 0;
  const mark = n => { if (n.classList) { n.classList.add('rv'); n.style.setProperty('--i', i++); } };
  nodes.forEach(n => {
    if (n.classList && (n.classList.contains('row') || n.classList.contains('stack'))) {
      [...n.children].forEach(c => (c.classList.contains('stack') ? [...c.children].forEach(mark) : mark(c)));
    } else mark(n);
  });
  target.querySelectorAll('.kval').forEach(countUp);
}
function countUp(node) {
  const tn = node.firstChild;
  if (!tn || tn.nodeType !== 3) return;
  const txt = tn.nodeValue.trim(), m = /^-?[\d,]*\d(\.(\d+))?$/.exec(txt);
  if (!m) return;
  const target = parseFloat(txt.replace(/,/g, '')), dec = m[2] ? m[2].length : 0, comma = txt.includes(',');
  if (!Number.isFinite(target) || target === 0) return;
  const f = x => comma ? x.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : x.toFixed(dec);
  const t0 = performance.now(), dur = 850;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    tn.nodeValue = k < 1 ? f(target * (1 - Math.pow(1 - k, 3))) : txt;
    if (k < 1) requestAnimationFrame(step);
  };
  tn.nodeValue = f(0);
  requestAnimationFrame(step);
}
