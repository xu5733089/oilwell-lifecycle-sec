<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>油井全生命周期与 SEC 储量预评估平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C16 3 6 15 6 21a10 10 0 0 0 20 0C26 15 16 3 16 3z' fill='%230E8F7F'/%3E%3C/svg%3E">
<style>
/* ────────────────────────────────────────────────────────────────
   零依赖：不引 Vue / ECharts / 任何 CDN。
   内网装不了 npm 也连不了外网，图表全部手写 SVG。
   配色经 CVD 校验（三色两两 ΔE ≥ 13，色盲可分辨）。
   ──────────────────────────────────────────────────────────────── */
:root{
  --paper:#EEF1EE; --surface:#FCFCFB; --surface-2:#E7ECE8; --sunk:#E9EEEA;
  --ink:#15211D; --ink-2:#3B4941; --muted:#6B7973; --rule:#CDD7D0; --rule-soft:#DFE6E1;
  /* 分类色：validate_palette.js light / dark 两种模式全项通过（四色相邻 CVD ΔE ≥ 10） */
  --c1:#0E8F7F; --c2:#C25E12; --c3:#3B4FA8; --c4:#B8487F;
  --c1-wash:#0E8F7F26; --c2-wash:#C25E1226; --c1-soft:#8CC7BE;
  --neutral:#A3ACA7; --neutral-2:#6E7A74;
  --ok:#2C6B47; --warn:#8D6410; --crit:#96382C;
  --ok-bg:#2C6B4718; --warn-bg:#8D641018; --crit-bg:#96382C18;
  --shadow:0 1px 2px rgba(20,40,34,.05), 0 10px 26px -18px rgba(20,40,34,.3);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0D1412; --surface:#151D1A; --surface-2:#1D2723; --sunk:#111917;
  --ink:#E3EAE5; --ink-2:#B9C6BF; --muted:#87958E; --rule:#2C3934; --rule-soft:#233029;
  /* dark 模式单独选步，不是自动翻转 */
  --c1:#19A492; --c2:#D2731F; --c3:#5468C4; --c4:#D0679B;
  --c1-wash:#19A49230; --c2-wash:#D2731F30; --c1-soft:#2F6F66;
  --neutral:#56615C; --neutral-2:#8A9690;
  --ok:#63BE88; --warn:#D3A74E; --crit:#E17E6F;
  --ok-bg:#63BE8820; --warn-bg:#D3A74E20; --crit-bg:#E17E6F20;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#0D1412; --surface:#151D1A; --surface-2:#1D2723; --sunk:#111917;
  --ink:#E3EAE5; --ink-2:#B9C6BF; --muted:#87958E; --rule:#2C3934; --rule-soft:#233029;
  --c1:#19A492; --c2:#D2731F; --c3:#5468C4; --c4:#D0679B;
  --c1-wash:#19A49230; --c2-wash:#D2731F30; --c1-soft:#2F6F66;
  --neutral:#56615C; --neutral-2:#8A9690;
  --ok:#63BE88; --warn:#D3A74E; --crit:#E17E6F;
  --ok-bg:#63BE8820; --warn-bg:#D3A74E20; --crit-bg:#E17E6F20;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-size:14px; line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
              "Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      font-variant-numeric:tabular-nums}

/* ── 顶栏 ── */
header{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
.bar{max-width:1400px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:600;font-size:15.5px;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:3px;
      border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.warn{color:var(--warn);border-color:currentColor;background:var(--warn-bg)}
.chip.ok{color:var(--ok);border-color:currentColor;background:var(--ok-bg)}
.chip.crit{color:var(--crit);border-color:currentColor;background:var(--crit-bg)}
.chip.solid{background:var(--sunk)}
button.ghost{background:none;border:1px solid var(--rule);color:var(--ink-2);border-radius:3px;
             padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}
button.ghost:hover{border-color:var(--c1);color:var(--c1)}
button.ghost:focus-visible{outline:2px solid var(--c1);outline-offset:1px}

nav.tabs{max-width:1400px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:9px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--c1);border-bottom-color:var(--c1);font-weight:600}
nav.tabs button:hover{color:var(--ink)}

main{max-width:1400px;margin:0 auto;padding:22px}
section[hidden]{display:none!important}

/* ── 卡片与网格 ── */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2x2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:520px){.g2x2{grid-template-columns:1fr}}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px 18px}
.card h3{margin:0 0 3px;font-size:13.5px;font-weight:600}
.card .sub{margin:0 0 14px;font-size:11.5px;color:var(--muted)}
.card.plain{border:0;background:none;padding:0}

/* KPI：数字是重点，才用大号 */
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:26px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .n{font-size:11.5px;color:var(--ink-2)}

/* ── 表格 ── */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:420px}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
   font-weight:500;padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 控件 ── */
select,input[type=text]{background:var(--surface);color:var(--ink);border:1px solid var(--rule);
  border-radius:3px;padding:5px 9px;font-size:13px;font-family:inherit;max-width:100%}
select:focus,input:focus{outline:2px solid var(--c1);outline-offset:-1px;border-color:var(--c1)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filters label{font-size:12px;color:var(--muted)}
.fgroup{display:inline-flex;gap:8px;align-items:center;max-width:100%}
.fgroup select{min-width:0}
.fgroup label{white-space:nowrap}
button.primary{background:var(--c1);color:#fff;border:0;border-radius:3px;padding:6px 16px;
  font-size:13px;cursor:pointer;font-family:inherit}
button.primary:disabled{opacity:.5;cursor:default}

/* ── 图表 ── */
figure{margin:0}
figure svg{display:block;width:100%;height:auto;overflow:visible}
figcaption{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:2.5px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.band{height:9px;border-radius:2px;opacity:.5}
.legend i.dash{background:none;border-top:2px dashed var(--muted);height:0}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--rule);
  border-radius:4px;padding:7px 10px;font-size:11.5px;box-shadow:var(--shadow);z-index:60;
  opacity:0;transition:opacity .08s;max-width:260px}
.tip b{font-weight:600}
.tip .row{display:flex;gap:10px;justify-content:space-between}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

/* ── 检查清单 / 诊断 ── */
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px}
.chk li:last-child{border-bottom:0}
.chk .it{font-weight:600}
.chk .ev{color:var(--ink-2);font-size:11.5px;margin-top:2px}
.chk .ct{color:var(--muted);font-size:11px;margin-top:2px}
.finding{border-left:2px solid var(--rule);padding:8px 0 8px 12px;margin-bottom:8px;font-size:12.5px}
.finding.warn{border-left-color:var(--warn)}
.finding.critical{border-left-color:var(--crit)}
.finding.info{border-left-color:var(--ok)}
.finding .act{color:var(--muted);font-size:11.5px;margin-top:3px}

/* ── 对话 ── */
.chatgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:1100px){.chatgrid{grid-template-columns:minmax(0,1.35fr) minmax(320px,.95fr)}}
.answer{white-space:pre-wrap;font-size:13px;line-height:1.72;background:var(--sunk);
  border:1px solid var(--rule-soft);border-radius:4px;padding:14px 16px;max-height:520px;overflow:auto}
.trace{display:flex;flex-direction:column;gap:0}
.tstep{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.tstep:last-child{border-bottom:0}
.tdot{width:9px;height:9px;border-radius:50%;background:var(--c1);margin-top:5px}
.tstep.failed .tdot,.tstep.denied .tdot{background:var(--crit)}
.tname{font-size:12.5px;font-weight:600}
.targs{font-size:11px;color:var(--muted);word-break:break-all}
.terr{font-size:11.5px;color:var(--crit)}
.examples{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.exgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.exlabel{font-size:11.5px;color:var(--muted);min-width:64px}
.examples button{background:var(--sunk);border:1px solid var(--rule-soft);color:var(--ink-2);
  border-radius:12px;padding:3px 11px;font-size:11.5px;cursor:pointer;font-family:inherit}
.examples button:hover{border-color:var(--c1);color:var(--c1)}

.empty{color:var(--muted);font-size:12.5px;padding:22px 0;text-align:center}

/* ── SEC 单元页 ── */
.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:12px 14px}
.stat .v{font-size:22px;font-weight:600;line-height:1.2}
.inset .stat{background:var(--sunk);border-color:var(--rule-soft)}
.legend i.box{height:9px;width:9px;border-radius:2px}
.legend i.dot{height:9px;width:9px;border-radius:50%}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
details.tv{margin-top:10px}
details.tv summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
details.tv summary:hover{color:var(--c1)}
.block h4{margin:0 0 2px;font-size:12.5px;font-weight:600}
.err{color:var(--crit);font-size:12.5px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">油井全生命周期与 SEC 储量预评估平台
      <small>大庆油田"人工智能+"青年创新比赛 · 勘探开发研究院</small></div>
    <div class="spacer"></div>
    <span class="chip warn" id="dsBadge" hidden></span>
    <span class="chip solid mono" id="mvBadge">—</span>
    <button class="ghost" id="themeBtn" type="button">深色</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">总览</button>
    <button role="tab" data-tab="well" aria-selected="false">单井工作台</button>
    <button role="tab" data-tab="reserves" aria-selected="false">储量与 SEC</button>
    <button role="tab" data-tab="unit" aria-selected="false">SEC 构成评估</button>
    <button role="tab" data-tab="monitor" aria-selected="false">运行监控</button>
    <button role="tab" data-tab="chat" aria-selected="false">智能体对话</button>
    <button role="tab" data-tab="eval" aria-selected="false">评测</button>
  </nav>
</header>

<main>
  <section id="tab-overview"></section>
  <section id="tab-well" hidden></section>
  <section id="tab-reserves" hidden></section>
  <section id="tab-unit" hidden></section>
  <section id="tab-monitor" hidden></section>
  <section id="tab-chat" hidden></section>
  <section id="tab-eval" hidden></section>
</main>

<div class="tip" id="tip"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   1. 基础工具
   ══════════════════════════════════════════════════════════════ */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c === null || c === undefined) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
};
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v))
  ? '—' : Number(v).toLocaleString('zh-CN', { maximumFractionDigits: d });
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

async function api(path, params) {
  const q = params ? '?' + new URLSearchParams(params) : '';
  const r = await fetch('/api/v1' + path + q);
  const j = await r.json().catch(() => ({ error: '响应不是合法 JSON' }));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* ══════════════════════════════════════════════════════════════
   2. 手写 SVG 图表
   规矩：单一坐标轴（绝不双轴）、细笔画、网格退到背景、
   文字用文本色不用系列色、每张图都有 hover 层。
   尺寸：按容器的实际像素宽度 1:1 绘制 —— 文字恒定 11~12px，
   不会在宽卡片里放大、在窄卡片里缩成蚂蚁字；容器宽度变化时自动重画。
   ══════════════════════════════════════════════════════════════ */
const NS = 'http://www.w3.org/2000/svg';
const s_ = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs))
    if (v !== null && v !== undefined) n.setAttribute(k, v);
  return n;
};
const svgText = (attrs, text) => { const t = s_('text', attrs); t.textContent = text; return t; };
const tip = $('#tip');
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.opacity = '1';
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = evt.clientY - h - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.opacity = '0'; };

const FS = { tick: 11, label: 12, note: 10.5 };
/* 数值紧凑写法：图上刻度用，精确值在提示框和表格视图里 */
const compactT = v => Math.abs(v) >= 1e4 ? fmt(v / 1e4, 1) + '万' : fmt(v, 0);
const fmtT = v => (v === null || v === undefined) ? '—'
  : Math.abs(v) >= 1e4 ? fmt(v / 1e4, 2) + ' 万 t' : fmt(v, 0) + ' t';

/* 挂载：等容器有了真实宽度再画，宽度变化时重画（图高固定，不会引发重画循环） */
const _ro = 'ResizeObserver' in window ? new ResizeObserver(entries => entries.forEach(e => {
  const host = e.target;
  if (!host.isConnected) { _ro.unobserve(host); return; }
  const w = Math.floor(e.contentRect.width);
  if (w > 0 && w !== host._w) { host._w = w; host.innerHTML = ''; hideTip(); host._draw(w); }
})) : null;
function mount(host, draw) {
  host.innerHTML = '';
  host._draw = draw; host._w = 0;
  if (_ro) _ro.observe(host);
  else requestAnimationFrame(() => draw(Math.floor(host.clientWidth) || 760));
}
const svgX = (svg, ev, W) => { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * (W / (r.width || W)); };

function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

/* 整数步长刚好越过数据范围时（如 ±4938 配 5000 步长）只剩一个刻度：退到更细的步长 */
function ticks(lo, hi, n) {
  const t = niceTicks(lo, hi, n);
  return t.length >= 3 ? t : niceTicks(lo, hi, n + 2);
}

function frame(w, h, pad) {
  const svg = s_('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: 'img' });
  return { svg, w, h, pad, iw: w - pad.l - pad.r, ih: h - pad.t - pad.b };
}
function axes(g, xd, yd, xLabel, yLabel, xFmt, yFmt) {
  const { svg, pad, iw, ih } = g;
  const X = v => pad.l + (v - xd[0]) / (xd[1] - xd[0] || 1) * iw;
  const Y = v => pad.t + ih - (v - yd[0]) / (yd[1] - yd[0] || 1) * ih;
  const grid = cssVar('--rule-soft'), muted = cssVar('--muted');
  ticks(yd[0], yd[1], Math.max(4, Math.floor(ih / 45))).forEach(t => {
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(t), y2: Y(t), stroke: grid, 'stroke-width': 1 }));
    svg.appendChild(svgText({ x: pad.l - 8, y: Y(t) + 4, 'text-anchor': 'end', fill: muted, 'font-size': FS.tick }, yFmt ? yFmt(t) : fmt(t, 2)));
  });
  ticks(xd[0], xd[1], Math.max(3, Math.floor(iw / 80))).forEach(t =>
    svg.appendChild(svgText({ x: X(t), y: pad.t + ih + 16, 'text-anchor': 'middle', fill: muted, 'font-size': FS.tick }, xFmt ? xFmt(t) : fmt(t, 0))));
  svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: pad.t + ih, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1 }));
  if (xLabel) svg.appendChild(svgText({ x: pad.l + iw / 2, y: g.h - 4, 'text-anchor': 'middle', fill: muted, 'font-size': FS.note }, xLabel));
  if (yLabel) svg.appendChild(svgText({ x: 12, y: pad.t + ih / 2, 'text-anchor': 'middle', fill: muted, 'font-size': FS.note, transform: `rotate(-90 12 ${pad.t + ih / 2})` }, yLabel));
  return { X, Y };
}

function yGrid(g, yd, Y, tickFmt) {
  const { svg, pad, iw, ih } = g;
  ticks(yd[0], yd[1], Math.max(4, Math.floor(ih / 45))).forEach(t => {
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(t), y2: Y(t), stroke: cssVar(t === 0 ? '--rule' : '--rule-soft'), 'stroke-width': 1 }));
    svg.appendChild(svgText({ x: pad.l - 8, y: Y(t) + 4, 'text-anchor': 'end', fill: cssVar('--muted'), 'font-size': FS.tick }, (tickFmt || compactT)(t)));
  });
}

/* 只圆"数据端"（4px），基线端保持方角 */
function barPath(x, y, w, h, end) {
  const r = Math.max(0, Math.min(4, w / 2, h / 2));
  if (end === 'top') return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  if (end === 'bottom') return `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`;
  if (end === 'right') return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
  if (end === 'left') return `M${x + w},${y}H${x + r}Q${x},${y} ${x},${y + r}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w}Z`;
  return `M${x},${y}H${x + w}V${y + h}H${x}Z`;
}

/* 折线 + 不确定性带。单一 y 轴：压力另起一张小图，绝不做双轴。 */
function lineChart(host, cfg) {
  mount(host, W => {
    const g = frame(W, W < 520 ? 240 : 300, { l: 50, r: 16, t: 16, b: 40 });
    const all = [];
    cfg.series.forEach(s => s.points.forEach(p => all.push(p.y)));
    (cfg.band || []).forEach(p => { all.push(p.lo); all.push(p.hi); });
    if (cfg.hline) all.push(cfg.hline.y);
    const ymax = Math.max(...all.filter(Number.isFinite)) * 1.12 || 1;
    const xs = cfg.series.flatMap(s => s.points.map(p => p.x)).concat((cfg.band || []).map(p => p.x));
    const xd = [Math.min(...xs), Math.max(...xs)], yd = [0, ymax];
    const { X, Y } = axes(g, xd, yd, cfg.xLabel, cfg.yLabel);
    const { svg, pad, iw, ih } = g;
    if (cfg.band && cfg.band.length) {
      const up = cfg.band.map(p => `${X(p.x)},${Y(p.hi)}`).join(' ');
      const dn = cfg.band.slice().reverse().map(p => `${X(p.x)},${Y(p.lo)}`).join(' ');
      svg.appendChild(s_('polygon', { points: up + ' ' + dn, fill: cfg.bandColor || cssVar('--c1'), 'fill-opacity': .16 }));
    }
    if (cfg.hline) {
      const y = Y(cfg.hline.y);
      svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: y, y2: y, stroke: cssVar('--muted'), 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
      svg.appendChild(svgText({ x: pad.l + iw, y: y - 6, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.note }, cfg.hline.label));
    }
    if (cfg.vline) {
      const x = X(cfg.vline.x);
      svg.appendChild(s_('line', { x1: x, x2: x, y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: x + 5, y: pad.t + 11, fill: cssVar('--muted'), 'font-size': FS.note }, cfg.vline.label));
    }
    cfg.series.forEach(s => {
      const pts = s.points.filter(p => Number.isFinite(p.y));
      if (!pts.length) return;
      svg.appendChild(s_('polyline', {
        points: pts.map(p => `${X(p.x)},${Y(p.y)}`).join(' '), fill: 'none',
        stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        'stroke-dasharray': s.dashed ? '6 4' : null
      }));
      if (s.dots) pts.forEach(p => svg.appendChild(s_('circle', {
        cx: X(p.x), cy: Y(p.y), r: 4, fill: s.color, stroke: cssVar('--surface'), 'stroke-width': 2
      })));
    });
    (cfg.markers || []).forEach(m => {
      svg.appendChild(s_('circle', { cx: X(m.x), cy: Y(m.y), r: 5, fill: 'none', stroke: m.color, 'stroke-width': 2 }));
      svg.appendChild(svgText({ x: X(m.x) + 9, y: Y(m.y) - 8, fill: cssVar('--ink-2'), 'font-size': FS.note }, m.label));
    });
    const cross = s_('line', { y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1, opacity: 0 });
    svg.appendChild(cross);
    const hit = s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
    svg.appendChild(hit);
    hit.addEventListener('mousemove', ev => {
      const xv = xd[0] + Math.max(0, svgX(svg, ev, W) - pad.l) / iw * (xd[1] - xd[0]);
      cross.setAttribute('x1', X(xv)); cross.setAttribute('x2', X(xv)); cross.setAttribute('opacity', 1);
      let html = `<b>${cfg.xLabel || 'x'} ${fmt(xv, 0)}</b>`;
      cfg.series.forEach(s => {
        const p = s.points.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a, s.points[0]);
        if (p && Number.isFinite(p.y))
          html += `<div class="row"><span><i class="sw" style="background:${s.color}"></i>${s.name}</span><span class="mono">${fmt(p.y)}</span></div>`;
      });
      if (cfg.band && cfg.band.length) {
        const p = cfg.band.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a, cfg.band[0]);
        html += `<div class="row"><span>P10–P90</span><span class="mono">${fmt(p.lo)} ~ ${fmt(p.hi)}</span></div>`;
      }
      showTip(ev, html);
    });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
    host.appendChild(svg);
  });
}

/* 发散条形图：零点中性轴；标签列与数值列各自留宽，长条也不会压到文字 */
function divergingBars(host, rows, unit, opts = {}) {
  mount(host, W => {
    const rowH = 28, labelW = W < 480 ? 104 : 176, valW = 62, h = rows.length * rowH + 30;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: 'img' });
    const max = Math.max(...rows.map(r => Math.abs(r.value))) || 1;
    const half = Math.max((W - labelW - valW * 2) / 2, 24), zero = labelW + valW + half;
    svg.appendChild(s_('line', { x1: zero, x2: zero, y1: 2, y2: h - 24, stroke: cssVar('--rule'), 'stroke-width': 1 }));
    rows.forEach((r, i) => {
      const y = i * rowH + 2, cy = y + rowH / 2, bw = Math.max(Math.abs(r.value) / max * half, 1.5);
      const pos = r.value >= 0, color = opts.color || (pos ? cssVar('--c1') : cssVar('--c2'));
      svg.appendChild(s_('path', { d: barPath(pos ? zero : zero - bw, cy - 6, bw, 12, pos ? 'right' : 'left'), fill: color }));
      svg.appendChild(svgText({ x: labelW - 10, y: cy + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, r.label));
      svg.appendChild(svgText({ x: pos ? zero + bw + 6 : zero - bw - 6, y: cy + 4, 'text-anchor': pos ? 'start' : 'end', fill: cssVar('--muted'), 'font-size': FS.note },
        (r.value > 0 ? '+' : '') + fmt(r.value, 2) + (opts.suffix || '')));
      const hit = s_('rect', { x: 0, y, width: W, height: rowH, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, opts.tip ? opts.tip(r) :
        `<b>${r.label}</b><div class="row"><span>该井取值</span><span class="mono">${fmt(r.raw)}</span></div>` +
        `<div class="row"><span>对预测的推动</span><span class="mono">${(r.value > 0 ? '+' : '') + fmt(r.value)} ${unit || ''}</span></div>`));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
    });
    svg.appendChild(svgText({ x: zero, y: h - 8, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.note },
      opts.axisLabel || `← 拉低　对预测的推动（${unit || ''}）　抬高 →`));
    host.appendChild(svg);
  });
}

/* 直方图：单一色相，P10/P50/P90 用参考线标注 */
function histogram(host, values, refs, xLabel) {
  mount(host, W => {
    const g = frame(W, 240, { l: 50, r: 16, t: 22, b: 40 });
    const lo = Math.min(...values), hi = Math.max(...values), nb = W < 520 ? 16 : 26;
    const step = (hi - lo) / nb || 1;
    const bins = new Array(nb).fill(0);
    values.forEach(v => bins[Math.min(nb - 1, Math.floor((v - lo) / step))]++);
    const ymax = Math.max(...bins) * 1.12 || 1;
    const { X, Y } = axes(g, [lo, hi], [0, ymax], xLabel, '样本数', compactT, t => fmt(t, 0));
    const { svg } = g;
    bins.forEach((c, i) => {
      const x0 = X(lo + i * step), x1 = X(lo + (i + 1) * step);
      const r = s_('rect', { x: x0 + 1, y: Y(c), width: Math.max(x1 - x0 - 2, 1), height: Math.max(g.pad.t + g.ih - Y(c), 0), fill: cssVar('--c1'), 'fill-opacity': .8, rx: 2 });
      svg.appendChild(r);
      r.addEventListener('mousemove', ev => showTip(ev,
        `<b>${fmt(lo + i * step, 0)} ~ ${fmt(lo + (i + 1) * step, 0)}</b><div class="row"><span>样本数</span><span class="mono">${c}</span></div>`));
      r.addEventListener('mouseleave', hideTip);
    });
    (refs || []).forEach(r => {
      if (!Number.isFinite(r.x)) return;
      svg.appendChild(s_('line', { x1: X(r.x), x2: X(r.x), y1: g.pad.t, y2: g.pad.t + g.ih, stroke: cssVar('--c2'), 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
      svg.appendChild(svgText({ x: X(r.x), y: g.pad.t - 6, 'text-anchor': 'middle', fill: cssVar('--ink-2'), 'font-size': FS.note }, r.label));
    });
    host.appendChild(svg);
  });
}

/* 井位散点：颜色=区块（分类），大小=累产（量级） */
function scatter(host, pts, colorKey, colors, onPick) {
  mount(host, W => {
    const g = frame(W, W < 520 ? 300 : 400, { l: 58, r: 16, t: 14, b: 42 });
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const pad = v => (Math.max(...v) - Math.min(...v)) * .06 || 1;
    const { X, Y } = axes(g, [Math.min(...xs) - pad(xs), Math.max(...xs) + pad(xs)],
      [Math.min(...ys) - pad(ys), Math.max(...ys) + pad(ys)],
      '相对东西向 (m，坐标已偏移)', '相对南北向 (m)', t => fmt(t / 1000, 1) + 'k', t => fmt(t, 0));
    const cmax = Math.max(...pts.map(p => p.size || 0)) || 1, rmax = W < 520 ? 5 : 7;
    pts.forEach(p => {
      const r = 3 + Math.sqrt((p.size || 0) / cmax) * rmax;
      const n = s_('circle', {
        cx: X(p.x), cy: Y(p.y), r, fill: colors[p[colorKey]] || cssVar('--muted'), 'fill-opacity': p.is_new ? .95 : .5,
        stroke: p.is_new ? cssVar('--ink') : cssVar('--surface'), 'stroke-width': p.is_new ? 1.4 : 1, style: 'cursor:pointer'
      });
      n.addEventListener('mousemove', ev => showTip(ev,
        `<b>${p.well_code}</b>　<span class="mono">${p.block} ${p.layer}</span>` +
        `<div class="row"><span>投产</span><span class="mono">${p.first_prod_date}</span></div>` +
        `<div class="row"><span>累产油</span><span class="mono">${fmt(p.cum_oil_t, 0)} t</span></div>` +
        `<div class="row"><span>生产历史</span><span class="mono">${p.history_days} d</span></div>` +
        (p.is_new ? '<div style="margin-top:4px;color:var(--c2)">新井 · 尚未走完生命周期</div>' : '')));
      n.addEventListener('mouseleave', hideTip);
      n.addEventListener('click', () => onPick && onPick(p.well_code));
      g.svg.appendChild(n);
    });
    host.appendChild(g.svg);
  });
}

/* 堆叠柱：正值向上堆、负值向下堆；段与段之间留 2px 表面色间隙 */
function stackedColumns(host, cfg) {
  mount(host, W => {
    const g = frame(W, W < 520 ? 240 : 290, { l: 54, r: 12, t: 12, b: 40 });
    const { svg, pad, iw, ih } = g, n = cfg.categories.length;
    const sums = sign => cfg.categories.map((_, i) => cfg.series.reduce((a, s) =>
      a + (sign > 0 ? Math.max(s.values[i] || 0, 0) : Math.min(s.values[i] || 0, 0)), 0));
    const ymax = (Math.max(...sums(1), 0) * 1.08) || 1, ymin = Math.min(...sums(-1), 0) * 1.08;
    const Y = v => pad.t + ih - (v - ymin) / (ymax - ymin) * ih;
    yGrid(g, [ymin, ymax], Y);
    const band = iw / n, bw = Math.max(Math.min(24, band - 2), 1), every = Math.ceil(n / Math.max(2, Math.floor(iw / 72)));
    cfg.categories.forEach((c, i) => {
      const x = pad.l + i * band + (band - bw) / 2;
      let up = 0, dn = 0;
      const segs = [];
      cfg.series.forEach(s => {
        const v = s.values[i] || 0;
        if (!v) return;
        const a = v > 0 ? up : dn, b = a + v;
        if (v > 0) up = b; else dn = b;
        segs.push({ s, a, b, v });
      });
      const lastPos = segs.filter(z => z.v > 0).at(-1), lastNeg = segs.filter(z => z.v < 0).at(-1);
      segs.forEach(z => {
        const top = Y(Math.max(z.a, z.b)), h = Math.abs(Y(z.a) - Y(z.b)), gap = h > 3 ? 1 : 0;
        svg.appendChild(s_('path', { d: barPath(x, top + gap, bw, Math.max(h - 2 * gap, .5), z === lastPos ? 'top' : z === lastNeg ? 'bottom' : null), fill: z.s.color }));
      });
      const hit = s_('rect', { x: pad.l + i * band, y: pad.t, width: band, height: ih, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, `<b>${c}</b>` + cfg.series.map(s =>
        `<div class="row"><span><i class="sw" style="background:${s.color}"></i>${s.name}</span><span class="mono">${fmt(s.values[i], 0)} ${cfg.unit || ''}</span></div>`).join('') +
        `<div class="row"><span>合计</span><span class="mono">${fmt(cfg.series.reduce((a, s) => a + (s.values[i] || 0), 0), 0)} ${cfg.unit || ''}</span></div>`));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
      if (i % every === 0)
        svg.appendChild(svgText({ x: pad.l + i * band + band / 2, y: pad.t + ih + 16, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, c));
    });
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0), stroke: cssVar('--rule'), 'stroke-width': 1 }));
    if (cfg.yLabel) svg.appendChild(svgText({ x: 12, y: pad.t + ih / 2, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.note, transform: `rotate(-90 12 ${pad.t + ih / 2})` }, cfg.yLabel));
    host.appendChild(svg);
  });
}

/* 横向堆叠条：类别名长、行数多时比竖柱好读；行尾标合计，段值在提示框 */
function hStackedBars(host, cfg) {
  mount(host, W => {
    const rowH = 30, bh = 14, labelW = Math.min(cfg.labelW || 150, Math.round(W * .34)), padR = 64;
    const H = cfg.rows.length * rowH + 4;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img' });
    const totals = cfg.rows.map(r => cfg.series.reduce((a, s) => a + Math.max(r.values[s.key] || 0, 0), 0));
    const X = v => v / (Math.max(...totals, 0) || 1) * (W - labelW - padR);
    cfg.rows.forEach((r, i) => {
      const y = i * rowH + (rowH - bh) / 2;
      svg.appendChild(svgText({ x: labelW - 10, y: y + bh / 2 + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, r.label));
      const segs = cfg.series.map(s => ({ s, v: Math.max(r.values[s.key] || 0, 0) })).filter(z => z.v > 0);
      let acc = 0;
      segs.forEach((z, k) => {
        const x = labelW + X(acc), ww = X(z.v), last = k === segs.length - 1;
        acc += z.v;
        svg.appendChild(s_('path', { d: barPath(x, y, Math.max(ww - (last || ww <= 3 ? 0 : 2), .5), bh, last ? 'right' : null), fill: z.s.color }));
        const hit = s_('rect', { x, y: i * rowH, width: Math.max(ww, 4), height: rowH, fill: 'transparent' });
        hit.addEventListener('mousemove', ev => showTip(ev, `<b>${r.tip || r.label}</b>` +
          `<div class="row"><span><i class="sw" style="background:${z.s.color}"></i>${z.s.name}</span><span class="mono">${fmt(z.v, 0)} ${cfg.unit || ''}</span></div>` +
          `<div class="row"><span>占该行</span><span class="mono">${fmt(z.v / totals[i] * 100, 1)}%</span></div>`));
        hit.addEventListener('mouseleave', hideTip);
        svg.appendChild(hit);
      });
      svg.appendChild(svgText({ x: labelW + X(acc) + 7, y: y + bh / 2 + 4, fill: cssVar('--muted'), 'font-size': FS.note }, compactT(totals[i])));
    });
    host.appendChild(svg);
  });
}

/* 瀑布图：期初/期末从零起，行项悬浮在累计值上；数值只标期初、期末和影响最大的两项 */
function waterfall(host, rows) {
  mount(host, W => {
    const g = frame(W, 290, { l: 54, r: 10, t: 26, b: 40 });
    const { svg, pad, iw, ih } = g;
    let run = 0;
    const steps = rows.map(r => {
      const s = r.total ? { r, a: 0, b: r.value } : { r, a: run, b: run + r.value };
      run = s.b; return s;
    });
    const vals = steps.flatMap(s => [s.a, s.b]);
    const ymax = (Math.max(...vals, 0) * 1.1) || 1, ymin = Math.min(...vals, 0) * 1.1;
    const Y = v => pad.t + ih - (v - ymin) / (ymax - ymin) * ih;
    yGrid(g, [ymin, ymax], Y);
    const band = iw / rows.length, bw = Math.min(24, band * .55);
    const big = steps.filter(s => !s.r.total).sort((p, q) => Math.abs(q.r.value) - Math.abs(p.r.value)).slice(0, 2);
    steps.forEach((s, i) => {
      const x = pad.l + i * band + (band - bw) / 2, up = s.b >= s.a;
      const top = Y(Math.max(s.a, s.b)), h = Math.max(Math.abs(Y(s.a) - Y(s.b)), 1);
      svg.appendChild(s_('path', { d: barPath(x, top, bw, h, up ? 'top' : 'bottom'), fill: s.r.color }));
      if (i < steps.length - 1)
        svg.appendChild(s_('line', { x1: x + bw, x2: x + band + (band - bw) / 2, y1: Y(s.b), y2: Y(s.b), stroke: cssVar('--rule'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: x + bw / 2, y: pad.t + ih + 16, 'text-anchor': 'middle', fill: cssVar('--ink-2'), 'font-size': FS.note },
        band < 62 ? (s.r.tiny || s.r.label) : s.r.label));
      if (s.r.total || big.includes(s))
        svg.appendChild(svgText({ x: x + bw / 2, y: up ? top - 6 : top + h + 13, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.note },
          (s.r.total || s.r.value < 0 ? '' : '+') + compactT(s.r.value)));
      const hit = s_('rect', { x: pad.l + i * band, y: pad.t, width: band, height: ih, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, `<b>${s.r.item}</b>` +
        `<div class="row"><span>${s.r.total ? '储量' : '变动'}</span><span class="mono">${s.r.total || s.r.value < 0 ? '' : '+'}${fmt(s.r.value, 1)} t</span></div>` +
        (s.r.total ? '' : `<div class="row"><span>累计</span><span class="mono">${fmt(s.b, 1)} t</span></div>`)));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
    });
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0), stroke: cssVar('--rule'), 'stroke-width': 1 }));
    host.appendChild(svg);
  });
}

/* 敏感性小图：一个参数一张图（横轴单位各不相同，绝不合进一张双轴图） */
function deltaLine(host, cfg) {
  mount(host, W => {
    const g = frame(W, 210, { l: 52, r: 14, t: 14, b: 40 });
    const lo = Math.min(...cfg.y, 0), hi = Math.max(...cfg.y, 0), py = (hi - lo) * .08 || 1;
    const xd = [Math.min(...cfg.x), Math.max(...cfg.x)];
    const xDigits = (xd[1] - xd[0]) < 10 ? 2 : 0;
    const { X, Y } = axes(g, xd, [lo - py, hi + py], cfg.xLabel, null, t => fmt(t, xDigits), compactT);
    const { svg, pad, iw, ih } = g;
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0), stroke: cssVar('--rule'), 'stroke-width': 1 }));
    if (Number.isFinite(cfg.baseX)) {
      svg.appendChild(s_('line', { x1: X(cfg.baseX), x2: X(cfg.baseX), y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: X(cfg.baseX) + 5, y: pad.t + 11, fill: cssVar('--muted'), 'font-size': FS.note }, '基准'));
    }
    const pts = cfg.x.map((x, i) => ({ x, y: cfg.y[i] }));
    svg.appendChild(s_('polyline', { points: pts.map(p => `${X(p.x)},${Y(p.y)}`).join(' '), fill: 'none', stroke: cfg.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    [pts[0], pts.at(-1)].forEach(p => svg.appendChild(s_('circle', { cx: X(p.x), cy: Y(p.y), r: 4, fill: cfg.color, stroke: cssVar('--surface'), 'stroke-width': 2 })));
    const cross = s_('line', { y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1, opacity: 0 });
    svg.appendChild(cross);
    const hit = s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      const xv = xd[0] + (svgX(svg, ev, W) - pad.l) / iw * (xd[1] - xd[0]);
      const p = pts.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a, pts[0]);
      cross.setAttribute('x1', X(p.x)); cross.setAttribute('x2', X(p.x)); cross.setAttribute('opacity', 1);
      showTip(ev, `<b>${cfg.xLabel} ${fmt(p.x, xDigits)}</b><div class="row"><span>PDP 变化</span><span class="mono">${p.y >= 0 ? '+' : ''}${fmt(p.y, 0)} t</span></div>`);
    });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
    svg.appendChild(hit);
    host.appendChild(svg);
  });
}

/* 哑铃图：同一指标两期得分，同一色相的浅/深两阶 —— 比雷达图更容易读出差值 */
function dumbbell(host, rows, cfg) {
  mount(host, W => {
    const rowH = 28, labelW = W < 480 ? 104 : 156, padR = 24, top = 24;
    const h = rows.length * rowH + top + 4;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: 'img' });
    const X = v => labelW + v / 100 * (W - labelW - padR);
    [0, 25, 50, 75, 100].forEach(t => {
      svg.appendChild(s_('line', { x1: X(t), x2: X(t), y1: top - 4, y2: h, stroke: cssVar('--rule-soft'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: X(t), y: 13, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, t));
    });
    rows.forEach((r, i) => {
      const y = top + i * rowH + rowH / 2;
      svg.appendChild(svgText({ x: labelW - 10, y: y + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, r.label));
      if (r.a != null && r.b != null)
        svg.appendChild(s_('line', { x1: X(r.a), x2: X(r.b), y1: y, y2: y, stroke: cssVar('--rule'), 'stroke-width': 2 }));
      [[r.a, cfg.aColor], [r.b, cfg.bColor]].forEach(([v, c]) => {
        if (v != null) svg.appendChild(s_('circle', { cx: X(v), cy: y, r: 5, fill: c, stroke: cssVar('--surface'), 'stroke-width': 2 }));
      });
      const hit = s_('rect', { x: 0, y: y - rowH / 2, width: W, height: rowH, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, r.tip));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
    });
    host.appendChild(svg);
  });
}

async function renderWell() {
  const host = $('#tab-well');
  if (!S.wells.length) { host.innerHTML = '<p class="empty">请先打开总览页加载井表</p>'; return; }
  if (!S.current) S.current = S.wells[0].well_code;
  host.innerHTML = '';
  host.appendChild(el('div', { class: 'filters' }, [
    el('label', { text: '选择井' }), wellPicker(c => { S.current = c; renderWell(); }),
    el('span', { class: 'chip solid', id: 'wellMeta', text: '加载中…' })]));
  const body = el('div'); host.appendChild(body);
  body.innerHTML = '<p class="empty">计算中…（首次访问需拟合递减曲线，约 1 秒）</p>';

  let pred, curve, analogs, info;
  try {
    [info, curve, pred, analogs] = await Promise.all([
      api('/well/query', { well_code: S.current }),
      api('/well/curve', { well_code: S.current }),
      api('/predict/lifecycle', { well_code: S.current }),
      api('/analogs', { well_code: S.current, top_k: 5 })]);
  } catch (e) { body.innerHTML = ''; body.appendChild(el('p', { class: 'err', text: '失败：' + e.message })); return; }

  $('#wellMeta').textContent = `${info.block}/${info.layer}｜${info.well_type}｜投产 ${info.first_prod_date}｜` +
    `累产 ${fmt(info.cum_oil_t, 0)} t｜近 ${info.rate_window_days} 天 ${fmt(info.current_rate_t_per_d)} t/d`;
  body.innerHTML = '';

  /* 预测卡：区间是主角，不给单点 */
  const pr = pred.results;
  body.appendChild(el('div', { class: 'grid g3', style: 'margin-bottom:14px' },
    Object.entries(pr).map(([k, v]) => el('div', { class: 'card' }, el('div', { class: 'kpi' }, [
      el('span', { class: 'k', text: TARGET_CN[k] || k }),
      el('span', { class: 'v', text: fmt(v.p50) + ' ' + v.unit }),
      el('span', { class: 'n mono', text: `P10–P90  ${fmt(v.p10)} ~ ${fmt(v.p90)}` })])))));

  /* 主图：实测 + 预测 + 概率带。压力单开一张，绝不双轴。 */
  const c1 = cssVar('--c1'), c2 = cssVar('--c2');
  const obs = curve.month.map((m, i) => ({ x: m, y: curve.oil_t_per_d[i] }));
  const cv = pred.curve;
  const ratio = { lo: pr.eur ? pr.eur.p10 / pr.eur.p50 : .8, hi: pr.eur ? pr.eur.p90 / pr.eur.p50 : 1.2 };
  const dca0 = await api('/reserves/dca', { well_code: S.current }).catch(() => null);
  /* x 轴裁到经济极限之后一点：后面几十个月的平尾巴只会把有信息的前段压扁 */
  /* 优先裁到经济极限；新井拿不到经济极限（DCA 不适用），
     就退回用曲线自身：降到峰值 8% 以下就没有信息量了。 */
  let cut = cv ? cv.month.length : 0;
  if (cv && cv.q.length) {
    const qEcon = dca0 ? dca0.economics.q_econ_t_per_d : Math.max(...cv.q) * 0.08;
    const k = cv.q.findIndex(v => v < qEcon);
    if (k > 4) cut = Math.min(cv.month.length, Math.round(k * 1.15));
  }
  const p50 = cv ? cv.month.slice(0, cut).map((m, i) => ({ x: m, y: cv.q[i] })) : [];
  const band = cv ? cv.month.slice(0, cut).map((m, i) => ({ x: m, lo: cv.q[i] * ratio.lo, hi: cv.q[i] * ratio.hi })) : [];
  const obsEnd = Math.max(...curve.month, 1);

  const chart = el('figure');
  chart.appendChild(legend([
    { name: '实测月均日产', color: c2 }, { name: '预测 P50', color: c1 },
    { name: 'P10–P90 区间', color: c1, kind: 'band' }, { name: '经济极限', kind: 'dash' }]));
  const plot = el('div'); chart.appendChild(plot);
  chart.appendChild(el('figcaption', {
    text: `预测曲线由预测出的达峰产量、达峰时间与 EUR 反推（Di=${cv ? cv.di : '—'}，b=${cv ? cv.b : '—'}），` +
      `与三个标量预测自洽；概率带按 EUR 区间等比缩放。` +
      (dca0 ? '经济极限线以 12 个月首日均价口径计算。' : '该井尚未达峰，递减分析不适用，故不画经济极限线。') +
      ' 横轴已裁到经济极限附近。'
  }));
  lineChart(plot, {
    xLabel: '投产后月份', yLabel: '日产油 t/d',
    series: [{ name: '实测', color: c2, points: obs, dots: obs.length < 40 },
    { name: '预测 P50', color: c1, points: p50, dashed: true }],
    band, bandColor: c1,
    hline: dca0 ? { y: dca0.economics.q_econ_t_per_d, label: `经济极限 ${dca0.economics.q_econ_t_per_d} t/d` } : null,
    vline: { x: obsEnd, label: '← 实测 / 预测 →' },
    markers: pr.t_peak ? [{ x: pr.t_peak.p50 / 30.4, y: pr.q_peak.p50, color: c2, label: `达峰 P50 ${fmt(pr.t_peak.p50, 0)} d` }] : []
  });
  body.appendChild(card('全生命周期预测', `观测窗 ${pred.obs_days} 天｜模型 ${pred.model_version}`, chart));

  /* 归因 + 类比井 */
  const attrHost = el('figure');
  divergingBars(attrHost, pred.explain.top_features.map(f => ({
    label: FEATURE_CN[f.feature] || f.feature, value: f.contrib, raw: f.value
  })), 'd');
  const attrCard = card('特征归因（对达峰时间）', pred.explain.method + '：把该特征换成训练集中位数，看预测怎么变。', attrHost);

  const anCard = card('类比井', analogs.method,
    table([{ h: '井号', k: 'well_code' }, { h: '相似度', k: 'similarity', num: true },
    { h: '实际达峰 (d)', k: 't_peak_actual', num: true, d: 0 },
    { h: '峰值 (t/d)', k: 'q_peak_actual', num: true },
    { h: 'EUR (t)', k: 'eur_actual', num: true, d: 0 }], analogs.analogs));
  body.appendChild(el('div', { class: 'grid g2', style: 'margin-top:14px' }, [attrCard, anCard]));

  if (curve.actual && curve.actual.t_peak && curve.actual.label_quality === 'ok') {
    body.appendChild(card('该井的实际标签（仅老井有）',
      `标签口径版本 ${pred.label_def_version}｜质量位 ${curve.actual.label_quality}｜可用于与预测值比对`,
      table([{ h: '指标', k: 'k' }, { h: '实际值', k: 'v', num: true }], [
        { k: '达峰时间 (d)', v: curve.actual.t_peak }, { k: '达峰产量 (t/d)', v: curve.actual.q_peak },
        { k: '达峰压力 (MPa)', v: curve.actual.p_peak }, { k: 'EUR (t)', v: curve.actual.eur }])));
  } else if (curve.actual) {
    body.appendChild(card('该井暂无可信实际标签',
      `质量位 ${curve.actual.label_quality || '—'}`,
      el('p', { class: 'sub', style: 'margin:0',
        text: '该井尚未确认达峰（峰后下降未持续足够长时间），因此不展示"实际达峰"值 —— ' +
              '把还没到的峰当成真值展示，会让预测看起来是错的，而错的是标签。' })));
  }
}

    kpi('EUR P50', dca._error ? '不可得' : fmt(dca.eur.p50, 0) + ' t',
      dca._error ? '需峰后 180 天历史' : `P10–P90 ${fmt(dca.eur.p10, 0)} ~ ${fmt(dca.eur.p90, 0)}`),
    kpi('已累产', dca._error ? '—' : fmt(dca.cum_to_date_t, 0) + ' t',
      dca._error ? '' : `剩余可采 P50 ${fmt(dca.remaining_t.p50, 0)} t`),
    kpi('SEC 类别', sec._error ? '—' : sec.category, sec._error ? sec._error : sec.category_rationale),
    kpi('已证实储量',
      (sec._error || sec.proved_reserves_t === null) ? '不可得' : fmt(sec.proved_reserves_t, 0) + ' t',
      sec._error ? '' : sec.basis)]));

  const dcaCard = dca._error ? card('递减曲线分析', '不适用', el('p', { class: 'sub', style: 'margin:0', text: dca._error }))
    : card('递减曲线分析',
    `${dca.fit.model}｜b=${dca.fit.b}｜Di=${dca.fit.di_per_month}/月｜终端递减=${dca.fit.d_min_per_month}/月｜R²=${dca.fit.r2}`,
    [table([{ h: '项', k: 'k' }, { h: '值', k: 'v' }], [
      { k: '经济极限产量', v: dca.economics.q_econ_t_per_d + ' t/d' },
      { k: '到达经济极限', v: '第 ' + fmt(dca.economics.t_econ_month, 0) + ' 个月' },
      { k: '12 个月首日均价', v: dca.economics.avg_12m_price_usd_bbl + ' USD/bbl' },
      { k: '价格册', v: dca.economics.price_deck_id },
      { k: '自助法次数', v: dca.eur.n_bootstrap + ' 次（移动块）' }].concat(
        dca.economics.t_econ_capped ? [{ k: '注意', v: dca.economics.t_econ_note }] : [])),
    el('p', { class: 'sub', style: 'margin:10px 0 0', text: dca.guard })]);

  /* 蒙特卡洛：用返回的分位数重建一个对数正态样本用于展示形状，
     参考线才是真值 —— 这一点写在图注里，不能让人误以为是原始样本。 */
  const o = vol._error ? { p10: 1, p50: 2, p90: 3 } : vol.ooip_t;
  const mu = Math.log(Math.max(o.p50, 1));
  const sigma = Math.max((Math.log(Math.max(o.p90, 1)) - Math.log(Math.max(o.p10, 1))) / 2.563, .05);
  const sample = Array.from({ length: 4000 }, () => {
    let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random();
    return Math.exp(mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
  });
  const mcFig = el('figure'); const mcPlot = el('div'); mcFig.appendChild(mcPlot);
  histogram(mcPlot, sample, [{ x: o.p10, label: 'P10' }, { x: o.p50, label: 'P50' }, { x: o.p90, label: 'P90' }], '地质储量 OOIP (t)');
  mcFig.appendChild(el('figcaption', {
    text: '直方图形状按接口返回的 P10/P50/P90 重建，仅用于示意分布宽度；三条参考线才是内核蒙特卡洛的实际输出。'
  }));
  const volCard = vol._error ? card('容积法储量', '不可得', el('p', { class: 'err', text: vol._error }))
    : card('容积法储量', vol.method, mcFig);

  const ccCard = cc._error ? card('动静态互校', '不适用', el('p', { class: 'sub', style: 'margin:0', text: cc._error }))
    : card('动静态互校',
    `隐含采收率 ${cc.rf_implied_pct}%｜区块经验区间 ${cc.rf_reference_pct.low_pct}% ~ ${cc.rf_reference_pct.high_pct}%（10%–90% 分位）` +
    `（样本 ${cc.rf_reference_source.n} 口，来源 ${cc.rf_reference_source.source}）`,
    [el('div', {}, [el('span', { class: 'chip ' + (cc.consistency === 'consistent' ? 'ok' : cc.consistency === 'conflict' ? 'crit' : 'warn'), text: '判定：' + cc.consistency })]),
    el('div', { style: 'margin-top:12px' }, cc.findings.map(f => el('div', { class: 'finding ' + f.severity }, [
      el('div', { text: f.finding }),
      f.reason ? el('div', { class: 'act', text: '可能原因：' + f.reason }) : null,
      f.action ? el('div', { class: 'act', text: '建议：' + f.action }) : null].filter(Boolean))))]);

  const secCard = sec._error ? card('SEC 满足性检查清单', '不可得', el('p', { class: 'err', text: sec._error }))
    : card('SEC 满足性检查清单',
    `${sec.summary.n_pass}/${sec.summary.n_items} 项通过｜${sec.summary.n_needs_human} 项需人工确认｜基准日 ${sec.as_of}`,
    [el('ul', { class: 'chk' }, sec.checklist.map(i => el('li', {}, [
      el('span', {}, el('span', { class: 'chip ' + STATUS_CLS[i.status], text: STATUS_CN[i.status] })),
      el('div', {}, [el('div', { class: 'it', text: i.item }),
      el('div', { class: 'ev', text: '依据：' + i.evidence }),
      i.citation ? el('div', { class: 'ct mono', text: i.citation }) : null].filter(Boolean))]))),
    el('p', { class: 'sub', style: 'margin:12px 0 0;color:var(--warn)', text: sec.summary.disclaimer })]);

  if (dca._error) {
    body.appendChild(el('div', { class: 'grid g2' }, [volCard, secCard]));
  } else {
    body.appendChild(el('div', { class: 'grid g2' }, [dcaCard, volCard]));
    body.appendChild(el('div', { class: 'grid g2', style: 'margin-top:14px' }, [ccCard, secCard]));
  }
}


/* ── SEC 单元：共用的评估对象筛选（一行筛选，作用于本页全部图表） ── */
const COMP = () => [
  { key: 'old_base', name: '老井基础', color: cssVar('--c1') },
  { key: 'measure', name: '措施增储', color: cssVar('--c2') },
  { key: 'new_infill', name: '提采新井', color: cssVar('--c3') },
  { key: 'extension', name: '扩边井', color: cssVar('--c4') }];
const RECON_SHORT = { opening: '期初', production: '产量消耗', price_revision: '价格/成本', new_wells: '提采新井',
  measure: '措施', extension: '扩边', category_change: '类别调整', technical_revision: '技术修订', closing: '期末' };
const RECON_COMP = { new_wells: 'new_infill', measure: 'measure', extension: 'extension' };
const RECON_TINY = { opening: '期初', production: '产量', price_revision: '价格', new_wells: '新井',
  measure: '措施', extension: '扩边', category_change: '类别', technical_revision: '技术', closing: '期末' };
const softApi = (p, q) => api(p, q).catch(e => ({ _error: e.message }));
const errCard = (title, msg) => card(title, '不可得', el('p', { class: 'sub', style: 'margin:0', text: msg }));

async function ensureUnits() {
  if (!S.units) {
    S.units = await api('/units');
    S.scope = S.units.company.name;
    S.asOf = S.units.evaluation_dates.at(-1);
    S.scenario = 'sec';
  }
  return S.units;
}

function unitFilters(opts, onChange) {
  const u = S.units;
  const scopeSel = el('select', { onchange: e => { S.scope = e.target.value; onChange(); } }, [
    el('optgroup', { label: '公司' }, el('option', { value: u.company.name, text: u.company.name })),
    el('optgroup', { label: '采油厂' }, u.plants.map(p => el('option', { value: p.plant_name, text: p.plant_name }))),
    el('optgroup', { label: 'SEC 单元' }, u.plants.flatMap(p => p.units.map(x =>
      el('option', { value: x.unit_id, text: `${x.unit_id}　${x.unit_name}　${x.n_wells} 口` }))))]);
  scopeSel.value = S.scope;
  const fg = (label, ctl) => el('span', { class: 'fgroup' }, [el('label', { text: label }), ctl]);
  const kids = [fg('评估对象', scopeSel)];
  if (opts.date) {
    const d = el('select', { onchange: e => { S.asOf = e.target.value; onChange(); } },
      u.evaluation_dates.map(x => el('option', { value: x, text: x })));
    d.value = S.asOf; kids.push(fg('基准日', d));
  }
  if (opts.scenario) {
    const sc = el('select', { onchange: e => { S.scenario = e.target.value; onChange(); } },
      u.scenarios.map(x => el('option', { value: x.key, text: x.label })));
    sc.value = S.scenario; kids.push(fg('价格情景', sc));
  }
  return el('div', { class: 'filters' }, kids);
}

function evidenceText(kind, e) {
  if (kind === 'wells') return `${e.well_code}（${e.unit_id}）${fmt(e.reserves_t, 0)} t，${e.basis}，投产 ${e.months_on} 个月`;
  if (kind === 'measures') return `${e.well_code}（${e.unit_id}）${e.event_name} ${e.event_ym}，增加可采 ${fmt(e.inc_eur_t, 0)} t`;
  if (kind === 'economics') return `油价 ${fmt(e.price_open_usd_bbl)} → ${fmt(e.price_close_usd_bbl)} USD/bbl，单井经济极限 ${fmt(e.q_econ_open_t_per_d)} → ${fmt(e.q_econ_close_t_per_d)} t/d`;
  if (kind === 'wells_rate_change') return `${e.well_code}（${e.unit_id}）日产 ${fmt(e.rate_open_t_per_d)} → ${fmt(e.rate_close_t_per_d)} t/d，含水 ${fmt(e.water_cut_open_pct, 1)}% → ${fmt(e.water_cut_close_pct, 1)}%`;
  return '';
}

/* ── SEC 构成评估（技术人员视角） ── */
async function renderUnit() {
  const host = $('#tab-unit'), token = S.unitToken = (S.unitToken || 0) + 1;
  host.innerHTML = '<p class="empty">加载评估单元…</p>';
  await ensureUnits();
  host.innerHTML = '';
  host.appendChild(unitFilters({ date: true, scenario: true }, renderUnit));
  const body = el('div'); host.appendChild(body);
  body.innerHTML = '<p class="empty">评估中…首次评估要逐井拟合全部老井（公司级约 10 秒），之后命中缓存。</p>';

  const dates = S.units.evaluation_dates, idx = dates.indexOf(S.asOf);
  const q = { scope: S.scope, as_of: S.asOf }, qs = { ...q, scenario: S.scenario };
  const rq = idx > 0 ? { scope: S.scope, from_as_of: dates[idx - 1], to_as_of: S.asOf, scenario: S.scenario } : null;
  const noPrev = Promise.resolve({ _error: `${S.asOf} 是首个评估基准日，没有上期结果可对账` });
  /* 先单独请求构成：服务端这一步做逐井拟合，其余请求随后直接命中缓存 */
  const comp = await softApi('/unit/composition', qs);
  const [prod, dec, nw, meas, recon, attr, sens] = await Promise.all([
    softApi('/unit/production', q), softApi('/unit/decline', q), softApi('/unit/new-wells', q),
    softApi('/unit/measures', q), rq ? softApi('/unit/reconcile', rq) : noPrev,
    rq ? softApi('/unit/attribution', rq) : noPrev, softApi('/unit/sensitivity', qs)]);
  if (token !== S.unitToken) return;            /* 筛选已改：丢弃过期结果 */
  body.innerHTML = '';
  if (comp._error) { body.appendChild(errCard('SEC 储量构成', comp._error)); return; }
  const C = COMP(), color = Object.fromEntries(C.map(c => [c.key, c.color]));

  body.appendChild(el('div', { class: 'grid g5', style: 'margin-bottom:14px' }, [
    stat(`PDP 合计 · ${comp.scenario_label}`, fmtT(comp.total_t),
      `${comp.period_start_ym} ~ ${comp.period_end_ym}｜本期产量 ${fmtT(comp.production_in_period_t)}`),
    ...comp.components.map(c => stat(c.name, fmtT(c.reserves_t),
      `占 ${fmt(c.share_pct, 1)}%｜${c.n_items} ${c.key === 'measure' ? '次措施' : '口井'}`, color[c.key]))]));

  /* 按单元构成 */
  const compFig = el('figure', {}, legend(C.map(c => ({ name: c.name, color: c.color, kind: 'box' }))));
  const compPlot = el('div'); compFig.appendChild(compPlot);
  hStackedBars(compPlot, { rows: comp.units.map(u => ({ label: u.unit_id, tip: `${u.unit_id} ${u.unit_name}`, values: u.components })), series: C, unit: 't', labelW: 120 });
  compFig.appendChild(el('figcaption', { text: comp.components.map(c => `${c.name}：${c.basis}`).join('；') + '。' + (comp.aggregation_note || '') }));
  body.appendChild(card('按单元的 PDP 构成',
    `${comp.scope.name}｜基准日 ${comp.as_of}｜油价 ${comp.economics.price_usd_bbl} USD/bbl，单井经济极限 ${comp.economics.q_econ_t_per_d} t/d`,
    [compFig, tableView([{ h: '单元', k: 'unit_id' }, { h: '名称', k: 'unit_name' },
      ...C.map(c => ({ h: c.name + ' (t)', k: c.key, num: true, d: 0 })), { h: '合计 (t)', k: 'total_t', num: true, d: 0 }],
      comp.units.map(u => ({ ...u, ...u.components })))]));

  /* 逐月产量构成 */
  if (prod._error) body.appendChild(el('div', { style: 'margin-top:14px' }, errCard('逐月产量构成', prod._error)));
  else {
    const series = [{ name: '老井基础', color: color.old_base, values: prod.months.map(m => m.old_base_t) },
      { name: '本期措施增油', color: color.measure, values: prod.months.map(m => m.measure_inc_t) },
      { name: '本期新井（提采 + 扩边）', color: color.new_infill, values: prod.months.map(m => m.new_oil_t) }];
    const fig = el('figure', {}, legend(series.map(s => ({ name: s.name, color: s.color, kind: 'box' }))));
    const plot = el('div'); fig.appendChild(plot);
    stackedColumns(plot, { categories: prod.months.map(m => m.ym), series, unit: 't', yLabel: '月产油 (t)' });
    fig.appendChild(el('figcaption', { text: `${prod.note}。本期为 ${prod.period_start_ym} ~ ${prod.period_end_ym}；此前月份的新井与措施已并入老井基础。` }));
    body.appendChild(el('div', { style: 'margin-top:14px' }, card('逐月"新-老-措"产量构成', '近 3 年，按月汇总', [fig,
      tableView([{ h: '月份', k: 'ym' }, { h: '老井基础 (t)', k: 'old_base_t', num: true, d: 0 }, { h: '措施增油 (t)', k: 'measure_inc_t', num: true, d: 0 },
        { h: '新井 (t)', k: 'new_oil_t', num: true, d: 0 }, { h: '合计 (t)', k: 'total_oil_t', num: true, d: 0 }, { h: '在产井', k: 'n_producing', num: true, d: 0 }], prod.months)])));
  }

  /* 递减 + 措施 */
  const decCard = dec._error ? errCard('老井基础递减', dec._error) : card('老井基础递减', dec.definition,
    el('div', { class: 'grid g2x2 inset' }, dec.results.flatMap(r => [
      stat(`扣近 ${r.exclude_years} 年 · 自然递减率`, fmt(r.natural_annual_pct, 1) + '%',
        `月递减 ${fmt(r.natural_monthly_pct, 3)}%｜${r.window_start_ym} ~ ${r.window_end_ym}｜R² ${fmt(r.natural_fit_r2, 3)}`),
      stat(`扣近 ${r.exclude_years} 年 · 综合递减率`, fmt(r.comprehensive_annual_pct, 1) + '%',
        `月递减 ${fmt(r.comprehensive_monthly_pct, 3)}%｜只扣新井，保留措施增油`)])));
  let measCard;
  if (meas._error) measCard = errCard('本期措施效果', meas._error);
  else {
    const o = meas.overall, byType = meas.by_type.slice().sort((a, b) => b.inc_eur_total_t - a.inc_eur_total_t);
    const plot = el('div');
    hStackedBars(plot, { rows: byType.map(t => ({ label: t.name, values: { v: t.inc_eur_total_t } })),
      series: [{ key: 'v', name: '增加可采储量', color: color.measure }], unit: 't', labelW: 80 });
    measCard = card('本期措施效果', `共 ${o.n} 次｜有效 ${o.n_effective} 次（${fmt(o.effective_rate_pct, 1)}%）｜单井日产 ${fmt(o.pre_rate_avg_t_per_d)} → ${fmt(o.post_rate_avg_t_per_d)} t/d｜增加可采储量合计 ${fmtT(o.inc_eur_total_t)}`,
      [el('figure', {}, [plot, el('figcaption', { text: '按措施类型的增加可采储量合计。' + meas.definition })]),
       tableView([{ h: '类型', k: 'name' }, { h: '次数', k: 'n', num: true, d: 0 }, { h: '有效', k: 'n_effective', num: true, d: 0 },
         { h: '措施前 t/d', k: 'pre_rate_avg_t_per_d', num: true }, { h: '措施后 t/d', k: 'post_rate_avg_t_per_d', num: true },
         { h: '日产增幅 t/d', k: 'rate_gain_avg_t_per_d', num: true }, { h: '单次增加可采 t', k: 'inc_eur_avg_t', num: true, d: 0 },
         { h: '合计 t', k: 'inc_eur_total_t', num: true, d: 0 }], byType)]);
  }
  body.appendChild(el('div', { class: 'grid g2', style: 'margin-top:14px' }, [decCard, measCard]));

  /* 对账 + 归因 */
  let reconCard;
  if (recon._error) reconCard = errCard('储量对账', recon._error);
  else {
    const rows = recon.table.map(r => ({ ...r, label: RECON_SHORT[r.key] || r.item, tiny: RECON_TINY[r.key],
      total: r.key === 'opening' || r.key === 'closing',
      color: r.key === 'opening' || r.key === 'closing' ? cssVar('--neutral') : RECON_COMP[r.key] ? color[RECON_COMP[r.key]] : cssVar('--neutral-2') }));
    const fig = el('figure', {}, legend([{ name: '期初 / 期末', color: cssVar('--neutral'), kind: 'box' },
      ...['new_infill', 'measure', 'extension'].map(k => ({ name: C.find(c => c.key === k).name, color: color[k], kind: 'box' })),
      { name: '产量、价格、技术修订等', color: cssVar('--neutral-2'), kind: 'box' }]));
    const plot = el('div'); fig.appendChild(plot); waterfall(plot, rows);
    fig.appendChild(el('figcaption', { text: `柱向上为增加、向下为减少。${recon.note}。${recon.depletion_note}。` }));
    reconCard = card('储量对账', `${recon.from_as_of} → ${recon.to_as_of}｜闭合：${recon.balanced ? '是' : '否'}（差额 ${recon.difference} t）｜产量法折耗率 ${fmt(recon.depletion_rate_pct, 2)}%｜期初来源：${recon.opening_source}`,
      [fig, tableView([{ h: '行项', k: 'item' }, { h: '储量 (t)', k: 'value', num: true, d: 1 }, { h: '说明', k: 'note' }], recon.table)]);
  }
  const attrCard = attr._error ? errCard('变化归因', attr._error) : card('变化归因',
    `PDP ${fmtT(attr.opening_t)} → ${fmtT(attr.closing_t)}，变化 ${attr.change_t >= 0 ? '+' : ''}${fmtT(attr.change_t)}｜${attr.note}`,
    el('div', {}, attr.drivers.map(d => el('div', { class: 'finding' }, [
      el('div', {}, [el('b', { text: d.item }), `　${d.value_t >= 0 ? '+' : ''}${fmt(d.value_t, 0)} t，占 ${fmt(d.share_pct, 1)}%`]),
      ...d.evidence.map(e => el('div', { class: 'act', text: evidenceText(d.evidence_kind, e) }))]))));
  body.appendChild(el('div', { class: 'grid g2', style: 'margin-top:14px' }, [reconCard, attrCard]));

  /* 新井识别：默认只列 8 口，其余折叠 */
  const nwCols = [{ h: '井号', k: 'well_code' }, { h: '单元', k: 'unit_id' },
    { h: '分类', k: 'category', render: r => el('span', {}, [el('i', { class: 'sw', style: `background:${color[r.category_code === 'infill' ? 'new_infill' : 'extension']}` }), r.category]) },
    { h: '周边老井', k: 'n_old_neighbors', num: true, d: 0 }, { h: '最近老井 m', k: 'nearest_old_m', num: true, d: 0 },
    { h: '投产月数', k: 'months_on', num: true, d: 0 }, { h: '剩余可采 t', k: 'reserves_t', num: true, d: 0 }, { h: '取值方法', k: 'basis' }];
  if (!nw._error) {
    body.appendChild(el('div', { style: 'margin-top:14px' }, card('本期新井自动识别', nw.rule.text, [
      el('div', { class: 'grid g2 inset', style: 'margin-bottom:10px' }, [
        stat('提采新井', `${nw.n_infill} 口`, '计入老区 PDP', color.new_infill),
        stat('扩边井', `${nw.n_extension} 口`, '单列为扩边与新发现；老区 PDP 剔除其产量', color.extension)]),
      table(nwCols, nw.wells.slice(0, 8)),
      nw.wells.length > 8 ? el('details', { class: 'tv' }, [el('summary', { text: `展开其余 ${nw.wells.length - 8} 口` }),
        table(nwCols, nw.wells.slice(8))]) : null].filter(Boolean))));
  }

  /* 敏感性 */
  if (!sens._error) {
    const ink = cssVar('--ink-2');
    const base = { price: sens.base_price_usd_bbl, opex: 1, rate: 0, decline: 0 };
    const grid = el('div', { class: 'grid g4' }, sens.curves.map(cv => {
      const f = el('figure'), p = el('div'); f.appendChild(p);
      deltaLine(p, { x: cv.x, y: cv.delta_t, xLabel: `${cv.name}（${cv.unit}）`, color: ink, baseX: base[cv.param] });
      f.appendChild(el('figcaption', { text: `${cv.name}：PDP 变化 ${fmtT(cv.delta_t[0])} ~ ${fmtT(cv.delta_t.at(-1))}` }));
      return f;
    }));
    const wIdx = sens.weights.map((w, i) => ({ h: w.name, k: 'w' + i, num: true, render: r => el('span', { class: 'mono', text: fmt(r['w' + i], 1) + '%' }) }));
    body.appendChild(el('div', { style: 'margin-top:14px' }, card('PDP 敏感性',
      `${sens.scenario_label}｜基准油价 ${sens.base_price_usd_bbl} USD/bbl｜最佳估计 ${fmtT(sens.base_best_estimate_t)}｜${sens.note}`, [grid,
        el('div', { class: 'grid g2', style: 'margin-top:12px' }, [
          block('敏感权重', sens.perturbation, table([{ h: '参数', k: 'name' }, { h: 'PDP 摆幅 t', k: 'swing_t', num: true, d: 0 },
            { h: '权重', k: 'weight_pct', num: true, render: r => el('span', { class: 'mono', text: fmt(r.weight_pct, 1) + '%' }) }], sens.weights)),
          block('各单元参数敏感权重', '权重最大的参数即该单元下一步的主攻方向',
            table([{ h: '单元', k: 'unit_id' }, { h: '最敏感', k: 'top_param' }, ...wIdx],
              sens.units.map(u => ({ unit_id: u.unit_id, top_param: u.top_param, ...Object.fromEntries(u.weights.map((w, i) => ['w' + i, w.weight_pct])) }))))])])));
  }
}

/* ── 运行监控（管理层视角） ── */
async function renderMonitor() {
  const host = $('#tab-monitor'), token = S.monToken = (S.monToken || 0) + 1;
  host.innerHTML = '<p class="empty">加载评估单元…</p>';
  await ensureUnits();
  host.innerHTML = '';
  host.appendChild(unitFilters({ date: true }, renderMonitor));
  const body = el('div'); host.appendChild(body);
  body.innerHTML = '<p class="empty">汇总中…</p>';
  const dates = S.units.evaluation_dates;
  const comps = [];
  for (const d of dates) comps.push(await softApi('/unit/composition', { scope: S.scope, as_of: d, scenario: 'sec' }));
  const [indi, prod] = await Promise.all([softApi('/unit/indicators', { scope: S.scope, as_of_list: dates.join(',') }),
    softApi('/unit/production', { scope: S.scope, as_of: S.asOf })]);
  if (token !== S.monToken) return;
  body.innerHTML = '';
  const C = COMP();
  const [prev, cur] = [comps[0], comps.at(-1)];

  if (!cur._error && !prev._error) {
    const delta = cur.total_t - prev.total_t;
    body.appendChild(el('div', { class: 'grid g5', style: 'margin-bottom:14px' }, [
      stat(`PDP · ${cur.as_of}`, fmtT(cur.total_t), `较 ${prev.as_of} ${delta >= 0 ? '+' : ''}${fmtT(delta)}`),
      stat(`本期产量 · ${cur.period_start_ym} ~ ${cur.period_end_ym}`, fmtT(cur.production_in_period_t), `上期 ${fmtT(prev.production_in_period_t)}`),
      stat('本期新井', `${cur.new_wells.n_infill + cur.new_wells.n_extension} 口`, `提采 ${cur.new_wells.n_infill}｜扩边 ${cur.new_wells.n_extension}`),
      stat('本期措施', `${cur.measures.n_in_period} 次`, `有效 ${cur.measures.n_effective} 次｜增加可采 ${fmtT(cur.measures.inc_eur_total_t)}`)]));
  }

  /* 指标两期对比 */
  if (indi._error) body.appendChild(errCard('开发与经营指标', indi._error));
  else {
    const pa = indi.periods[0], pb = indi.periods.at(-1);
    const tiles = pb.groups.map(g => {
      const a = pa.groups.find(x => x.group === g.group) || {};
      return stat(`${g.name}综合分 · ${pb.as_of}`, fmt(g.score, 1), `${pa.as_of} 为 ${fmt(a.score, 1)}`);
    });
    const rows = pb.indicators.map(r => {
      const a = pa.indicators.find(x => x.key === r.key) || {};
      return { label: r.name, a: a.score, b: r.score,
        tip: `<b>${r.name}</b>` +
          `<div class="row"><span>${pa.as_of}</span><span class="mono">${fmt(a.value)} ${r.unit}｜${fmt(a.score, 1)} 分</span></div>` +
          `<div class="row"><span>${pb.as_of}</span><span class="mono">${fmt(r.value)} ${r.unit}｜${fmt(r.score, 1)} 分</span></div>` +
          `<div class="row"><span>锚点</span><span class="mono">优 ${r.good}｜差 ${r.bad}</span></div>` };
    });
    const fig = el('figure', {}, legend([{ name: pa.as_of, color: cssVar('--c1-soft'), kind: 'dot' }, { name: pb.as_of, color: cssVar('--c1'), kind: 'dot' }]));
    const plot = el('div'); fig.appendChild(plot);
    dumbbell(plot, rows, { aColor: cssVar('--c1-soft'), bColor: cssVar('--c1') });
    fig.appendChild(el('figcaption', { text: indi.scoring + '。两期对比用哑铃图而不是雷达图：雷达图的面积随轴的排列顺序变化，读不准差值。' }));
    body.appendChild(card('开发与经营指标评价', `${indi.scope.name}｜得分 0~100`, [
      el('div', { class: 'grid g2 inset', style: 'margin-bottom:10px' }, tiles), fig,
      tableView([{ h: '指标', k: 'name' }, { h: '单位', k: 'unit' }, { h: pa.as_of + ' 值', k: 'va', num: true }, { h: '得分', k: 'sa', num: true, d: 1 },
        { h: pb.as_of + ' 值', k: 'vb', num: true }, { h: '得分', k: 'sb', num: true, d: 1 }],
        pb.indicators.map(r => { const a = pa.indicators.find(x => x.key === r.key) || {}; return { name: r.name, unit: r.unit, va: a.value, sa: a.score, vb: r.value, sb: r.score }; }))]));
  }

  /* 计划与实际 */
  if (prod._error) body.appendChild(el('div', { style: 'margin-top:14px' }, errCard('计划与实际对标', prod._error)));
  else {
    const PT = [['new_wells', '新井投产（口）'], ['new_oil', '新井产油（t）'], ['measure_wells', '措施（井次）'], ['measure_inc', '措施增油（t）'], ['old_oil', '老井产油（t）']];
    const rows = PT.map(([k, label]) => ({ label, value: prod.period_totals[k].deviation_pct ?? 0, raw: prod.period_totals[k] }));
    const plot = el('div');
    divergingBars(plot, rows, '%', { color: cssVar('--neutral-2'), suffix: '%', axisLabel: '← 低于计划    实际相对计划的偏差（%）    高于计划 →',
      tip: r => `<b>${r.label}</b><div class="row"><span>计划</span><span class="mono">${fmt(r.raw.plan, 0)}</span></div>` +
        `<div class="row"><span>实际</span><span class="mono">${fmt(r.raw.actual, 0)}</span></div>` +
        `<div class="row"><span>偏差</span><span class="mono">${fmt(r.raw.deviation_pct, 1)}%</span></div>` });
    body.appendChild(el('div', { style: 'margin-top:14px' }, card('计划与实际对标',
      `${prod.scope.name}｜本期 ${prod.period_start_ym} ~ ${prod.period_end_ym}` + (prod.plan_available ? '' : '｜未导入计划数据'),
      [el('figure', {}, [plot, el('figcaption', { text: '量级悬殊的几项（老井产油与措施增油差一个数量级）画偏差百分比，绝对值见表格视图。' })]),
       tableView([{ h: '项目', k: 'label' }, { h: '计划', k: 'plan', num: true, d: 0 }, { h: '实际', k: 'actual', num: true, d: 0 }, { h: '偏差 %', k: 'deviation_pct', num: true, d: 1 }],
         rows.map(r => ({ label: r.label, ...r.raw })))])));
  }

  /* 各单元 SEC 储量构成：两期对比 */
  if (!cur._error && !prev._error) {
    const rows = cur.units.flatMap(u => {
      const p = prev.units.find(x => x.unit_id === u.unit_id);
      return [{ label: `${u.unit_id} · ${prev.as_of.slice(0, 4)}`, tip: `${u.unit_name} · ${prev.as_of}`, values: p ? p.components : {} },
        { label: `${u.unit_id} · ${cur.as_of.slice(0, 4)}`, tip: `${u.unit_name} · ${cur.as_of}`, values: u.components }];
    });
    const fig = el('figure', {}, legend(C.map(c => ({ name: c.name, color: c.color, kind: 'box' }))));
    const plot = el('div'); fig.appendChild(plot);
    hStackedBars(plot, { rows, series: C, unit: 't', labelW: 150 });
    fig.appendChild(el('figcaption', { text: 'SEC 价口径两期对比。上一期的"本期新井 / 本期措施"到了下一期已并入老井基础，所以老井基础逐期抬升是正常现象。' }));
    body.appendChild(el('div', { style: 'margin-top:14px' }, card('各单元 SEC 储量构成（两期对比）', `${cur.scope.name}｜${prev.as_of} 与 ${cur.as_of}`, [fig,
      tableView([{ h: '单元', k: 'unit_id' }, { h: '基准日', k: 'as_of' }, ...C.map(c => ({ h: c.name + ' (t)', k: c.key, num: true, d: 0 })), { h: '合计 (t)', k: 'total_t', num: true, d: 0 }],
        [prev, cur].flatMap(cp => cp.units.map(u => ({ unit_id: u.unit_id, as_of: cp.as_of, total_t: u.total_t, ...u.components }))))])));
  }
}

/* ── 智能体对话：工具调用轨迹是这一页的主角 ── */
function renderChat() {
  const host = $('#tab-chat');
  if (host.dataset.built) return;
  host.dataset.built = '1';
  host.innerHTML = '';

  const input = el('input', { type: 'text', placeholder: '例如：某口井的 SEC 储量预评估，或某个 SEC 单元的储量构成', style: 'flex:1;min-width:260px' });
  const btn = el('button', { class: 'primary', text: '提问' });
  const askBar = el('div', { class: 'filters' }, [input, btn]);
  const aWell = () => S.current || (S.wells[0] && S.wells[0].well_code) || '';
  const exBtn = (text, q) => el('button', { text, onclick: () => { input.value = q(); ask(); } });
  const group = (label, kids) => el('div', { class: 'exgroup' }, [el('span', { class: 'exlabel', text: label }), ...kids]);
  const unitGroup = group('SEC 单元', [el('span', { class: 'exlabel', text: '加载中…' })]);
  const ex = el('div', { class: 'examples' }, [
    group('单井', [['达峰预测', '什么时候达峰'], ['SEC 预评估', '的 SEC 储量预评估'], ['动静态互校', '动静态储量对得上吗'],
      ['递减分析', '递减曲线分析']].map(([t, q]) => exBtn(t, () => `${aWell()} ${q}`))),
    unitGroup,
    group('边界测试', [exBtn('缺井号（看反问）', () => '帮我预测达峰时间'),
      exBtn('不存在的井（看异常处理）', () => 'GL-Z-9999 什么时候达峰'),
      exBtn('越权请求（看边界拦截）', () => `把 ${aWell()} 的储量结果写回生产库`)])]);
  ensureUnits().then(u => {
    const unit = u.plants[0].units[0].unit_id, plant = u.plants[0].plant_name;
    const [y0, y1] = [u.evaluation_dates[0].slice(0, 4), u.evaluation_dates.at(-1).slice(0, 4)];
    const qs = [['储量构成', `${u.company.name} 的 SEC 储量构成`], ['对账与归因', `${unit} ${y0}年到${y1}年储量为什么变化`],
      ['自然递减', `${plant} 扣3年和扣5年自然递减率`], ['措施效果', `${unit} 本期措施效果`], ['敏感性', `${u.company.name} 油价和成本敏感性`]];
    unitGroup.replaceChildren(el('span', { class: 'exlabel', text: 'SEC 单元' }), ...qs.map(([t, q]) => exBtn(t, () => q)));
  }).catch(() => unitGroup.remove());

  const answer = el('div', { class: 'answer', text: '在上面提问，或点一个示例。' });
  const answerCard = card('回答', '', answer);
  const traceHost = el('div', { class: 'trace' }, [
    ['意图路由', '先判断问的是单井还是 SEC 单元，再选意图；越权请求直接拦下'],
    ['槽位抽取', '井号、评估对象、年份、价格情景；缺了就反问，不猜'],
    ['按计划调工具', '固定的工具链，大模型只填参数；工具失败如实转述'],
    ['成文与数值回查', '回答里的每个数字逐个回查工具返回值，对不上就重写或降级为模板']
  ].map(([t, d], i) => el('div', { class: 'tstep' }, [
    el('div', {}, el('div', { class: 'tdot', style: 'background:var(--rule)' })),
    el('div', {}, [el('div', { class: 'tname', text: `${i + 1}. ${t}` }), el('div', { class: 'targs', text: d })])])));
  const guardBox = el('div', { style: 'margin-bottom:12px' });
  const traceCard = card('工具调用轨迹', '大模型没有直接接触数据：它只能调下面这些工具，回答里的每个数字都要能在工具返回值里找到。',
    [guardBox, traceHost]);

  host.appendChild(askBar); host.appendChild(ex);
  host.appendChild(el('div', { class: 'chatgrid', style: 'margin-top:14px' }, [answerCard, traceCard]));

  async function ask() {
    const q = input.value.trim(); if (!q) return;
    btn.disabled = true; answer.textContent = '思考中…'; traceHost.innerHTML = ''; guardBox.innerHTML = '';
    try {
      const r = await fetch('/api/v1/agent/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const a = await r.json();
      answer.textContent = a.answer;
      const g = a.guard || {};
      guardBox.appendChild(el('div', { class: 'legend' }, [
        el('span', { class: 'chip ' + (g.ok ? 'ok' : 'crit'), text: g.ok ? `数值一致性通过（校验 ${g.numbers_checked} 个数字）` : `数值一致性未通过（${(g.violations || []).length} 处）` }),
        el('span', { class: 'chip solid', text: `意图 ${a.intent}（${a.route.method}｜置信度 ${a.route.confidence}）` }),
        el('span', { class: 'chip solid mono', text: a.elapsed_ms + ' ms' }),
        a.degraded ? el('span', { class: 'chip warn', text: '已降级为模板成文' }) : null,
        (a.citations && a.citations.cited && a.citations.cited.length)
          ? el('span', { class: 'chip ' + (a.citations.invalid.length ? 'crit' : 'ok'), text: `条款引用 ${a.citations.cited.length} 条，无效 ${a.citations.invalid.length}` }) : null
      ].filter(Boolean)));
      if (!a.tool_trace.length) {
        traceHost.appendChild(el('p', { class: 'empty', text: '本次未调用任何工具（反问澄清或越权拦截）' }));
      }
      a.tool_trace.forEach(t => traceHost.appendChild(el('div', { class: 'tstep ' + t.status }, [
        el('div', {}, el('div', { class: 'tdot' })),
        el('div', {}, [
          el('div', { class: 'tname' }, [t.tool, ' ',
          el('span', { class: 'chip ' + (t.status === 'ok' ? 'ok' : 'crit'), text: t.status }), ' ',
          el('span', { class: 'chip solid mono', text: t.elapsed_ms + 'ms' })]),
          el('div', { class: 'targs mono', text: JSON.stringify(t.args) }),
          t.error ? el('div', { class: 'terr', text: t.error }) : null].filter(Boolean))])));
      traceHost.appendChild(el('p', { class: 'sub', style: 'margin-top:12px',
        text: 'trace_id ' + a.trace_id + '：全链路留痕已写入 audit_log，可回溯到输入数据与模型版本。' }));
    } catch (e) {
      answer.textContent = '请求失败：' + e.message;
    } finally { btn.disabled = false; }
  }
  btn.addEventListener('click', ask);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
}

/* ── 评测 ── */
async function renderEval() {
  const host = $('#tab-eval'); host.innerHTML = '<p class="empty">加载中…</p>';
  const e = await api('/eval/summary');
  host.innerHTML = '';
  const CN = {
    intent_accuracy: '意图识别准确率', slot_f1: '槽位抽取 F1', tool_chain_accuracy: '工具链正确率',
    numeric_consistency: '数值一致性通过率', citation_hit_rate: '条款引用命中率',
    hallucination_rate: '无据结论率（幻觉率）', p95_latency_ms: 'P95 响应时间 (ms)',
    human_intervention_rate: '人工干预率'
  };
  if (!e.agent) {
    host.appendChild(card('智能体评测', e.hint, el('p', { class: 'empty', text: '尚未运行评测' })));
  } else {
    const m = e.agent.metrics, t = e.agent.targets, p = m.pass_targets;
    const rows = Object.keys(t).map(k => ({
      k: CN[k] || k, v: m[k], target: t[k], ok: p[k],
      d: k === 'p95_latency_ms' ? 0 : 2
    }));
    const c = card('智能体层指标', `评测集 ${m.n_cases} 条，六类构成。数值一致性由 guard.py 逐个数字回查工具返回值保证，不是模型自觉。`,
      table([{ h: '指标', k: 'k' },
      { h: '实测', k: 'v', num: true, render: r => el('span', { class: 'mono', text: r.d ? Number(r.v).toFixed(r.d) : fmt(r.v, 0) }) },
      { h: '目标', k: 'target', num: true, render: r => el('span', { class: 'mono', text: r.d ? Number(r.target).toFixed(r.d) : fmt(r.target, 0) }) },
      { h: '达标', k: 'ok', render: r => el('span', { class: 'chip ' + (r.ok ? 'ok' : 'crit'), text: r.ok ? '是' : '否' }) }], rows));
    const CAT_CN = { normal: '正常问法', colloquial: '口语省略', composite: '跨模块组合', missing_data: '缺数据',
      out_of_scope: '越权请求', adversarial: '诱导性提问' };
    const byCat = Object.entries(e.agent.by_category).map(([k, v]) => ({ cat: CAT_CN[k] || k, ...v }));
    const c2 = card('分类别表现', '诱导性提问与越权请求是幻觉最容易冒出来的地方，单独看。',
      table([{ h: '类别', k: 'cat' }, { h: '用例数', k: 'n', num: true, d: 0 },
      { h: '意图准确率', k: 'intent_accuracy', num: true, render: r => el('span', { class: 'mono', text: Number(r.intent_accuracy).toFixed(2) }) },
      { h: '数值一致性', k: 'numeric_consistency', num: true, render: r => el('span', { class: 'mono', text: Number(r.numeric_consistency).toFixed(2) }) }], byCat));
    host.appendChild(el('div', { class: 'grid g2' }, [c, c2]));
    host.appendChild(card('这张表的边界', '',
      el('p', { class: 'sub', style: 'margin:0',
        text: '150 条用例由模板按井号铺开生成，是我们自己出的题，不是硬基准。真正有价值的评测集要由业务方出题。' })));
  }
  if (e.algo) {
    const SPLIT_CN = { time: '时间外推', group: '按区块留出', random: '随机（仅对照）' };
    const rows = e.algo.rows.map(r => ({ ...r, split: SPLIT_CN[r.split] || r.split, target: TARGET_CN[r.target] || r.target }));
    host.appendChild(el('div', { style: 'margin-top:14px' }, card('切分方式对比', e.algo.conclusion,
      table([{ h: '切分', k: 'split' }, { h: '目标', k: 'target' }, { h: 'MAE', k: 'mae', num: true },
      { h: '覆盖率', k: 'coverage', num: true }, { h: '相对基线', k: 'gain_pct', num: true, d: 1 }], rows))));
  }
}

/* ══════════════════════════════════════════════════════════════
   5. 路由与启动
   ══════════════════════════════════════════════════════════════ */
const RENDER = { overview: renderOverview, well: renderWell, reserves: renderReserves, unit: renderUnit, monitor: renderMonitor, chat: renderChat, eval: renderEval };
function switchTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  Object.keys(RENDER).forEach(t => { $('#tab-' + t).hidden = t !== name; });
  const f = RENDER[name];
  if (f) Promise.resolve(f()).catch(e => { $('#tab-' + name).innerHTML = ''; $('#tab-' + name).appendChild(el('p', { class: 'err', text: '加载失败：' + e.message })); });
}
function pickWell(code) { S.current = code; }
document.querySelectorAll('nav.tabs button').forEach(b =>
  b.addEventListener('click', () => switchTab(b.dataset.tab)));

const themeBtn = $('#themeBtn');
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  themeBtn.textContent = dark ? '浅色' : '深色';
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur === 'dark' || (!cur && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', next); } catch (_) { }
  applyTheme(next);
  const active = document.querySelector('nav.tabs button[aria-selected="true"]');
  if (active) switchTab(active.dataset.tab);   /* 重画图表，让 SVG 取到新的色值 */
});
try { applyTheme(localStorage.getItem('theme')); } catch (_) { applyTheme(null); }

switchTab('overview');
