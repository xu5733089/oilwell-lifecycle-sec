        { label: '增加可采合计', sw: color.measure, ...tU(o.inc_eur_total_t) }]), el('figure', {}, plot)]);
    }
    const decPanel = dec._error ? errPanel('老井基础递减', dec._error) : panel('老井基础递减', {
      meta: '扣除近 N 年新井后的老井基础', note: dec.definition, flush: true
    }, table([{ h: '扣除年限', k: 'exclude_years', render: r => `扣近 ${r.exclude_years} 年` },
      { h: '统计窗口', k: 'w', render: r => `${r.window_start_ym} ~ ${r.window_end_ym}` },
      { h: '自然递减（年 / 月）', k: 'natural_annual_pct', num: true, render: r => `${fmt(r.natural_annual_pct, 1)}% / ${fmt(r.natural_monthly_pct, 2)}%` },
      { h: 'R²', k: 'natural_fit_r2', num: true, d: 3 },
      { h: '综合递减（年 / 月）', k: 'comprehensive_annual_pct', num: true, render: r => `${fmt(r.comprehensive_annual_pct, 1)}% / ${fmt(r.comprehensive_monthly_pct, 2)}%` }], dec.results));
    if (measPanel.querySelector('.kpis')) measPanel.querySelector('.kpis').classList.add('inset');
    return [el('div', { class: 'row c2' }, [measPanel, el('div', { class: 'stack' }, [decPanel,
      alertBar('info', '口径', '自然递减只看老井基础（扣新井、扣措施增油）；综合递减只扣新井、保留措施增油。')])])];
  },

  sens({ sens }) {
    if (sens._error) return [alertBar('crit', '敏感性分析失败', sens._error)];
    const ink = cssVar('--ink-2');
    const base = { price: sens.base_price_usd_bbl, opex: 1, rate: 0, decline: 0 };
    const minis = el('div', { class: 'minis' }, sens.curves.map(cv => {
      const p = el('div');
      deltaLine(p, { x: cv.x, y: cv.delta_t, xLabel: `${cv.name}（${cv.unit}）`, color: ink, baseX: base[cv.param] });
      return el('div', { class: 'mini' }, [el('h4', { text: cv.name }),
        el('div', { class: 'kn', text: `PDP 变化 ${fmtT(cv.delta_t[0])} ~ ${fmtT(cv.delta_t.at(-1))}` }), el('figure', {}, p)]);
    }));
    const curvesPanel = panel('PDP 敏感性曲线', {
      meta: `${sens.scenario_label} · 基准油价 ${sens.base_price_usd_bbl} USD/bbl · 最佳估计 ${fmtT(sens.base_best_estimate_t)}`,
      note: [sens.note, '一个参数一张小图：横轴单位各不相同，不合并成双轴图。']
    }, minis);
    const wPanel = panel('敏感权重', { meta: sens.perturbation, flush: true },
      table([{ h: '参数', k: 'name' }, { h: 'PDP 摆幅 (t)', k: 'swing_t', num: true, d: 0 },
        { h: '权重', k: 'weight_pct', num: true, render: r => fmt(r.weight_pct, 1) + '%' }], sens.weights));
    const wIdx = sens.weights.map((w, i) => ({ h: w.name, k: 'w' + i, num: true, render: r => fmt(r['w' + i], 1) + '%' }));
    const uPanel = panel('各单元参数敏感权重', { meta: '权重最大的参数即该单元下一步的主攻方向', flush: true },
      table([{ h: '单元', k: 'unit_id' }, { h: '最敏感', k: 'top_param', render: r => tag(r.top_param, 'brand') }, ...wIdx],
        sens.units.map(u => ({ unit_id: u.unit_id, top_param: u.top_param, ...Object.fromEntries(u.weights.map((w, i) => ['w' + i, w.weight_pct])) })), { scroll: true }));
    return [curvesPanel, el('div', { class: 'row c12' }, [wPanel, uPanel])];
  }
};

/* ── 运行监控（管理层视角） ── */
async function renderMonitor() {
  const host = $('#tab-monitor'), token = ++S.tok.monitor;
  host.replaceChildren(loading('加载评估单元…'));
  await ensureUnits();
  if (token !== S.tok.monitor || S.page !== 'monitor') return;
  setCtx('monitor', unitCtx({ date: true, dateLabel: '计划对标基准日' }, renderMonitor));
  host.replaceChildren(loading('汇总中…'));
  const dates = S.units.evaluation_dates;
  const comps = [];
  for (const d of dates) comps.push(await softApi('/unit/composition', { scope: S.scope, as_of: d, scenario: 'sec' }));
  const [indi, prod] = await Promise.all([softApi('/unit/indicators', { scope: S.scope, as_of_list: dates.join(',') }),
    softApi('/unit/production', { scope: S.scope, as_of: S.asOf })]);
  if (token !== S.tok.monitor) return;
  const C = COMP();
  const [prev, cur] = [comps[0], comps.at(-1)];
  const out = [];
  let monLeft = null;

  const pa = indi._error ? null : indi.periods[0], pb = indi._error ? null : indi.periods.at(-1);
  if (!cur._error && !prev._error) {
    const dPdp = cur.total_t - prev.total_t;
    out.push(kpiStrip([
      { label: `PDP · ${cur.as_of}`, ...tU(cur.total_t), note: [`较 ${prev.as_of} `, delta(dPdp / 1e4, 2, ' 万 t')] },
      { label: `本期产量 · ${cur.as_of.slice(0, 4)}`, ...tU(cur.production_in_period_t), note: `上期 ${fmtT(prev.production_in_period_t)}` },
      { label: '本期新井', value: cur.new_wells.n_infill + cur.new_wells.n_extension, unit: '口', note: `提采 ${cur.new_wells.n_infill} · 扩边 ${cur.new_wells.n_extension}` },
      { label: '本期措施', value: cur.measures.n_in_period, unit: '次', note: `有效 ${cur.measures.n_effective} · 增加可采 ${fmtT(cur.measures.inc_eur_total_t)}` },
      ...(pb ? pb.groups.map(g => {
        const a = pa.groups.find(x => x.group === g.group) || {};
        return { label: `${g.name}综合分`, value: fmt(g.score, 1), unit: '分', note: ['较上期 ', delta(g.score - a.score, 1)] };
      }) : [])]));
  }

  /* 指标两期对比 */
  if (indi._error) out.push(errPanel('开发与经营指标', indi._error));
  else {
    const rows = pb.indicators.map(r => {
      const a = pa.indicators.find(x => x.key === r.key) || {};
      return { label: r.name, a: a.score, b: r.score, r, prevRow: a,
        tip: `<b>${r.name}</b>` +
          `<div class="row"><span>${pa.as_of}</span><span class="mono">${fmt(a.value)} ${r.unit}｜${fmt(a.score, 1)} 分</span></div>` +
          `<div class="row"><span>${pb.as_of}</span><span class="mono">${fmt(r.value)} ${r.unit}｜${fmt(r.score, 1)} 分</span></div>` +
          `<div class="row"><span>锚点</span><span class="mono">优 ${r.good}｜差 ${r.bad}</span></div>` };
    });
    const plot = el('div');
    dumbbell(plot, rows, { aColor: cssVar('--c1-soft'), bColor: cssVar('--c1') });
    const dPanel = panel('开发与经营指标评价', {
      meta: `${indi.scope.name} · 得分 0 ~ 100`,
      note: [indi.scoring + '。', '两期对比用哑铃图而不是雷达图：雷达图的面积随轴的排列顺序变化，读不准差值。']
    }, [legend([{ name: pa.as_of, color: cssVar('--c1-soft'), kind: 'dot' }, { name: pb.as_of, color: cssVar('--c1'), kind: 'dot' }]), el('figure', {}, plot)]);
    const tPanel = panel('指标明细', { meta: `${pb.as_of} 较 ${pa.as_of}`, flush: true },
      table([{ h: '指标', k: 'label' },
        { h: '本期值', k: 'v', num: true, render: x => `${fmt(x.r.value)} ${x.r.unit}` },
        { h: '得分', k: 'b', num: true, d: 1 },
        { h: '较上期', k: 'd', num: true, render: x => delta(x.b - x.a, 1) }], rows));
    monLeft = el('div', { class: 'stack' }, dPanel);
    out.push(el('div', { class: 'row c21' }, [monLeft, tPanel]));
  }

  const lower = [];
  /* 计划与实际 */
  if (prod._error) lower.push(errPanel('计划与实际对标', prod._error));
  else {
    const PT = [['new_wells', '新井投产（口）'], ['new_oil', '新井产油（t）'], ['measure_wells', '措施（井次）'], ['measure_inc', '措施增油（t）'], ['old_oil', '老井产油（t）']];
    const rows = PT.map(([k, label]) => ({ label, value: prod.period_totals[k].deviation_pct ?? 0, raw: prod.period_totals[k] }));
    const plot = el('div');
    divergingBars(plot, rows, '%', { color: cssVar('--neutral-2'), suffix: '%', axisLabel: '← 低于计划　偏差（%）　高于计划 →',
      tip: r => `<b>${r.label}</b><div class="row"><span>计划</span><span class="mono">${fmt(r.raw.plan, 0)}</span></div>` +
        `<div class="row"><span>实际</span><span class="mono">${fmt(r.raw.actual, 0)}</span></div>` +
        `<div class="row"><span>偏差</span><span class="mono">${fmt(r.raw.deviation_pct, 1)}%</span></div>` });
    lower.push(panel('计划与实际对标', {
      meta: `${prod.scope.name} · 本期 ${prod.period_start_ym} ~ ${prod.period_end_ym}`,
      actions: prod.plan_available ? [] : [tag('未导入计划数据', 'warn')],
      note: '量级悬殊的几项（老井产油与措施增油差一个数量级）画偏差百分比，绝对值见表格。',
      table: table([{ h: '项目', k: 'label' }, { h: '计划', k: 'plan', num: true, d: 0 }, { h: '实际', k: 'actual', num: true, d: 0 },
        { h: '偏差', k: 'deviation_pct', num: true, render: r => r.deviation_pct == null ? '—' : signed(r.deviation_pct, 1) + '%' }],
        rows.map(r => ({ label: r.label, ...r.raw })))
    }, el('figure', {}, plot)));
  }

  /* 各单元 SEC 储量构成：两期对比 */
  if (!cur._error && !prev._error) {
    const rows = cur.units.flatMap(u => {
      const p = prev.units.find(x => x.unit_id === u.unit_id);
      return [{ label: `${u.unit_id} · ${prev.as_of.slice(0, 4)}`, tip: `${u.unit_name} · ${prev.as_of}`, values: p ? p.components : {} },
        { label: `${u.unit_id} · ${cur.as_of.slice(0, 4)}`, tip: `${u.unit_name} · ${cur.as_of}`, values: u.components }];
    });
    const plot = el('div');
    hStackedBars(plot, { rows, series: C, unit: 't', labelW: 150 });
    lower.push(panel('各单元 SEC 储量构成 · 两期', {
      meta: `${prev.as_of} 与 ${cur.as_of} · SEC 价口径`,
      note: '上一期的"本期新井 / 本期措施"到了下一期已并入老井基础，所以老井基础逐期抬升是正常现象。',
      table: table([{ h: '单元', k: 'unit_id' }, { h: '基准日', k: 'as_of' }, ...C.map(c => ({ h: c.name + ' (t)', k: c.key, num: true, d: 0 })), { h: '合计 (t)', k: 'total_t', num: true, d: 0 }],
        cur.units.flatMap(u => [prev, cur].map(cp => {
          const x = cp.units.find(v => v.unit_id === u.unit_id) || { components: {} };
          return { unit_id: u.unit_id, as_of: cp.as_of, total_t: x.total_t, ...x.components };
        })), { scroll: true })
    }, [legend(C.map(c => ({ name: c.name, color: c.color, kind: 'box' }))), el('figure', {}, plot)]));
  }
  /* 计划对标面板较矮：放进左栏指标图下方，与右侧指标明细等高；两期构成单独占满一行 */
  const [planPanel, unitsPanel] = lower;
  if (monLeft) monLeft.appendChild(planPanel);
  else out.push(el('div', { class: 'row' }, planPanel));
  if (unitsPanel) out.push(el('div', { class: 'row' }, unitsPanel));
  host.replaceChildren(...out);
}

/* ── 智能问答：工具调用轨迹是这一页的主角 ── */
function renderChat() {
  const host = $('#tab-chat');
  setCtx('chat', [tag('规则路由 + 固定工具链', 'brand'), tag('数值逐个回查')]);
  if (host.dataset.built) return;
  host.dataset.built = '1';

  const input = el('textarea', { rows: 3, placeholder: '输入问题，例如：某口井的 SEC 储量预评估；某个 SEC 单元的储量为什么变化', 'aria-label': '问题' });
  const btn = el('button', { class: 'btn primary', type: 'button' }, [icon('send'), '发送']);
  const aWell = () => S.current || (S.wells[0] && S.wells[0].well_code) || '';
  const qBtn = (text, q) => el('button', { type: 'button', text, onclick: () => { input.value = q(); ask(); } });
  const unitGroup = el('div', {}, [el('div', { class: 'qg', text: 'SEC 单元' }), el('div', { class: 'qg', text: '加载中…' })]);
  const qlist = el('div', { class: 'qlist' }, [
    el('div', { class: 'qg', text: '单井' }),
    ...[['达峰时间预测', '什么时候达峰'], ['SEC 储量预评估', '的 SEC 储量预评估'], ['动静态储量互校', '动静态储量对得上吗'],
      ['递减曲线分析', '递减曲线分析']].map(([t, q]) => qBtn(t, () => `${aWell()} ${q}`)),
    unitGroup,
    el('div', { class: 'qg', text: '边界测试' }),
    qBtn('缺井号（反问澄清）', () => '帮我预测达峰时间'),
    qBtn('不存在的井（异常处理）', () => 'GL-Z-9999 什么时候达峰'),
    qBtn('越权请求（边界拦截）', () => `把 ${aWell()} 的储量结果写回生产库`)]);
  ensureBase().catch(() => null);
  ensureUnits().then(u => {
    const unit = u.plants[0].units[0].unit_id, plant = u.plants[0].plant_name;
    const [y0, y1] = [u.evaluation_dates[0].slice(0, 4), u.evaluation_dates.at(-1).slice(0, 4)];
    const qs = [['储量构成', `${u.company.name} 的 SEC 储量构成`], ['对账与变化归因', `${unit} ${y0}年到${y1}年储量为什么变化`],
      ['自然递减率', `${plant} 扣3年和扣5年自然递减率`], ['措施效果', `${unit} 本期措施效果`], ['油价与成本敏感性', `${u.company.name} 油价和成本敏感性`]];
    unitGroup.replaceChildren(el('div', { class: 'qg', text: 'SEC 单元' }), ...qs.map(([t, q]) => qBtn(t, () => q)));
  }).catch(() => unitGroup.remove());

  const meta = el('div', { class: 'ameta' });
  const answer = el('div', { class: 'answer placeholder', text: '输入问题，或点选常用问题。' });
  const composer = el('div', { class: 'composer' }, [input, el('div', { class: 'cbar' }, [
    el('span', { class: 'hint', text: 'Enter 发送 · Shift + Enter 换行' }), el('span', { class: 'spacer' }), btn])]);
  const ansPanel = panel('分析结果', { meta: '回答由工具返回值成文' }, [meta, answer]);
  ansPanel.appendChild(composer);

  const idle = () => [['意图路由', '先判断问的是单井还是 SEC 单元，再选意图；越权请求直接拦下'],
    ['槽位抽取', '井号、评估对象、年份、价格情景；缺了就反问，不猜'],
    ['按计划调工具', '固定的工具链，大模型只填参数；工具失败如实转述'],
    ['成文与数值回查', '回答里的每个数字逐个回查工具返回值，对不上就重写或降级为模板']
  ].map(([t, d], i) => el('div', { class: 'tstep idle' }, [el('div', {}, el('div', { class: 'tdot' })),
    el('div', {}, [el('div', { class: 'tname', text: `${i + 1}. ${t}` }), el('div', { class: 'targs', text: d })])]));
  const trace = el('div', { class: 'trace' }, idle());
  const tracePanel = panel('调用轨迹', { note: '它只能调用下列工具；回答里的每个数字都要能在工具返回值里找到。' }, trace);
  tracePanel.querySelector('.pb').classList.add('flush');

  host.replaceChildren(el('div', { class: 'chat' }, [
    el('div', { class: 'qcol' }, panel('常用问题', { flush: true }, qlist)), ansPanel,
    el('div', { class: 'trace-col' }, tracePanel)]));

  async function ask() {
    const q = input.value.trim(); if (!q) return;
    btn.disabled = true; answer.className = 'answer placeholder'; answer.textContent = '分析中…';
    meta.replaceChildren(); trace.replaceChildren(loading('调用工具中…'));
    try {
      const r = await fetch('/api/v1/agent/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q })
      });
      const a = await r.json();
      answer.className = 'answer'; answer.textContent = a.answer;
      const g = a.guard || {};
      meta.replaceChildren(...[
        tag(g.ok ? `数值一致性通过 · ${g.numbers_checked} 个数字` : `数值一致性未通过 · ${(g.violations || []).length} 处`, g.ok ? 'ok' : 'crit'),
        tag(`意图 ${a.intent} · ${a.route.method} · 置信度 ${a.route.confidence}`),
        tag(a.elapsed_ms + ' ms'),
        a.degraded ? tag('已降级为模板成文', 'warn') : null,
        (a.citations && a.citations.cited && a.citations.cited.length)
          ? tag(`条款引用 ${a.citations.cited.length} 条 · 无效 ${a.citations.invalid.length}`, a.citations.invalid.length ? 'crit' : 'ok') : null
      ].filter(Boolean));
      trace.replaceChildren(...(a.tool_trace.length ? a.tool_trace.map(t => el('div', { class: 'tstep ' + t.status }, [
        el('div', {}, el('div', { class: 'tdot' })),
        el('div', {}, [
          el('div', { class: 'tname' }, [t.tool, tag(t.status, t.status === 'ok' ? 'ok' : 'crit'), el('span', { class: 'muted mono', style: 'font-size:11px', text: t.elapsed_ms + ' ms' })]),
          el('div', { class: 'targs mono', text: JSON.stringify(t.args) }),
          t.error ? el('div', { class: 'terr', text: t.error }) : null])])) : [emptyState('本次未调用任何工具（反问澄清或越权拦截）')]),
        el('div', { class: 'targs', style: 'padding:10px 0', text: `trace_id ${a.trace_id} · 全链路留痕已写入 audit_log，可回溯到输入数据与模型版本。` }));
    } catch (e) {
      answer.className = 'answer'; answer.textContent = '请求失败：' + e.message; trace.replaceChildren(...idle());
    } finally { btn.disabled = false; }
  }
  btn.addEventListener('click', ask);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
}

/* ── 模型评测 ── */
async function renderEval() {
  const host = $('#tab-eval');
  host.replaceChildren(loading());
  const e = await api('/eval/summary');
  if (S.page !== 'eval') return;
  const CN = {
    intent_accuracy: '意图识别准确率', slot_f1: '槽位抽取 F1', tool_chain_accuracy: '工具链正确率',
    numeric_consistency: '数值一致性通过率', citation_hit_rate: '条款引用命中率',
    hallucination_rate: '无据结论率（幻觉率）', p95_latency_ms: 'P95 响应时间 (ms)', human_intervention_rate: '人工干预率'
  };
  const out = [];
  if (!e.agent) out.push(alertBar('info', '尚未运行智能体评测', e.hint));
  else {
    const m = e.agent.metrics, t = e.agent.targets, p = m.pass_targets;
    const nPass = Object.values(p).filter(Boolean).length, nAll = Object.keys(t).length;
    setCtx('eval', [tag(`评测集 ${m.n_cases} 条`), tag(`达标 ${nPass} / ${nAll}`, nPass === nAll ? 'ok' : 'warn')]);
    out.push(kpiStrip([
      { label: '意图识别准确率', value: fmt(m.intent_accuracy * 100, 1), unit: '%', note: `目标 ≥ ${fmt(t.intent_accuracy * 100, 0)}%` },
      { label: '数值一致性', value: fmt(m.numeric_consistency * 100, 1), unit: '%', note: '由 guard.py 逐个数字回查' },
      { label: '幻觉率', value: fmt(m.hallucination_rate * 100, 1), unit: '%', note: `目标 ≤ ${fmt(t.hallucination_rate * 100, 0)}%` },
      { label: 'P95 响应', value: fmt(m.p95_latency_ms, 0), unit: 'ms', note: `中位 ${fmt(m.median_latency_ms, 0)} ms` },
      { label: '指标达标', value: `${nPass} / ${nAll}`, note: `人工干预率 ${fmt(m.human_intervention_rate * 100, 1)}%` }]));
    const rows = Object.keys(t).map(k => ({ k: CN[k] || k, v: m[k], target: t[k], ok: p[k], d: k === 'p95_latency_ms' ? 0 : 2 }));
    const aPanel = panel('智能体层指标', {
      meta: `评测集 ${m.n_cases} 条 · 六类构成`, flush: true,
      note: ['数值一致性由 guard.py 逐个数字回查工具返回值保证，不是模型自觉。',
        '150 条用例由模板按井号铺开生成，是我们自己出的题，不是硬基准；真正有价值的评测集要由业务方出题。']
    }, table([{ h: '指标', k: 'k' },
      { h: '实测', k: 'v', num: true, render: r => r.d ? Number(r.v).toFixed(r.d) : fmt(r.v, 0) },
      { h: '目标', k: 'target', num: true, render: r => r.d ? Number(r.target).toFixed(r.d) : fmt(r.target, 0) },
      { h: '状态', k: 'ok', render: r => tag(r.ok ? '达标' : '未达标', r.ok ? 'ok' : 'crit') }], rows));
    const CAT_CN = { normal: '正常问法', colloquial: '口语省略', composite: '跨模块组合', missing_data: '缺数据',
      out_of_scope: '越权请求', adversarial: '诱导性提问' };
    const byCat = Object.entries(e.agent.by_category).map(([k, v]) => ({ cat: CAT_CN[k] || k, ...v }));
    const cPanel = panel('分类别表现', { meta: '诱导性提问与越权请求是幻觉最容易冒出来的地方', flush: true },
      table([{ h: '类别', k: 'cat' }, { h: '用例数', k: 'n', num: true, d: 0 },
        { h: '意图准确率', k: 'intent_accuracy', num: true, render: r => Number(r.intent_accuracy).toFixed(2) },
        { h: '数值一致性', k: 'numeric_consistency', num: true, render: r => Number(r.numeric_consistency).toFixed(2) }], byCat));
    out.push(el('div', { class: 'row c2' }, [aPanel, cPanel]));
  }
  if (e.algo) {
    const SPLIT_CN = { time: '时间外推', group: '按区块留出', random: '随机（仅对照）' };
    const order = Object.keys(SPLIT_CN);
    const splits = [...new Set(e.algo.rows.map(r => r.split))].sort((a, b) => (order.indexOf(a) + 99 * (order.indexOf(a) < 0)) - (order.indexOf(b) + 99 * (order.indexOf(b) < 0)));
    const rows = splits.flatMap(s => [{ _group: SPLIT_CN[s] || s },
      ...e.algo.rows.filter(r => r.split === s).map(r => ({ ...r, target: TARGET_CN[r.target] || r.target }))]);
    out.push(el('div', { class: 'row' }, panel('算法层 · 切分方式对比', { meta: '对外报告一律使用时间外推切分的指标', note: e.algo.conclusion, flush: true },
      table([{ h: '目标', k: 'target' }, { h: 'MAE', k: 'mae', num: true }, { h: '覆盖率', k: 'coverage', num: true },
        { h: '相对基线 (%)', k: 'gain_pct', num: true, d: 1 }], rows))));
  }
  host.replaceChildren(...out);
}

/* ══════════════════════════════════════════════════════════════
   5. 路由与启动（hash 路由：#/unit 可直接收藏、分享）
   ══════════════════════════════════════════════════════════════ */
const PAGES = {
  overview: { group: '工作台', title: '总览', icon: 'dash', render: renderOverview },
  well: { group: '单井分析', title: '全生命周期预测', icon: 'trend', render: renderWell },
  reserves: { group: '单井分析', title: '储量与 SEC 预评估', icon: 'db', render: renderReserves },
  unit: { group: 'SEC 单元', title: '构成评估', icon: 'layers', render: renderUnit },
  monitor: { group: 'SEC 单元', title: '运行监控', icon: 'bars', render: renderMonitor },
  chat: { group: '智能分析', title: '智能问答', icon: 'chat', render: renderChat },
  eval: { group: '系统', title: '模型评测', icon: 'check', render: renderEval }
};
(function buildNav() {
  const nav = $('#nav');
  let g = null;
  Object.entries(PAGES).forEach(([k, p]) => {
    if (p.group !== g) { g = p.group; nav.appendChild(el('div', { class: 'ngroup', text: g })); }
    nav.appendChild(el('a', { href: '#/' + k, 'data-page': k }, [icon(p.icon), el('span', { text: p.title })]));
  });
})();

function switchTab(name) {
  if (!PAGES[name]) name = 'overview';
  const p = PAGES[name];
  S.page = name; hideTip();
  document.querySelectorAll('#nav a').forEach(a => {
    if (a.dataset.page === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  Object.keys(PAGES).forEach(k => { $('#tab-' + k).hidden = k !== name; });
  $('#crumb').replaceChildren(el('span', { text: p.group }), el('span', { class: 'sep', text: '/' }), el('span', { class: 'cur', text: p.title }));
  $('#ptitle').textContent = p.title;
  document.title = `${p.title} · 储量评估系统`;
  $('#ctx').replaceChildren();
  if (location.hash !== '#/' + name) history.replaceState(null, '', '#/' + name);
  Promise.resolve(p.render()).catch(e => {
    if (S.page === name) $('#tab-' + name).replaceChildren(alertBar('crit', '加载失败', e.message));
  });
}
const routeFromHash = () => (location.hash.match(/^#\/(\w+)/) || [])[1] || 'overview';
addEventListener('hashchange', () => { if (routeFromHash() !== S.page) { switchTab(routeFromHash()); scrollTo(0, 0); } });

const themeBtn = $('#themeBtn');
const isDark = () => {
  const t = document.documentElement.getAttribute('data-theme');
  return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
};
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  themeBtn.replaceChildren(icon(isDark() ? 'sun' : 'moon'));
  themeBtn.title = isDark() ? '切换到浅色' : '切换到深色';
}
themeBtn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('theme', next); } catch (_) { }
  applyTheme(next);
  if (S.page) switchTab(S.page);   /* 重画图表，让 SVG 取到新的色值 */
});
try { applyTheme(localStorage.getItem('theme')); } catch (_) { applyTheme(null); }

switchTab(routeFromHash());
</script>
</body>
