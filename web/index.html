<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>油井全生命周期与 SEC 储量预评估平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C16 3 6 15 6 21a10 10 0 0 0 20 0C26 15 16 3 16 3z' fill='%231F5BB8'/%3E%3C/svg%3E">
<style>
/* ────────────────────────────────────────────────────────────────
   零依赖：不引 Vue / ECharts / 任何 CDN。
   内网装不了 npm 也连不了外网，图表全部手写 SVG。
   布局：企业业务系统 —— 深色侧栏分组导航 + 白色工作区 + 紧凑表格。
   ──────────────────────────────────────────────────────────────── */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --sunk:#F4F6F9;
  --ink:#1A2332; --ink-2:#3F4A5A; --muted:#667185; --rule:#DCE1E8; --rule-soft:#EBEEF2;
  --brand:#1F5BB8; --brand-hover:#194C9C; --brand-soft:#EAF1FB; --brand-ink:#1A4F9E;
  --side:#101B2D; --side-2:#18263D; --side-ink:#C5CEDB; --side-muted:#7D8AA0; --side-rule:#1F2D45;
  /* 分类色：validate_palette.js 在 #FFFFFF / #141B26 两种表面上全项通过（四色相邻 CVD ΔE ≥ 10） */
  --c1:#0E8F7F; --c2:#C25E12; --c3:#3B4FA8; --c4:#B8487F;
  --c1-soft:#8CC7BE;
  --neutral:#A9B1BC; --neutral-2:#6F7A89;
  --ok:#1E7A4C; --warn:#9A6700; --crit:#B3372B;
  --ok-bg:#E8F4EE; --warn-bg:#FBF3E0; --crit-bg:#FBECEA;
  --shadow:0 1px 2px rgba(16,27,45,.06);
  --shadow-pop:0 6px 24px -6px rgba(16,27,45,.22);
  --side-w:220px; --nav-active:#1F5BB8;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B111A; --surface:#141B26; --surface-2:#19212E; --sunk:#111823;
  --ink:#E3E8EF; --ink-2:#B8C2D0; --muted:#8A95A6; --rule:#283243; --rule-soft:#1F2835;
  --brand:#5B8FE0; --brand-hover:#77A3E8; --brand-soft:#1A2940; --brand-ink:#8DB3EE;
  --side:#080D15; --side-2:#131C2B; --side-ink:#C5CEDB; --side-muted:#707D92; --side-rule:#172133; --nav-active:#2A5AA8;
  /* dark 模式单独选步，不是自动翻转 */
  --c1:#19A492; --c2:#D2731F; --c3:#5468C4; --c4:#D0679B;
  --c1-soft:#2F6F66;
  --neutral:#566070; --neutral-2:#8A95A5;
  --ok:#5CBB86; --warn:#D3A74E; --crit:#E57E70;
  --ok-bg:#16291F; --warn-bg:#2B2413; --crit-bg:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 8px 28px -6px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0B111A; --surface:#141B26; --surface-2:#19212E; --sunk:#111823;
  --ink:#E3E8EF; --ink-2:#B8C2D0; --muted:#8A95A6; --rule:#283243; --rule-soft:#1F2835;
  --brand:#5B8FE0; --brand-hover:#77A3E8; --brand-soft:#1A2940; --brand-ink:#8DB3EE;
  --side:#080D15; --side-2:#131C2B; --side-ink:#C5CEDB; --side-muted:#707D92; --side-rule:#172133; --nav-active:#2A5AA8;
  --c1:#19A492; --c2:#D2731F; --c3:#5468C4; --c4:#D0679B;
  --c1-soft:#2F6F66;
  --neutral:#566070; --neutral-2:#8A95A5;
  --ok:#5CBB86; --warn:#D3A74E; --crit:#E57E70;
  --ok-bg:#16291F; --warn-bg:#2B2413; --crit-bg:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 8px 28px -6px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:13px; line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
              "Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);padding:6px 10px;border-radius:4px}
.skip:focus{left:8px}

/* ── 侧栏 ── */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;z-index:30}
.brandbox{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--side-rule);min-height:60px}
.brandbox .mark{width:28px;height:28px;border-radius:6px;background:var(--brand);display:grid;place-items:center;flex:none}
.brandbox .mark svg{width:16px;height:16px;fill:#fff}
.brandbox b{display:block;font-size:14.5px;color:#fff;font-weight:600;letter-spacing:.02em;line-height:1.25}
.brandbox small{display:block;font-size:11px;color:var(--side-muted);line-height:1.3}
.navscroll{flex:1;overflow-y:auto;padding:10px 0 16px}
.ngroup{padding:12px 18px 6px;font-size:11px;letter-spacing:.08em;color:var(--side-muted)}
.nav a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:0 10px;height:36px;border-radius:5px;
  color:var(--side-ink);text-decoration:none;font-size:13px;position:relative}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a[aria-current="page"]{background:var(--nav-active);color:#fff;font-weight:500}
.nav a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.sidefoot{border-top:1px solid var(--side-rule);padding:12px 18px;font-size:11px;color:var(--side-muted);line-height:1.7}
.sidefoot .mono{color:var(--side-ink);font-size:11px}

/* ── 顶栏 + 页头 ── */
.shell{margin-left:var(--side-w);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.topbar{height:48px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--rule-soft)}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumb .sep{color:var(--rule)}
.crumb .cur{color:var(--ink)}
.spacer{flex:1}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:5px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink-2);cursor:pointer}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.pagebar{display:flex;align-items:center;gap:10px 16px;padding:10px 20px;flex-wrap:wrap;min-height:54px}
.pagebar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.ctx{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-left:auto;min-width:0;max-width:100%}
.cf{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.cf>label{font-size:12px;color:var(--muted);white-space:nowrap}
.cf select{min-width:0}
main{padding:16px 20px 32px;flex:1}
.view[hidden]{display:none!important}

/* ── 标签 ── */
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:3px;font-size:12px;
  background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;line-height:1}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.tag.crit{color:var(--crit);background:var(--crit-bg);border-color:transparent}
.tag.brand{color:var(--brand-ink);background:var(--brand-soft);border-color:transparent}
.tag .dotc{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── 控件 ── */
select,input[type=text],textarea{background:var(--surface);color:var(--ink);border:1px solid var(--rule);
  border-radius:4px;padding:0 8px;height:32px;font-size:13px;font-family:inherit;max-width:100%}
textarea{height:auto;padding:8px 10px;resize:vertical;line-height:1.55}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);
  font-size:13px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--nav-active);border-color:var(--nav-active);color:#fff}
.btn.primary:hover{filter:brightness(1.12);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{height:24px;padding:0 9px;border:0;background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.ibtn{height:24px;padding:0 7px;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:4px;border-radius:4px}
.ibtn svg.ic{width:14px;height:14px}
.ibtn:hover,.ibtn[aria-expanded="true"]{color:var(--brand);background:var(--brand-soft)}

/* ── 布局 ── */
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:grid;gap:16px;margin-top:16px;align-items:start}
.row:first-child{margin-top:0}
.row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.c21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row.c12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
@media(max-width:1180px){.row.c2,.row.c21,.row.c12{grid-template-columns:minmax(0,1fr)}}

/* ── 面板 ── */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:6px 12px;padding:0 14px 0 16px;min-height:44px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.ph h3{margin:0;font-size:13.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
.ph h3::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}
.ph .pm{font-size:12px;color:var(--muted);min-width:0;flex:1 1 120px;padding:6px 0}
.ph .pa{display:flex;align-items:center;gap:6px;margin-left:auto;padding:8px 0}
.pnote{padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--rule-soft);font-size:12px;color:var(--ink-2);line-height:1.7}
.pnote p{margin:0}
.pnote p+p{margin-top:4px}
.pb{padding:14px 16px}
.pb.flush{padding:0}
.pfoot{padding:8px 16px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ── 指标条 ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.kpi{padding:12px 16px;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);margin-right:-1px;margin-bottom:-1px;min-width:0}
.kl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kval{font-size:22px;font-weight:600;line-height:1.3;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kval small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.kn{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.45}
.kn .up{color:var(--ok)} .kn .dn{color:var(--crit)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.kpis.inset{box-shadow:none;margin-bottom:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));background:var(--surface-2)}
.kpis.inset .kpi{padding:9px 12px}
.kpis.inset .kval{font-size:17px}

/* ── 实体页头（单井） ── */
.ehead{display:flex;align-items:center;gap:10px 28px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);margin-bottom:16px}
.ehead .et{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ehead .et b{font-size:17px;font-weight:600;letter-spacing:.01em}
dl.facts{display:flex;flex-wrap:wrap;gap:4px 26px;margin:0}
dl.facts div{display:flex;flex-direction:column;min-width:0}
dl.facts dt{font-size:11.5px;color:var(--muted)}
dl.facts dd{margin:0;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 提示条 ── */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:12.5px;line-height:1.6;
  border:1px solid transparent}
.alert svg.ic{margin-top:2px}
.alert.warn{background:var(--warn-bg);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.warn svg.ic{color:var(--warn)}
.alert.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.alert.crit svg.ic{color:var(--crit)}
.alert.info{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent)}
.alert.info svg.ic{color:var(--brand)}
.alert b{font-weight:600}

/* ── 表格 ── */
.tw{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-size:12.5px}
.dt td{white-space:nowrap}
.dt td.wrap{white-space:normal;min-width:220px}
.dt th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:0 12px;height:34px;background:var(--surface-2);
  border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0}
.dt td{padding:0 12px;height:36px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
.dt td.wrap{padding-top:7px;padding-bottom:7px;height:auto;line-height:1.5}
.dt tbody tr:hover td{background:var(--surface-2)}
.dt tr:last-child td{border-bottom:0}
.dt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt tr.total td{font-weight:600;background:var(--surface-2)}
.dt tr.click{cursor:pointer}
.dt tr.grp td{background:var(--sunk);font-size:12px;color:var(--muted);height:30px;font-weight:500}
.dt td .sub2{color:var(--muted);font-size:11.5px}
.delta.up{color:var(--ok)} .delta.dn{color:var(--crit)} .delta.flat{color:var(--muted)}
.tscroll{max-height:420px;overflow:auto}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted)}

/* ── 键值列表 ── */
dl.kv{display:grid;grid-template-columns:max-content 1fr;margin:0;font-size:12.5px}
dl.kv dt{color:var(--muted);padding:7px 16px 7px 0;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
dl.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--rule-soft);font-variant-numeric:tabular-nums;min-width:0}
dl.kv dt:nth-last-of-type(1),dl.kv dd:last-child{border-bottom:0}

/* ── 子页签 ── */
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:0 0 16px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);height:38px;
  padding:0 14px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.subtabs .cnt{display:inline-block;margin-left:5px;padding:0 6px;border-radius:9px;background:var(--surface-2);border:1px solid var(--rule-soft);
  font-size:11px;color:var(--muted);font-weight:400;line-height:16px}

/* ── 图表 ── */
figure{margin:0}
figure svg{display:block;width:100%;height:auto;overflow:visible}
figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:2.5px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.band{height:9px;border-radius:2px;opacity:.5}
.legend i.dash{background:none;border-top:2px dashed var(--muted);height:0}
.legend i.box{height:9px;width:9px;border-radius:2px}
.legend i.dot{height:9px;width:9px;border-radius:50%}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--rule);
  border-radius:5px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow-pop);z-index:60;
  opacity:0;transition:opacity .08s;max-width:280px}
.tip b{font-weight:600}
.tip .row{display:flex;gap:10px;justify-content:space-between}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 20px}
.mini h4{margin:0 0 2px;font-size:12.5px;font-weight:600}
.mini .kn{margin-bottom:4px}

/* ── 检查清单 / 发现 ── */
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule-soft);font-size:12.5px}
.chk li:last-child{border-bottom:0}
.chk .it{font-weight:500}
.chk .ev{color:var(--ink-2);font-size:12px;margin-top:2px}
.chk .ct{color:var(--muted);font-size:11px;margin-top:2px}
.finding{display:grid;grid-template-columns:3px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px}
.finding:last-child{border-bottom:0}
.finding::before{content:"";border-radius:2px;background:var(--rule)}
.finding.warn::before{background:var(--warn)} .finding.critical::before{background:var(--crit)} .finding.info::before{background:var(--ok)}
.finding .act{color:var(--muted);font-size:12px;margin-top:2px}

/* ── 智能问答 ── */
.chat{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1280px){.chat{grid-template-columns:220px minmax(0,1fr)}.chat .trace-col{grid-column:1/-1}}
@media(max-width:900px){.chat{grid-template-columns:minmax(0,1fr)}.chat .qcol{order:2}.chat .trace-col{order:3}}
.qlist{padding:6px 0}
.qlist .qg{padding:10px 16px 4px;font-size:11.5px;color:var(--muted)}
.qlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 16px;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;font-family:inherit;line-height:1.45}
.qlist button:hover{background:var(--brand-soft);color:var(--brand-ink)}
.ameta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.answer{white-space:pre-wrap;font-size:13px;line-height:1.75;min-height:260px;max-height:560px;overflow:auto;color:var(--ink)}
.answer.placeholder{color:var(--muted)}
.composer{border-top:1px solid var(--rule-soft);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%}
.composer .cbar{display:flex;align-items:center;gap:10px}
.composer .hint{font-size:11.5px;color:var(--muted)}
.trace{padding:4px 16px}
.tstep{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.tstep:last-child{border-bottom:0}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:6px}
.tstep.idle .tdot{background:var(--rule)}
.tstep.failed .tdot,.tstep.denied .tdot{background:var(--crit)}
.tname{font-size:12.5px;font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.targs{font-size:11px;color:var(--muted);word-break:break-all;margin-top:2px}
.terr{font-size:12px;color:var(--crit)}

/* ── 状态 ── */
.busy{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:12.5px;padding:48px 16px;text-align:center}
.busy::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--rule);border-top-color:var(--brand);
  animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{color:var(--muted);font-size:12.5px;padding:28px 16px;text-align:center}
.err{color:var(--crit);font-size:12.5px}
.muted{color:var(--muted)}

/* ── 窄屏：侧栏变为顶部横向导航 ── */
@media(max-width:900px){
  .side{position:static;width:auto;flex-direction:column}
  .brandbox{min-height:0;padding:10px 16px}
  .navscroll{padding:0 8px 8px;overflow-x:auto;overflow-y:hidden}
  .nav{display:flex;gap:2px;width:max-content}
  .ngroup,.sidefoot{display:none}
  .nav a{margin:0;height:34px;white-space:nowrap}
  .shell{margin-left:0}
  .top{position:static}
  .topbar{padding:0 16px}
  .pagebar{padding:10px 16px}
  .ctx{margin-left:0}
  main{padding:14px 16px 28px}
  .kval{font-size:19px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>

<aside class="side">
  <div class="brandbox">
    <div class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C16 3 6 15 6 21a10 10 0 0 0 20 0C26 15 16 3 16 3z"/></svg></div>
    <div><b>储量评估系统</b><small>全生命周期 · SEC 预评估</small></div>
  </div>
  <div class="navscroll">
    <nav class="nav" id="nav" aria-label="主导航"></nav>
  </div>
  <div class="sidefoot">
    <div>模型版本 <span class="mono" id="mvBadge">—</span></div>
    <div>标签口径 <span class="mono" id="ldBadge">—</span></div>
  </div>
</aside>

<div class="shell">
  <header class="top">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <span class="tag warn" id="dsBadge" hidden></span>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="切换深浅色"></button>
    </div>

      <h1 id="ptitle">总览</h1>
      <div class="ctx" id="ctx"></div>
    </div>
  </header>

  <main id="main">
    <section class="view" id="tab-overview"></section>
    <section class="view" id="tab-well" hidden></section>

    <section class="view" id="tab-unit" hidden></section>
    <section class="view" id="tab-monitor" hidden></section>
    <section class="view" id="tab-chat" hidden></section>
    <section class="view" id="tab-eval" hidden></section>
  </main>
</div>

<div class="tip" id="tip"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   1. 基础工具
   ══════════════════════════════════════════════════════════════ */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c === null || c === undefined) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
};
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v))
  ? '—' : Number(v).toLocaleString('zh-CN', { maximumFractionDigits: d });
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

async function api(path, params) {
  const q = params ? '?' + new URLSearchParams(params) : '';
  const r = await fetch('/api/v1' + path + q);
  const j = await r.json().catch(() => ({ error: '响应不是合法 JSON' }));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* ══════════════════════════════════════════════════════════════
   2. 手写 SVG 图表
   规矩：单一坐标轴（绝不双轴）、细笔画、网格退到背景、
   文字用文本色不用系列色、每张图都有 hover 层。
   尺寸：按容器的实际像素宽度 1:1 绘制 —— 文字恒定 11~12px，
   不会在宽卡片里放大、在窄卡片里缩成蚂蚁字；容器宽度变化时自动重画。
   ══════════════════════════════════════════════════════════════ */
const NS = 'http://www.w3.org/2000/svg';
const s_ = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs))
    if (v !== null && v !== undefined) n.setAttribute(k, v);
  return n;
};
const svgText = (attrs, text) => { const t = s_('text', attrs); t.textContent = text; return t; };
const tip = $('#tip');
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.opacity = '1';
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = evt.clientY - h - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.opacity = '0'; };

const FS = { tick: 11, label: 12, note: 10.5 };
/* 数值紧凑写法：图上刻度用，精确值在提示框和表格视图里 */
const compactT = v => Math.abs(v) >= 1e4 ? fmt(v / 1e4, 1) + '万' : fmt(v, 0);
const fmtT = v => (v === null || v === undefined) ? '—'
  : Math.abs(v) >= 1e4 ? fmt(v / 1e4, 2) + ' 万 t' : fmt(v, 0) + ' t';

/* 挂载：等容器有了真实宽度再画，宽度变化时重画（图高固定，不会引发重画循环） */
const _ro = 'ResizeObserver' in window ? new ResizeObserver(entries => entries.forEach(e => {
  const host = e.target;
  if (!host.isConnected) { _ro.unobserve(host); return; }
  const w = Math.floor(e.contentRect.width);
  if (w > 0 && w !== host._w) { host._w = w; host.innerHTML = ''; hideTip(); host._draw(w); }
})) : null;
function mount(host, draw) {
  host.innerHTML = '';
  host._draw = draw; host._w = 0;
  if (_ro) _ro.observe(host);
  else requestAnimationFrame(() => draw(Math.floor(host.clientWidth) || 760));
}
const svgX = (svg, ev, W) => { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * (W / (r.width || W)); };

function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

/* 整数步长刚好越过数据范围时（如 ±4938 配 5000 步长）只剩一个刻度：退到更细的步长 */
function ticks(lo, hi, n) {
  const t = niceTicks(lo, hi, n);
  return t.length >= 3 ? t : niceTicks(lo, hi, n + 2);
}

function frame(w, h, pad) {
  const svg = s_('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: 'img' });
  return { svg, w, h, pad, iw: w - pad.l - pad.r, ih: h - pad.t - pad.b };
}
function axes(g, xd, yd, xLabel, yLabel, xFmt, yFmt) {
  const { svg, pad, iw, ih } = g;
  const X = v => pad.l + (v - xd[0]) / (xd[1] - xd[0] || 1) * iw;
  const Y = v => pad.t + ih - (v - yd[0]) / (yd[1] - yd[0] || 1) * ih;
  const grid = cssVar('--rule-soft'), muted = cssVar('--muted');
  ticks(yd[0], yd[1], Math.max(4, Math.floor(ih / 45))).forEach(t => {
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(t), y2: Y(t), stroke: grid, 'stroke-width': 1 }));
    svg.appendChild(svgText({ x: pad.l - 8, y: Y(t) + 4, 'text-anchor': 'end', fill: muted, 'font-size': FS.tick }, yFmt ? yFmt(t) : fmt(t, 2)));
  });
  ticks(xd[0], xd[1], Math.max(3, Math.floor(iw / 80))).forEach(t =>
    svg.appendChild(svgText({ x: X(t), y: pad.t + ih + 16, 'text-anchor': 'middle', fill: muted, 'font-size': FS.tick }, xFmt ? xFmt(t) : fmt(t, 0))));
  svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: pad.t + ih, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1 }));
  if (xLabel) svg.appendChild(svgText({ x: pad.l + iw / 2, y: g.h - 4, 'text-anchor': 'middle', fill: muted, 'font-size': FS.note }, xLabel));
  if (yLabel) svg.appendChild(svgText({ x: 12, y: pad.t + ih / 2, 'text-anchor': 'middle', fill: muted, 'font-size': FS.note, transform: `rotate(-90 12 ${pad.t + ih / 2})` }, yLabel));
  return { X, Y };
}

function yGrid(g, yd, Y, tickFmt) {
  const { svg, pad, iw, ih } = g;
  ticks(yd[0], yd[1], Math.max(4, Math.floor(ih / 45))).forEach(t => {
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(t), y2: Y(t), stroke: cssVar(t === 0 ? '--rule' : '--rule-soft'), 'stroke-width': 1 }));
    svg.appendChild(svgText({ x: pad.l - 8, y: Y(t) + 4, 'text-anchor': 'end', fill: cssVar('--muted'), 'font-size': FS.tick }, (tickFmt || compactT)(t)));
  });
}

/* 只圆"数据端"（4px），基线端保持方角 */
function barPath(x, y, w, h, end) {
  const r = Math.max(0, Math.min(4, w / 2, h / 2));
  if (end === 'top') return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  if (end === 'bottom') return `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`;
  if (end === 'right') return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
  if (end === 'left') return `M${x + w},${y}H${x + r}Q${x},${y} ${x},${y + r}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w}Z`;
  return `M${x},${y}H${x + w}V${y + h}H${x}Z`;
}

/* 折线 + 不确定性带。单一 y 轴：压力另起一张小图，绝不做双轴。 */
function lineChart(host, cfg) {
  mount(host, W => {
    const g = frame(W, W < 520 ? 240 : 300, { l: 50, r: 16, t: 16, b: 40 });
    const all = [];
    cfg.series.forEach(s => s.points.forEach(p => all.push(p.y)));
    (cfg.band || []).forEach(p => { all.push(p.lo); all.push(p.hi); });
    if (cfg.hline) all.push(cfg.hline.y);
    const ymax = Math.max(...all.filter(Number.isFinite)) * 1.12 || 1;
    const xs = cfg.series.flatMap(s => s.points.map(p => p.x)).concat((cfg.band || []).map(p => p.x));
    const xd = [Math.min(...xs), Math.max(...xs)], yd = [0, ymax];
    const { X, Y } = axes(g, xd, yd, cfg.xLabel, cfg.yLabel);
    const { svg, pad, iw, ih } = g;
    if (cfg.band && cfg.band.length) {
      const up = cfg.band.map(p => `${X(p.x)},${Y(p.hi)}`).join(' ');
      const dn = cfg.band.slice().reverse().map(p => `${X(p.x)},${Y(p.lo)}`).join(' ');
      svg.appendChild(s_('polygon', { points: up + ' ' + dn, fill: cfg.bandColor || cssVar('--c1'), 'fill-opacity': .16 }));
    }
    if (cfg.hline) {
      const y = Y(cfg.hline.y);
      svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: y, y2: y, stroke: cssVar('--muted'), 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
      svg.appendChild(svgText({ x: pad.l + iw, y: y - 6, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.note }, cfg.hline.label));
    }
    if (cfg.vline) {
      const x = X(cfg.vline.x);
      svg.appendChild(s_('line', { x1: x, x2: x, y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: x + 5, y: pad.t + 11, fill: cssVar('--muted'), 'font-size': FS.note }, cfg.vline.label));
    }
    cfg.series.forEach(s => {
      const pts = s.points.filter(p => Number.isFinite(p.y));
      if (!pts.length) return;
      svg.appendChild(s_('polyline', {
        points: pts.map(p => `${X(p.x)},${Y(p.y)}`).join(' '), fill: 'none',
        stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        'stroke-dasharray': s.dashed ? '6 4' : null
      }));
      if (s.dots) pts.forEach(p => svg.appendChild(s_('circle', {
        cx: X(p.x), cy: Y(p.y), r: 4, fill: s.color, stroke: cssVar('--surface'), 'stroke-width': 2
      })));
    });
    (cfg.markers || []).forEach(m => {
      svg.appendChild(s_('circle', { cx: X(m.x), cy: Y(m.y), r: 5, fill: 'none', stroke: m.color, 'stroke-width': 2 }));
      svg.appendChild(svgText({ x: X(m.x) + 9, y: Y(m.y) - 8, fill: cssVar('--ink-2'), 'font-size': FS.note }, m.label));
    });
    const cross = s_('line', { y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1, opacity: 0 });
    svg.appendChild(cross);
    const hit = s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
    svg.appendChild(hit);
    hit.addEventListener('mousemove', ev => {
      const xv = xd[0] + Math.max(0, svgX(svg, ev, W) - pad.l) / iw * (xd[1] - xd[0]);
      cross.setAttribute('x1', X(xv)); cross.setAttribute('x2', X(xv)); cross.setAttribute('opacity', 1);
      let html = `<b>${cfg.xLabel || 'x'} ${fmt(xv, 0)}</b>`;
      cfg.series.forEach(s => {
        const p = s.points.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a, s.points[0]);
        if (p && Number.isFinite(p.y))
          html += `<div class="row"><span><i class="sw" style="background:${s.color}"></i>${s.name}</span><span class="mono">${fmt(p.y)}</span></div>`;
      });
      if (cfg.band && cfg.band.length) {
        const p = cfg.band.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a, cfg.band[0]);
        html += `<div class="row"><span>P10–P90</span><span class="mono">${fmt(p.lo)} ~ ${fmt(p.hi)}</span></div>`;
      }
      showTip(ev, html);
    });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
    host.appendChild(svg);
  });
}

/* 发散条形图：零点中性轴；标签列与数值列各自留宽，长条也不会压到文字 */
function divergingBars(host, rows, unit, opts = {}) {
  mount(host, W => {
    const rowH = 28, labelW = W < 480 ? 104 : 176, valW = 62, h = rows.length * rowH + 30;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: 'img' });
    const max = Math.max(...rows.map(r => Math.abs(r.value))) || 1;
    const half = Math.max((W - labelW - valW * 2) / 2, 24), zero = labelW + valW + half;
    svg.appendChild(s_('line', { x1: zero, x2: zero, y1: 2, y2: h - 24, stroke: cssVar('--rule'), 'stroke-width': 1 }));
    rows.forEach((r, i) => {
      const y = i * rowH + 2, cy = y + rowH / 2, bw = Math.max(Math.abs(r.value) / max * half, 1.5);
      const pos = r.value >= 0, color = opts.color || (pos ? cssVar('--c1') : cssVar('--c2'));
      svg.appendChild(s_('path', { d: barPath(pos ? zero : zero - bw, cy - 6, bw, 12, pos ? 'right' : 'left'), fill: color }));
      svg.appendChild(svgText({ x: labelW - 10, y: cy + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, r.label));
      svg.appendChild(svgText({ x: pos ? zero + bw + 6 : zero - bw - 6, y: cy + 4, 'text-anchor': pos ? 'start' : 'end', fill: cssVar('--muted'), 'font-size': FS.note },
        (r.value > 0 ? '+' : '') + fmt(r.value, 2) + (opts.suffix || '')));
      const hit = s_('rect', { x: 0, y, width: W, height: rowH, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, opts.tip ? opts.tip(r) :
        `<b>${r.label}</b><div class="row"><span>该井取值</span><span class="mono">${fmt(r.raw)}</span></div>` +
        `<div class="row"><span>对预测的推动</span><span class="mono">${(r.value > 0 ? '+' : '') + fmt(r.value)} ${unit || ''}</span></div>`));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
    });
    svg.appendChild(svgText({ x: zero, y: h - 8, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.note },
      opts.axisLabel || `← 拉低　对预测的推动（${unit || ''}）　抬高 →`));
    host.appendChild(svg);
  });
}

/* 直方图：单一色相，P10/P50/P90 用参考线标注 */
function histogram(host, values, refs, xLabel) {
  mount(host, W => {
    const g = frame(W, 240, { l: 50, r: 16, t: 22, b: 40 });
    const lo = Math.min(...values), hi = Math.max(...values), nb = W < 520 ? 16 : 26;
    const step = (hi - lo) / nb || 1;
    const bins = new Array(nb).fill(0);
    values.forEach(v => bins[Math.min(nb - 1, Math.floor((v - lo) / step))]++);
    const ymax = Math.max(...bins) * 1.12 || 1;
    const { X, Y } = axes(g, [lo, hi], [0, ymax], xLabel, '样本数', compactT, t => fmt(t, 0));
    const { svg } = g;
    bins.forEach((c, i) => {
      const x0 = X(lo + i * step), x1 = X(lo + (i + 1) * step);
      const r = s_('rect', { x: x0 + 1, y: Y(c), width: Math.max(x1 - x0 - 2, 1), height: Math.max(g.pad.t + g.ih - Y(c), 0), fill: cssVar('--c1'), 'fill-opacity': .8, rx: 2 });
      svg.appendChild(r);
      r.addEventListener('mousemove', ev => showTip(ev,
        `<b>${fmt(lo + i * step, 0)} ~ ${fmt(lo + (i + 1) * step, 0)}</b><div class="row"><span>样本数</span><span class="mono">${c}</span></div>`));
      r.addEventListener('mouseleave', hideTip);
    });
    (refs || []).forEach(r => {
      if (!Number.isFinite(r.x)) return;
      svg.appendChild(s_('line', { x1: X(r.x), x2: X(r.x), y1: g.pad.t, y2: g.pad.t + g.ih, stroke: cssVar('--c2'), 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
      svg.appendChild(svgText({ x: X(r.x), y: g.pad.t - 6, 'text-anchor': 'middle', fill: cssVar('--ink-2'), 'font-size': FS.note }, r.label));
    });
    host.appendChild(svg);
  });
}

/* 井位散点：颜色=区块（分类），大小=累产（量级） */
function scatter(host, pts, colorKey, colors, onPick) {
  mount(host, W => {
    const g = frame(W, W < 520 ? 300 : 400, { l: 58, r: 16, t: 14, b: 42 });
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const pad = v => (Math.max(...v) - Math.min(...v)) * .06 || 1;
    const { X, Y } = axes(g, [Math.min(...xs) - pad(xs), Math.max(...xs) + pad(xs)],
      [Math.min(...ys) - pad(ys), Math.max(...ys) + pad(ys)],
      '相对东西向 (m，坐标已偏移)', '相对南北向 (m)', t => fmt(t / 1000, 1) + 'k', t => fmt(t, 0));
    const cmax = Math.max(...pts.map(p => p.size || 0)) || 1, rmax = W < 520 ? 5 : 7;
    pts.forEach(p => {
      const r = 3 + Math.sqrt((p.size || 0) / cmax) * rmax;
      const n = s_('circle', {
        cx: X(p.x), cy: Y(p.y), r, fill: colors[p[colorKey]] || cssVar('--muted'), 'fill-opacity': p.is_new ? .95 : .5,
        stroke: p.is_new ? cssVar('--ink') : cssVar('--surface'), 'stroke-width': p.is_new ? 1.4 : 1, style: 'cursor:pointer'
      });
      n.addEventListener('mousemove', ev => showTip(ev,
        `<b>${p.well_code}</b>　<span class="mono">${p.block} ${p.layer}</span>` +
        `<div class="row"><span>投产</span><span class="mono">${p.first_prod_date}</span></div>` +
        `<div class="row"><span>累产油</span><span class="mono">${fmt(p.cum_oil_t, 0)} t</span></div>` +
        `<div class="row"><span>生产历史</span><span class="mono">${p.history_days} d</span></div>` +
        (p.is_new ? '<div style="margin-top:4px;color:var(--c2)">新井 · 尚未走完生命周期</div>' : '')));
      n.addEventListener('mouseleave', hideTip);
      n.addEventListener('click', () => onPick && onPick(p.well_code));
      g.svg.appendChild(n);
    });
    host.appendChild(g.svg);
  });
}

/* 堆叠柱：正值向上堆、负值向下堆；段与段之间留 2px 表面色间隙 */
function stackedColumns(host, cfg) {
  mount(host, W => {
    const g = frame(W, W < 520 ? 240 : 290, { l: 54, r: 12, t: 12, b: 40 });
    const { svg, pad, iw, ih } = g, n = cfg.categories.length;
    const sums = sign => cfg.categories.map((_, i) => cfg.series.reduce((a, s) =>
      a + (sign > 0 ? Math.max(s.values[i] || 0, 0) : Math.min(s.values[i] || 0, 0)), 0));
    const ymax = (Math.max(...sums(1), 0) * 1.08) || 1, ymin = Math.min(...sums(-1), 0) * 1.08;
    const Y = v => pad.t + ih - (v - ymin) / (ymax - ymin) * ih;
    yGrid(g, [ymin, ymax], Y);
    const band = iw / n, bw = Math.max(Math.min(24, band - 2), 1), every = Math.ceil(n / Math.max(2, Math.floor(iw / 72)));
    cfg.categories.forEach((c, i) => {
      const x = pad.l + i * band + (band - bw) / 2;
      let up = 0, dn = 0;
      const segs = [];
      cfg.series.forEach(s => {
        const v = s.values[i] || 0;
        if (!v) return;
        const a = v > 0 ? up : dn, b = a + v;
        if (v > 0) up = b; else dn = b;
        segs.push({ s, a, b, v });
      });
      const lastPos = segs.filter(z => z.v > 0).at(-1), lastNeg = segs.filter(z => z.v < 0).at(-1);
      segs.forEach(z => {
        const top = Y(Math.max(z.a, z.b)), h = Math.abs(Y(z.a) - Y(z.b)), gap = h > 3 ? 1 : 0;
        svg.appendChild(s_('path', { d: barPath(x, top + gap, bw, Math.max(h - 2 * gap, .5), z === lastPos ? 'top' : z === lastNeg ? 'bottom' : null), fill: z.s.color }));
      });
      const hit = s_('rect', { x: pad.l + i * band, y: pad.t, width: band, height: ih, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, `<b>${c}</b>` + cfg.series.map(s =>
        `<div class="row"><span><i class="sw" style="background:${s.color}"></i>${s.name}</span><span class="mono">${fmt(s.values[i], 0)} ${cfg.unit || ''}</span></div>`).join('') +
        `<div class="row"><span>合计</span><span class="mono">${fmt(cfg.series.reduce((a, s) => a + (s.values[i] || 0), 0), 0)} ${cfg.unit || ''}</span></div>`));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
      if (i % every === 0)
        svg.appendChild(svgText({ x: pad.l + i * band + band / 2, y: pad.t + ih + 16, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, c));
    });
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0), stroke: cssVar('--rule'), 'stroke-width': 1 }));
    if (cfg.yLabel) svg.appendChild(svgText({ x: 12, y: pad.t + ih / 2, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.note, transform: `rotate(-90 12 ${pad.t + ih / 2})` }, cfg.yLabel));
    host.appendChild(svg);
  });
}

/* 横向堆叠条：类别名长、行数多时比竖柱好读；行尾标合计，段值在提示框 */
function hStackedBars(host, cfg) {
  mount(host, W => {
    const rowH = 30, bh = 14, labelW = Math.min(cfg.labelW || 150, Math.round(W * .34)), padR = 64;
    const H = cfg.rows.length * rowH + 4;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img' });
    const totals = cfg.rows.map(r => cfg.series.reduce((a, s) => a + Math.max(r.values[s.key] || 0, 0), 0));
    const X = v => v / (Math.max(...totals, 0) || 1) * (W - labelW - padR);
    cfg.rows.forEach((r, i) => {
      const y = i * rowH + (rowH - bh) / 2;
      svg.appendChild(svgText({ x: labelW - 10, y: y + bh / 2 + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, r.label));
      const segs = cfg.series.map(s => ({ s, v: Math.max(r.values[s.key] || 0, 0) })).filter(z => z.v > 0);
      let acc = 0;
      segs.forEach((z, k) => {
        const x = labelW + X(acc), ww = X(z.v), last = k === segs.length - 1;
        acc += z.v;
        svg.appendChild(s_('path', { d: barPath(x, y, Math.max(ww - (last || ww <= 3 ? 0 : 2), .5), bh, last ? 'right' : null), fill: z.s.color }));
        const hit = s_('rect', { x, y: i * rowH, width: Math.max(ww, 4), height: rowH, fill: 'transparent' });
        hit.addEventListener('mousemove', ev => showTip(ev, `<b>${r.tip || r.label}</b>` +
          `<div class="row"><span><i class="sw" style="background:${z.s.color}"></i>${z.s.name}</span><span class="mono">${fmt(z.v, 0)} ${cfg.unit || ''}</span></div>` +
          `<div class="row"><span>占该行</span><span class="mono">${fmt(z.v / totals[i] * 100, 1)}%</span></div>`));
        hit.addEventListener('mouseleave', hideTip);
        svg.appendChild(hit);
      });
      svg.appendChild(svgText({ x: labelW + X(acc) + 7, y: y + bh / 2 + 4, fill: cssVar('--muted'), 'font-size': FS.note }, compactT(totals[i])));
    });
    host.appendChild(svg);
  });
}

/* 瀑布图：期初/期末从零起，行项悬浮在累计值上；数值只标期初、期末和影响最大的两项 */
function waterfall(host, rows) {
  mount(host, W => {
    const g = frame(W, 290, { l: 54, r: 10, t: 26, b: 40 });
    const { svg, pad, iw, ih } = g;
    let run = 0;
    const steps = rows.map(r => {
      const s = r.total ? { r, a: 0, b: r.value } : { r, a: run, b: run + r.value };
      run = s.b; return s;
    });
    const vals = steps.flatMap(s => [s.a, s.b]);
    const ymax = (Math.max(...vals, 0) * 1.1) || 1, ymin = Math.min(...vals, 0) * 1.1;
    const Y = v => pad.t + ih - (v - ymin) / (ymax - ymin) * ih;
    yGrid(g, [ymin, ymax], Y);
    const band = iw / rows.length, bw = Math.min(24, band * .55);
    const big = steps.filter(s => !s.r.total).sort((p, q) => Math.abs(q.r.value) - Math.abs(p.r.value)).slice(0, 2);
    steps.forEach((s, i) => {
      const x = pad.l + i * band + (band - bw) / 2, up = s.b >= s.a;
      const top = Y(Math.max(s.a, s.b)), h = Math.max(Math.abs(Y(s.a) - Y(s.b)), 1);
      svg.appendChild(s_('path', { d: barPath(x, top, bw, h, up ? 'top' : 'bottom'), fill: s.r.color }));
      if (i < steps.length - 1)
        svg.appendChild(s_('line', { x1: x + bw, x2: x + band + (band - bw) / 2, y1: Y(s.b), y2: Y(s.b), stroke: cssVar('--rule'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: x + bw / 2, y: pad.t + ih + 16, 'text-anchor': 'middle', fill: cssVar('--ink-2'), 'font-size': FS.note },
        band < 62 ? (s.r.tiny || s.r.label) : s.r.label));
      if (s.r.total || big.includes(s))
        svg.appendChild(svgText({ x: x + bw / 2, y: up ? top - 6 : top + h + 13, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.note },
          (s.r.total || s.r.value < 0 ? '' : '+') + compactT(s.r.value)));
      const hit = s_('rect', { x: pad.l + i * band, y: pad.t, width: band, height: ih, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, `<b>${s.r.item}</b>` +
        `<div class="row"><span>${s.r.total ? '储量' : '变动'}</span><span class="mono">${s.r.total || s.r.value < 0 ? '' : '+'}${fmt(s.r.value, 1)} t</span></div>` +
        (s.r.total ? '' : `<div class="row"><span>累计</span><span class="mono">${fmt(s.b, 1)} t</span></div>`)));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
    });
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0), stroke: cssVar('--rule'), 'stroke-width': 1 }));
    host.appendChild(svg);
  });
}

/* 敏感性小图：一个参数一张图（横轴单位各不相同，绝不合进一张双轴图） */
function deltaLine(host, cfg) {
  mount(host, W => {
    const g = frame(W, 210, { l: 52, r: 14, t: 14, b: 40 });
    const lo = Math.min(...cfg.y, 0), hi = Math.max(...cfg.y, 0), py = (hi - lo) * .08 || 1;
    const xd = [Math.min(...cfg.x), Math.max(...cfg.x)];
    const xDigits = (xd[1] - xd[0]) < 10 ? 2 : 0;
    const { X, Y } = axes(g, xd, [lo - py, hi + py], cfg.xLabel, null, t => fmt(t, xDigits), compactT);
    const { svg, pad, iw, ih } = g;
    svg.appendChild(s_('line', { x1: pad.l, x2: pad.l + iw, y1: Y(0), y2: Y(0), stroke: cssVar('--rule'), 'stroke-width': 1 }));
    if (Number.isFinite(cfg.baseX)) {
      svg.appendChild(s_('line', { x1: X(cfg.baseX), x2: X(cfg.baseX), y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: X(cfg.baseX) + 5, y: pad.t + 11, fill: cssVar('--muted'), 'font-size': FS.note }, '基准'));
    }
    const pts = cfg.x.map((x, i) => ({ x, y: cfg.y[i] }));
    svg.appendChild(s_('polyline', { points: pts.map(p => `${X(p.x)},${Y(p.y)}`).join(' '), fill: 'none', stroke: cfg.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    [pts[0], pts.at(-1)].forEach(p => svg.appendChild(s_('circle', { cx: X(p.x), cy: Y(p.y), r: 4, fill: cfg.color, stroke: cssVar('--surface'), 'stroke-width': 2 })));
    const cross = s_('line', { y1: pad.t, y2: pad.t + ih, stroke: cssVar('--rule'), 'stroke-width': 1, opacity: 0 });
    svg.appendChild(cross);
    const hit = s_('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      const xv = xd[0] + (svgX(svg, ev, W) - pad.l) / iw * (xd[1] - xd[0]);
      const p = pts.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a, pts[0]);
      cross.setAttribute('x1', X(p.x)); cross.setAttribute('x2', X(p.x)); cross.setAttribute('opacity', 1);
      showTip(ev, `<b>${cfg.xLabel} ${fmt(p.x, xDigits)}</b><div class="row"><span>PDP 变化</span><span class="mono">${p.y >= 0 ? '+' : ''}${fmt(p.y, 0)} t</span></div>`);
    });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
    svg.appendChild(hit);
    host.appendChild(svg);
  });
}

/* 哑铃图：同一指标两期得分，同一色相的浅/深两阶 —— 比雷达图更容易读出差值 */
function dumbbell(host, rows, cfg) {
  mount(host, W => {
    const rowH = 28, labelW = W < 480 ? 104 : 156, padR = 24, top = 24;
    const h = rows.length * rowH + top + 4;
    const svg = s_('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: 'img' });
    const X = v => labelW + v / 100 * (W - labelW - padR);
    [0, 25, 50, 75, 100].forEach(t => {
      svg.appendChild(s_('line', { x1: X(t), x2: X(t), y1: top - 4, y2: h, stroke: cssVar('--rule-soft'), 'stroke-width': 1 }));
      svg.appendChild(svgText({ x: X(t), y: 13, 'text-anchor': 'middle', fill: cssVar('--muted'), 'font-size': FS.tick }, t));
    });
    rows.forEach((r, i) => {
      const y = top + i * rowH + rowH / 2;
      svg.appendChild(svgText({ x: labelW - 10, y: y + 4, 'text-anchor': 'end', fill: cssVar('--ink-2'), 'font-size': FS.label }, r.label));
      if (r.a != null && r.b != null)
        svg.appendChild(s_('line', { x1: X(r.a), x2: X(r.b), y1: y, y2: y, stroke: cssVar('--rule'), 'stroke-width': 2 }));
      [[r.a, cfg.aColor], [r.b, cfg.bColor]].forEach(([v, c]) => {
        if (v != null) svg.appendChild(s_('circle', { cx: X(v), cy: y, r: 5, fill: c, stroke: cssVar('--surface'), 'stroke-width': 2 }));
      });
      const hit = s_('rect', { x: 0, y: y - rowH / 2, width: W, height: rowH, fill: 'transparent' });
      hit.addEventListener('mousemove', ev => showTip(ev, r.tip));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(hit);
    });
    host.appendChild(svg);
  });
}

/* 面板：标题栏（标题 · 摘要 · 操作）+ 可折叠的口径说明 + 主体；有 table 时右上角出现"图表/表格"切换 */
function panel(title, opts = {}, body) {
  const pa = el('div', { class: 'pa' }, opts.actions || []);
  const p = el('section', { class: 'panel' + (opts.cls ? ' ' + opts.cls : '') });
  p.appendChild(el('div', { class: 'ph' }, [el('h3', { text: title }),
    opts.meta ? el('div', { class: 'pm' }, opts.meta) : null, pa]));
  const notes = [].concat(opts.note || []).filter(Boolean);
  if (notes.length) {
    const note = el('div', { class: 'pnote', hidden: true }, notes.map(t => el('p', { text: t })));
    const b = el('button', { class: 'ibtn', type: 'button', 'aria-expanded': 'false', title: '口径与说明' }, [icon('info'), '口径']);
    b.addEventListener('click', () => { note.hidden = !note.hidden; b.setAttribute('aria-expanded', String(!note.hidden)); });
    pa.appendChild(b); p.appendChild(note);
  }
  const bodyEl = el('div', { class: 'pb' + (opts.flush ? ' flush' : ''), style: opts.bodyStyle || null }, [].concat(body).filter(Boolean));
  p.appendChild(bodyEl);
  if (opts.table) {
    const tb = el('div', { class: 'pb flush', hidden: true }, opts.table);
    const bC = el('button', { type: 'button', 'aria-pressed': 'true', text: '图表' });
    const bT = el('button', { type: 'button', 'aria-pressed': 'false', text: '表格' });
    const set = showTable => {
      tb.hidden = !showTable; bodyEl.hidden = showTable; hideTip();
      bC.setAttribute('aria-pressed', String(!showTable)); bT.setAttribute('aria-pressed', String(showTable));
    };
    bC.addEventListener('click', () => set(false)); bT.addEventListener('click', () => set(true));
    pa.insertBefore(el('div', { class: 'seg', role: 'group', 'aria-label': '视图切换' }, [bC, bT]), pa.firstChild);
    p.appendChild(tb);
  }
  if (opts.foot) p.appendChild(el('div', { class: 'pfoot' }, opts.foot));
  return p;
}

/* 指标条：一行等宽格子，数值是主角；标识色只放在标签前的色块上 */
const kpiStrip = items => el('div', { class: 'kpis' }, items.filter(Boolean).map(i => el('div', { class: 'kpi' }, [
  el('div', { class: 'kl', title: i.label }, [i.sw ? el('i', { class: 'sw', style: `background:${i.sw}` }) : null, i.label]),
  el('div', { class: 'kval' }, [String(i.value), i.unit ? el('small', { text: i.unit }) : null]),
  i.note !== undefined && i.note !== null ? el('div', { class: 'kn' }, i.note) : null])));

const kv = pairs => el('dl', { class: 'kv' }, pairs.filter(Boolean).flatMap(([k, v]) =>
  [el('dt', { text: k }), el('dd', {}, (v !== null && typeof v === 'object') ? v : String(v ?? '—'))]));

function table(cols, rows, opts = {}) {
  const t = el('table', { class: 'dt' }, [
    el('thead', {}, el('tr', {}, cols.map(c => el('th', { class: c.num ? 'num' : null, text: c.h })))),
    el('tbody', {}, rows.map(r => {
      if (r._group) return el('tr', { class: 'grp' }, el('td', { colspan: cols.length, text: r._group }));
      const tr = el('tr', { class: [r._cls, opts.onRow ? 'click' : null].filter(Boolean).join(' ') || null }, cols.map(c => {
        const cls = [c.num ? 'num' : null, c.cls].filter(Boolean).join(' ') || null;
        if (c.render) return el('td', { class: cls }, c.render(r));
        const v = r[c.k];
        return el('td', { class: cls, text: (v === null || v === undefined || Number.isNaN(v)) ? '—' : (c.num ? fmt(v, c.d ?? 2) : String(v)) });
      }));
      if (opts.onRow) {
        tr.tabIndex = 0;
        tr.addEventListener('click', () => opts.onRow(r));
        tr.addEventListener('keydown', e => { if (e.key === 'Enter') opts.onRow(r); });
      }
      return tr;
    }))]);
  return el('div', { class: 'tw' + (opts.scroll ? ' tscroll' : '') }, t);
}

const legend = items => el('div', { class: 'legend' }, items.map(i =>
  el('span', {}, [el('i', { class: i.kind || '', style: i.color ? `background:${i.color}` : '' }), i.name])));

/* 变化量：箭头 + 数字，不单靠颜色 */
const delta = (v, d = 1, suffix = '') => (v === null || v === undefined || Number.isNaN(v)) ? el('span', { class: 'delta flat', text: '—' })
  : el('span', { class: 'delta ' + (v > 0 ? 'up' : v < 0 ? 'dn' : 'flat'), text: (v > 0 ? '▲ ' : v < 0 ? '▼ ' : '— ') + fmt(Math.abs(v), d) + suffix });

const entityHead = (title, tags, facts) => el('div', { class: 'ehead' }, [
  el('div', { class: 'et' }, [el('b', { text: title }), ...tags.filter(Boolean)]),
  el('dl', { class: 'facts' }, facts.filter(Boolean).map(([k, v]) => el('div', {}, [el('dt', { text: k }), el('dd', { text: v })])))]);

function wellHead(info) {
  const w = S.wells.find(x => x.well_code === info.well_code) || {};
  const horiz = info.lateral_length && info.stage_count;
  return entityHead(info.well_code, [
    tag(`${info.block} / ${info.layer}`), tag(info.well_type),
    tag(WELL_STATUS_CN[info.status] || info.status, info.status === 'producing' ? 'ok' : null),
    w.is_new ? tag('新井', 'brand') : tag('老井')
  ], [
    ['投产日期', info.first_prod_date], ['生产天数', fmt(info.history_days, 0) + ' d'],
    ['累产油', fmt(info.cum_oil_t, 0) + ' t'], [`近 ${info.rate_window_days} 天日产`, fmt(info.current_rate_t_per_d) + ' t/d'],
    ['含水', fmt(info.water_cut_pct, 1) + '%'], ['井口压力', fmt(info.latest_whp_mpa) + ' MPa'],
    horiz ? ['水平段 / 段数', `${fmt(info.lateral_length, 0)} m / ${info.stage_count} 段`] : null]);
}

function subTabs(items, active, onChange) {
  const bar = el('div', { class: 'subtabs', role: 'tablist' });
  items.forEach(i => {
    const b = el('button', { type: 'button', role: 'tab', 'aria-selected': String(i.k === active), 'data-k': i.k },
      [i.label, i.cnt !== undefined ? el('span', { class: 'cnt', text: String(i.cnt) }) : null]);
    b.addEventListener('click', () => {
      bar.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
      hideTip(); onChange(i.k);
    });
    bar.appendChild(b);
  });
  return bar;
}

/* 页头右侧的全局筛选：只写入当前页，异步返回时页面已切走就丢弃 */
function setCtx(page, nodes) { if (S.page === page) $('#ctx').replaceChildren(...nodes.filter(Boolean)); }
let _fid = 0;
const ctxField = (label, ctl) => {
  ctl.id = 'f' + (++_fid);
  return el('span', { class: 'cf' }, [el('label', { for: ctl.id, text: label }), ctl]);
};

/* ══════════════════════════════════════════════════════════════
   4. 各页面
   ══════════════════════════════════════════════════════════════ */
const S = { wells: [], overview: null, current: null, page: null, ovBlock: 'all', wl: { q: '', page: 0 },
  unitSub: 'comp', nwFilter: 'all', tok: { well: 0, reserves: 0, unit: 0, monitor: 0 } };
const BLOCK_COLORS = () => ({ 'GL-A': cssVar('--c1'), 'GL-B': cssVar('--c2'), 'SB-C': cssVar('--c3') });
const go = name => { location.hash = '#/' + name; };
function pickWell(code) { S.current = code; }

async function ensureBase() {
  if (!S.base) {
    S.base = Promise.all([api('/overview'), api('/wells', { limit: 1000 })]).then(([ov, wl]) => {
      S.overview = ov; S.wells = wl.wells;
      if (!S.current) {
        const old = S.wells.find(w => !w.is_new && w.status === 'producing' && w.eur != null);
        S.current = (old || S.wells[0] || {}).well_code;
      }
      $('#mvBadge').textContent = ov.model.model_version;
      $('#ldBadge').textContent = ov.label_def_version;
      if (ov.data_source !== 'REAL') {
        const b = $('#dsBadge'); b.hidden = false;
        b.replaceChildren(el('i', { class: 'dotc' }), `模拟数据 · ${ov.data_source}`);
      }
    }).catch(e => { S.base = null; throw e; });
  }
  return S.base;
}

/* ── 总览 ── */
async function renderOverview() {
  const host = $('#tab-overview');
  host.replaceChildren(loading());
  await ensureBase();
  if (S.page !== 'overview') return;
  const ov = S.overview;
  const blockSel = el('select', { onchange: e => { S.ovBlock = e.target.value; S.wl.page = 0; renderOverview(); } },
    [el('option', { value: 'all', text: '全部区块' }), ...ov.data.blocks.map(b => el('option', { value: b, text: b }))]);
  blockSel.value = S.ovBlock;
  setCtx('overview', [ctxField('区块', blockSel)]);

  const wells = S.wells.filter(w => S.ovBlock === 'all' || w.block === S.ovBlock);
  const nNew = wells.filter(w => w.is_new).length;
  const cum = wells.reduce((a, w) => a + (w.cum_oil_t || 0), 0);
  const strip = kpiStrip([
    { label: S.ovBlock === 'all' ? '井数' : `井数 · ${S.ovBlock}`, value: fmt(wells.length, 0), unit: '口', note: `老井 ${wells.length - nNew} · 新井 ${nNew}` },
    { label: '累产油', ...tU(cum), note: `${S.ovBlock === 'all' ? ov.data.blocks.length + ' 个区块' : S.ovBlock}合计` },
    { label: '可用标签', value: fmt(ov.data.n_labeled, 0), unit: '条', note: `标签口径 ${ov.label_def_version}` },
    { label: '质量门禁通过率', value: fmt(ov.quality.pass_rate * 100, 1), unit: '%', note: `${ov.quality.n_passed} / ${ov.quality.n_wells} 口井通过` },
    { label: '训练 / 校准 / 测试', value: `${ov.model.n_train} / ${ov.model.n_calib} / ${ov.model.n_test}`, note: ov.model.split_method === 'time' ? '按投产年份时间外推切分' : ov.model.split_method }]);

  const colors = BLOCK_COLORS();
  const plot = el('div');
  scatter(plot, wells, 'block', colors, code => { pickWell(code); go('well'); });
  const mapPanel = panel('井位分布', {
    meta: '颜色 = 区块 · 大小 = 累产 · 深色描边 = 新井 · 点击井位进入单井分析',
    note: ['坐标已统一偏移，不可反推真实井位。', '新井指投产不足 420 天、尚未走完主要生产周期的井。']
  }, [legend(Object.entries(colors).map(([b, c]) => ({ name: b, color: c, kind: 'dot' }))), el('figure', {}, plot)]);

  const rep = ov.report || {};
  const bt = Object.entries(rep).map(([k, r]) => ({
    target: TARGET_CN[k] || k, mae: r.model.mae, base: r.baseline.mae,
    gain: r.mae_gain_vs_baseline_pct, cov: r.model.coverage, cov0: r.model_uncalibrated.coverage }));
  const btPanel = panel('预测模型回测', {
    meta: `测试集 ${ov.model.n_test} 口老井`, flush: true,
    note: ['回测集为已走完主要生产周期的老井；基线 = 邻井类比 + Arps 外推。',
      '"校准前"一列是保形校准的价值：名义 80% 的区间，校准前实际只覆盖四到五成。']
  }, table([{ h: '目标', k: 'target' }, { h: '模型 MAE', k: 'mae', num: true }, { h: '基线 MAE', k: 'base', num: true },
    { h: '较基线', k: 'gain', num: true, render: r => tag(`${r.gain > 0 ? '↓' : ''}${fmt(Math.abs(r.gain ?? 0), 1)}%`, (r.gain ?? 0) > 0 ? 'ok' : 'crit') },
    { h: '覆盖率', k: 'cov', num: true }, { h: '校准前', k: 'cov0', num: true }], bt));

  const qRows = Object.entries(ov.quality.top_reasons || {}).map(([k, v]) => ({ reason: k, n: v }));
  const qPanel = panel('数据质量门禁', {
    meta: `${ov.quality.n_passed} / ${ov.quality.n_wells} 通过 · 未通过的进隔离区，不进训练集`, flush: true
  }, qRows.length ? table([{ h: '未通过原因（前 5）', k: 'reason' }, { h: '井数', k: 'n', num: true, d: 0 }], qRows) : emptyState('全部通过'));

  host.replaceChildren(strip,
    el('div', { class: 'row c21' }, [mapPanel, el('div', { class: 'stack' }, [btPanel, qPanel])]),
    el('div', { class: 'row' }, wellListPanel(wells)));
}

function wellListPanel(wells) {
  const PAGE = 10;
  const tbHost = el('div'), pager = el('div', { class: 'pager' });
  const search = el('input', { type: 'text', placeholder: '搜索井号', 'aria-label': '搜索井号', value: S.wl.q, style: 'height:26px;width:160px;font-size:12px' });
  search.addEventListener('input', () => { S.wl.q = search.value; S.wl.page = 0; draw(); });
  const cols = [
    { h: '井号', k: 'well_code', render: r => el('a', { href: '#/well', text: r.well_code, onclick: e => { e.stopPropagation(); pickWell(r.well_code); } }) },
    { h: '区块', k: 'block' }, { h: '层系', k: 'layer' }, { h: '井型', k: 'well_type' },
    { h: '状态', k: 'status', render: r => WELL_STATUS_CN[r.status] || r.status },
    { h: '类型', k: 'is_new', render: r => r.is_new ? tag('新井', 'brand') : tag('老井') },
    { h: '投产日期', k: 'first_prod_date' }, { h: '生产天数', k: 'history_days', num: true, d: 0 },
    { h: '累产油 (t)', k: 'cum_oil_t', num: true, d: 0 }, { h: '达峰产量 (t/d)', k: 'q_peak', num: true },
    { h: 'EUR (t)', k: 'eur', num: true, d: 0 },
    { h: '操作', k: 'op', render: r => el('a', { href: '#/reserves', text: '储量', onclick: e => { e.stopPropagation(); pickWell(r.well_code); } }) }];
  function draw() {
    const q = S.wl.q.trim().toUpperCase();
    const rows = wells.filter(w => !q || w.well_code.toUpperCase().includes(q));
    const pages = Math.max(1, Math.ceil(rows.length / PAGE));
    S.wl.page = Math.min(S.wl.page, pages - 1);
    tbHost.replaceChildren(rows.length ? table(cols, rows.slice(S.wl.page * PAGE, (S.wl.page + 1) * PAGE),
      { onRow: r => { pickWell(r.well_code); go('well'); } }) : emptyState('没有匹配的井'));
    pager.replaceChildren(el('span', { text: `共 ${rows.length} 口 · 第 ${S.wl.page + 1} / ${pages} 页` }),
      el('button', { class: 'btn sm', type: 'button', text: '上一页', disabled: S.wl.page === 0, onclick: () => { S.wl.page--; draw(); } }),
      el('button', { class: 'btn sm', type: 'button', text: '下一页', disabled: S.wl.page >= pages - 1, onclick: () => { S.wl.page++; draw(); } }));
  }
  draw();
  return panel('井列表', { meta: '点击行进入全生命周期预测', flush: true, actions: [search] }, [tbHost, pager]);
}

/* ── 单井选择器（页头筛选） ── */
function wellPicker(onChange) {
  const sel = el('select', { onchange: e => onChange(e.target.value), style: 'max-width:260px' },
    S.wells.map(w => el('option', { value: w.well_code, text: `${w.well_code}　${w.block}/${w.layer}　${w.is_new ? '新井' : '老井'}` })));
  if (S.current) sel.value = S.current;
  return sel;
}

/* ── 全生命周期预测 ── */
async function renderWell() {
  const host = $('#tab-well'), token = ++S.tok.well;
  host.replaceChildren(loading('加载井数据…'));
  await ensureBase();
  if (token !== S.tok.well || S.page !== 'well') return;
  setCtx('well', [ctxField('井号', wellPicker(c => { S.current = c; renderWell(); })),
    el('button', { class: 'btn sm', type: 'button', text: '查看储量评估', onclick: () => go('reserves') })]);
  host.replaceChildren(loading('计算中… 首次访问需拟合递减曲线，约 1 秒'));

  let info, curve, pred, analogs, dca0;
  try {
    [info, curve, pred, analogs, dca0] = await Promise.all([
      api('/well/query', { well_code: S.current }), api('/well/curve', { well_code: S.current }),
      api('/predict/lifecycle', { well_code: S.current }), api('/analogs', { well_code: S.current, top_k: 5 }),
      api('/reserves/dca', { well_code: S.current }).catch(() => null)]);
  } catch (e) {
    if (token === S.tok.well) host.replaceChildren(alertBar('crit', '加载失败', e.message));
    return;
  }
  if (token !== S.tok.well) return;

  const pr = pred.results;
  const act = curve.actual && curve.actual.label_quality === 'ok' ? curve.actual : null;
  const strip = kpiStrip(Object.entries(pr).map(([k, v]) => ({
    label: `${TARGET_CN[k] || k} · P50`, value: fmt(v.p50), unit: v.unit,
    note: `P10–P90 ${fmt(v.p10)} ~ ${fmt(v.p90)}` + (act && act[k] != null ? `｜实际 ${fmt(act[k])}` : '') })));

  /* 主图：实测 + 预测 + 概率带。压力不进同一张图，绝不双轴。 */
  const c1 = cssVar('--c1'), c2 = cssVar('--c2');
  const obs = curve.month.map((m, i) => ({ x: m, y: curve.oil_t_per_d[i] }));
  const cv = pred.curve;
  const ratio = { lo: pr.eur ? pr.eur.p10 / pr.eur.p50 : .8, hi: pr.eur ? pr.eur.p90 / pr.eur.p50 : 1.2 };
  /* 横轴裁到经济极限附近；新井拿不到经济极限，就用曲线降到峰值 8% 以下的位置 */
  let cut = cv ? cv.month.length : 0;
  if (cv && cv.q.length) {
    const qEcon = dca0 ? dca0.economics.q_econ_t_per_d : Math.max(...cv.q) * 0.08;
    const k = cv.q.findIndex(v => v < qEcon);
    if (k > 4) cut = Math.min(cv.month.length, Math.round(k * 1.15));
  }
  const p50 = cv ? cv.month.slice(0, cut).map((m, i) => ({ x: m, y: cv.q[i] })) : [];
  const band = cv ? cv.month.slice(0, cut).map((m, i) => ({ x: m, lo: cv.q[i] * ratio.lo, hi: cv.q[i] * ratio.hi })) : [];
  const plot = el('div');
  lineChart(plot, {
    xLabel: '投产后月份', yLabel: '日产油 t/d',
    series: [{ name: '实测', color: c2, points: obs, dots: obs.length < 40 },
      { name: '预测 P50', color: c1, points: p50, dashed: true }],
    band, bandColor: c1,
    hline: dca0 ? { y: dca0.economics.q_econ_t_per_d, label: `经济极限 ${dca0.economics.q_econ_t_per_d} t/d` } : null,
    vline: { x: Math.max(...curve.month, 1), label: '← 实测 / 预测 →' },
    markers: pr.t_peak ? [{ x: pr.t_peak.p50 / 30.4, y: pr.q_peak.p50, color: c2, label: `达峰 P50 ${fmt(pr.t_peak.p50, 0)} d` }] : []
  });
  const curvePanel = panel('产量剖面预测', {
    meta: `观测窗 ${pred.obs_days} 天 · 模型 ${pred.model_version} · Di=${cv ? cv.di : '—'} · b=${cv ? cv.b : '—'}`,
    note: ['预测曲线由预测出的达峰产量、达峰时间与 EUR 反推，与三个标量预测自洽；概率带按 EUR 区间等比缩放。',
      dca0 ? '经济极限线按 12 个月首日均价口径计算；横轴已裁到经济极限附近。' : '该井尚未达峰，递减分析不适用，故不画经济极限线。']
  }, [legend([{ name: '实测月均日产', color: c2 }, { name: '预测 P50', color: c1 },
    { name: 'P10–P90 区间', color: c1, kind: 'band' }, dca0 ? { name: '经济极限', kind: 'dash' } : null].filter(Boolean)),
  el('figure', {}, plot)]);

  const attrHost = el('div');
  divergingBars(attrHost, pred.explain.top_features.map(f => ({ label: FEATURE_CN[f.feature] || f.feature, value: f.contrib, raw: f.value })), 'd');
  const attrPanel = panel('特征归因 · 达峰时间', {
    meta: '条形 = 该特征把预测推高 / 拉低的天数', note: pred.explain.method + '：把该特征换成训练集中位数，看预测怎么变。'
  }, el('figure', {}, attrHost));
  const anPanel = panel('类比井', { meta: `相似度前 ${analogs.analogs.length}`, note: analogs.method, flush: true },
    table([{ h: '井号', k: 'well_code' }, { h: '相似度', k: 'similarity', num: true },
      { h: '实际达峰 (d)', k: 't_peak_actual', num: true, d: 0 }, { h: '峰值 (t/d)', k: 'q_peak_actual', num: true },
      { h: 'EUR (t)', k: 'eur_actual', num: true, d: 0 }], analogs.analogs, { onRow: r => { S.current = r.well_code; renderWell(); } }));

  const warn = !act && curve.actual ? alertBar('info', '暂无可信实际标签',
    `质量位 ${curve.actual.label_quality || '—'}：峰后下降尚未持续足够长时间，不展示"实际达峰"，避免把还没到的峰当成真值。`) : null;
  host.replaceChildren(...[wellHead(info), warn, strip, curvePanel,
    el('div', { class: 'row c2' }, [attrPanel, anPanel])].filter(Boolean));
}

/* ── 储量与 SEC 预评估 ── */
async function renderReserves() {
  const host = $('#tab-reserves'), token = ++S.tok.reserves;
  host.replaceChildren(loading());
  await ensureBase();
  if (token !== S.tok.reserves || S.page !== 'reserves') return;
  setCtx('reserves', [ctxField('井号', wellPicker(c => { S.current = c; renderReserves(); })),
    el('button', { class: 'btn sm', type: 'button', text: '查看生命周期预测', onclick: () => go('well') })]);
  host.replaceChildren(loading('计算中…'));

  /* 逐个容错：新井做不了递减分析是正常业务状态，不该让整页报错 */
  const soft = p => p.catch(e => ({ _error: e.message }));
  const [info, dca, vol, cc, sec] = await Promise.all([
    soft(api('/well/query', { well_code: S.current })),
    soft(api('/reserves/dca', { well_code: S.current })), soft(api('/reserves/volumetric', { well_code: S.current })),
    soft(api('/reserves/crosscheck', { well_code: S.current })), soft(api('/sec/screen', { well_code: S.current }))]);
  if (token !== S.tok.reserves) return;
  if (info._error) { host.replaceChildren(alertBar('crit', '加载失败', info._error)); return; }

  const strip = kpiStrip([
    { label: 'EUR · P50', ...(dca._error ? { value: '不可得' } : tU(dca.eur.p50)), note: dca._error ? '需峰后 180 天历史' : `P10–P90 ${fmt(dca.eur.p10, 0)} ~ ${fmt(dca.eur.p90, 0)} t` },
    { label: '已累产', ...(dca._error ? tU(info.cum_oil_t) : tU(dca.cum_to_date_t)), note: dca._error ? '井史累计' : '至评估基准日' },
    { label: '剩余可采 · P50', ...(dca._error ? { value: '—' } : tU(dca.remaining_t.p50)), note: dca._error ? '递减分析不适用' : '按递减曲线外推至经济极限' },
    { label: 'SEC 类别', value: sec._error ? '—' : sec.category, note: sec._error ? sec._error : sec.category_rationale },
    { label: '已证实储量', ...((sec._error || sec.proved_reserves_t === null) ? { value: '不可得' } : tU(sec.proved_reserves_t)), note: sec._error ? '' : sec.basis }]);

  const dcaPanel = dca._error ? panel('递减曲线分析', { meta: '不适用' }, emptyState(dca._error))
    : panel('递减曲线分析', { meta: `${dca.fit.model} · R² ${dca.fit.r2}`, note: dca.guard, flush: true },
      el('div', { style: 'padding:4px 16px' }, kv([
        ['递减参数', `b = ${dca.fit.b} · Di = ${dca.fit.di_per_month} /月 · 终端递减 ${dca.fit.d_min_per_month} /月`],
        ['经济极限产量', dca.economics.q_econ_t_per_d + ' t/d'],
        ['到达经济极限', '第 ' + fmt(dca.economics.t_econ_month, 0) + ' 个月'],
        ['12 个月首日均价', dca.economics.avg_12m_price_usd_bbl + ' USD/bbl'],
        ['价格册', dca.economics.price_deck_id],
        ['EUR 区间', `P10 ${fmt(dca.eur.p10, 0)} · P50 ${fmt(dca.eur.p50, 0)} · P90 ${fmt(dca.eur.p90, 0)} t`],
        ['不确定性', dca.eur.n_bootstrap + ' 次移动块自助法'],
        dca.economics.t_econ_capped ? ['注意', dca.economics.t_econ_note] : null])));

  /* 蒙特卡洛：用返回的分位数重建对数正态样本只为展示形状，参考线才是真值 */
  let volPanel;
  if (vol._error) volPanel = panel('容积法储量', { meta: '不可得' }, emptyState(vol._error));
  else {
    const o = vol.ooip_t, mu = Math.log(Math.max(o.p50, 1));
    const sigma = Math.max((Math.log(Math.max(o.p90, 1)) - Math.log(Math.max(o.p10, 1))) / 2.563, .05);
    const sample = Array.from({ length: 4000 }, () => {
      let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random();
      return Math.exp(mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
    });
    const mc = el('div');
    histogram(mc, sample, [{ x: o.p10, label: 'P10' }, { x: o.p50, label: 'P50' }, { x: o.p90, label: 'P90' }], '地质储量 OOIP (t)');
    volPanel = panel('容积法储量', {
      meta: `OOIP P50 ${fmtT(o.p50)} · P10–P90 ${fmtT(o.p10)} ~ ${fmtT(o.p90)}`,
      note: [vol.method, '直方图形状按接口返回的 P10/P50/P90 重建，仅示意分布宽度；三条参考线才是内核蒙特卡洛的实际输出。']
    }, el('figure', {}, mc));
  }

  const ccKind = c => c === 'consistent' ? 'ok' : c === 'conflict' ? 'crit' : 'warn';
  const ccPanel = cc._error ? panel('动静态互校', { meta: '不适用' }, emptyState(cc._error))
    : panel('动静态互校', { actions: [tag('判定：' + (CONSIST_CN[cc.consistency] || cc.consistency), ccKind(cc.consistency))] }, [
      kv([['隐含采收率', cc.rf_implied_pct + '%'],
        ['区块经验区间', `${cc.rf_reference_pct.low_pct}% ~ ${cc.rf_reference_pct.high_pct}%（10%–90% 分位）`],
        ['参考样本', `${cc.rf_reference_source.n} 口 · ${cc.rf_reference_source.source}`]]),
      el('div', { style: 'margin-top:8px' }, cc.findings.map(f => el('div', { class: 'finding ' + f.severity }, el('div', {}, [
        el('div', { text: f.finding }),
        f.reason ? el('div', { class: 'act', text: '可能原因：' + f.reason }) : null,
        f.action ? el('div', { class: 'act', text: '建议：' + f.action }) : null]))))]);

  const secPanel = sec._error ? panel('SEC 满足性检查', { meta: '不可得' }, emptyState(sec._error))
    : panel('SEC 满足性检查', {
      meta: `基准日 ${sec.as_of}`, flush: true,
      actions: [tag(`通过 ${sec.summary.n_pass} / ${sec.summary.n_items}`, 'ok'),
        sec.summary.n_needs_human ? tag(`待人工 ${sec.summary.n_needs_human}`, 'warn') : null].filter(Boolean),
      foot: [icon('alert'), sec.summary.disclaimer]
    }, el('ul', { class: 'chk' }, sec.checklist.map(i => el('li', {}, [
      el('span', {}, tag(STATUS_CN[i.status], STATUS_CLS[i.status])),
      el('div', {}, [el('div', { class: 'it', text: i.item }), el('div', { class: 'ev', text: '依据：' + i.evidence }),
        i.citation ? el('div', { class: 'ct mono', text: i.citation }) : null])]))));

  host.replaceChildren(...[wellHead(info),
    dca._error ? alertBar('warn', '递减分析不适用', `${dca._error}。递减分析要求已过峰，把上升段当递减段拟合会外推出荒谬的 EUR；该井储量区间请参考"全生命周期预测"中的 EUR。`) : null,
    strip,
    el('div', { class: 'row c2' }, [el('div', { class: 'stack' }, [dcaPanel, ccPanel, volPanel]), secPanel])].filter(Boolean));
}

async function ensureUnits() {
  if (!S.units) {
    S.units = await api('/units');
    S.scope = S.units.company.name;
    S.asOf = S.units.evaluation_dates.at(-1);
    S.scenario = 'sec';
  }
  return S.units;
}

function unitCtx(opts, onChange) {
  const u = S.units;
  const scopeSel = el('select', { onchange: e => { S.scope = e.target.value; onChange(); }, style: 'max-width:280px' }, [
    el('optgroup', { label: '公司' }, el('option', { value: u.company.name, text: u.company.name })),
    el('optgroup', { label: '采油厂' }, u.plants.map(p => el('option', { value: p.plant_name, text: p.plant_name }))),
    el('optgroup', { label: 'SEC 单元' }, u.plants.flatMap(p => p.units.map(x =>
      el('option', { value: x.unit_id, text: `${x.unit_id}　${x.unit_name}　${x.n_wells} 口` }))))]);
  scopeSel.value = S.scope;
  const out = [ctxField('评估对象', scopeSel)];
  if (opts.date) {
    const d = el('select', { onchange: e => { S.asOf = e.target.value; onChange(); } },
      u.evaluation_dates.map(x => el('option', { value: x, text: x })));
    d.value = S.asOf; out.push(ctxField(opts.dateLabel || '基准日', d));
  }
  if (opts.scenario) {
    const sc = el('select', { onchange: e => { S.scenario = e.target.value; onChange(); } },
      u.scenarios.map(x => el('option', { value: x.key, text: x.label })));
    sc.value = S.scenario; out.push(ctxField('价格情景', sc));
  }
  return out;
}

function evidenceText(kind, e) {
  if (kind === 'wells') return `${e.well_code}（${e.unit_id}）${fmt(e.reserves_t, 0)} t，${e.basis}，投产 ${e.months_on} 个月`;
  if (kind === 'measures') return `${e.well_code}（${e.unit_id}）${e.event_name} ${e.event_ym}，增加可采 ${fmt(e.inc_eur_t, 0)} t`;
  if (kind === 'economics') return `油价 ${fmt(e.price_open_usd_bbl)} → ${fmt(e.price_close_usd_bbl)} USD/bbl，单井经济极限 ${fmt(e.q_econ_open_t_per_d)} → ${fmt(e.q_econ_close_t_per_d)} t/d`;
  if (kind === 'wells_rate_change') return `${e.well_code}（${e.unit_id}）日产 ${fmt(e.rate_open_t_per_d)} → ${fmt(e.rate_close_t_per_d)} t/d，含水 ${fmt(e.water_cut_open_pct, 1)}% → ${fmt(e.water_cut_close_pct, 1)}%`;
  return '';
}

/* ── SEC 构成评估（技术人员视角）：一次取数，子页签切换不重复请求 ── */
async function renderUnit() {
  const host = $('#tab-unit'), token = ++S.tok.unit;
  host.replaceChildren(loading('加载评估单元…'));
  await ensureUnits();
  if (token !== S.tok.unit || S.page !== 'unit') return;
  setCtx('unit', unitCtx({ date: true, scenario: true }, renderUnit));
  host.replaceChildren(loading('评估中… 首次评估需逐井拟合全部老井（公司级约 10 秒），之后命中缓存'));

  const dates = S.units.evaluation_dates, idx = dates.indexOf(S.asOf);
  const q = { scope: S.scope, as_of: S.asOf }, qs = { ...q, scenario: S.scenario };
  const rq = idx > 0 ? { scope: S.scope, from_as_of: dates[idx - 1], to_as_of: S.asOf, scenario: S.scenario } : null;
  const noPrev = Promise.resolve({ _error: `${S.asOf} 是首个评估基准日，没有上期结果可对账` });
  /* 先单独请求构成：服务端这一步做逐井拟合，其余请求随后直接命中缓存 */
  const comp = await softApi('/unit/composition', qs);
  const [prod, dec, nw, meas, recon, attr, sens] = await Promise.all([
    softApi('/unit/production', q), softApi('/unit/decline', q), softApi('/unit/new-wells', q),
    softApi('/unit/measures', q), rq ? softApi('/unit/reconcile', rq) : noPrev,
    rq ? softApi('/unit/attribution', rq) : noPrev, softApi('/unit/sensitivity', qs)]);
  if (token !== S.tok.unit) return;            /* 筛选已改：丢弃过期结果 */
  if (comp._error) { host.replaceChildren(alertBar('crit', '构成评估失败', comp._error)); return; }

  const C = COMP(), color = Object.fromEntries(C.map(c => [c.key, c.color]));
  const D = { comp, prod, dec, nw, meas, recon, attr, sens, C, color };
  const strip = kpiStrip([
    { label: `PDP 合计 · ${comp.scenario_label}`, ...tU(comp.total_t), note: `本期产量 ${fmtT(comp.production_in_period_t)}` },
    ...comp.components.map(c => ({ label: c.name, sw: color[c.key], ...tU(c.reserves_t),
      note: `占 ${fmt(c.share_pct, 1)}% · ${c.n_items} ${c.key === 'measure' ? '次措施' : '口井'}` }))]);
  const tabs = [
    { k: 'comp', label: '储量构成' },
    { k: 'recon', label: '对账与归因' },
    { k: 'wells', label: '新井识别', cnt: nw._error ? undefined : nw.n_infill + nw.n_extension },
    { k: 'measures', label: '措施与递减', cnt: meas._error ? undefined : meas.overall.n },
    { k: 'sens', label: '敏感性' }];
  if (!tabs.some(t => t.k === S.unitSub)) S.unitSub = 'comp';
  const subHost = el('div');
  const drawSub = () => subHost.replaceChildren(...UNIT_SUB[S.unitSub](D));
  host.replaceChildren(strip, subTabs(tabs, S.unitSub, k => { S.unitSub = k; drawSub(); }), subHost);
  drawSub();
}
