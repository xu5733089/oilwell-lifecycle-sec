    { h: '覆盖率', k: 'cov', num: true }, { h: '校准前', k: 'cov0', num: true }], bt));

  const qRows = Object.entries(ov.quality.top_reasons || {}).map(([k, v]) => ({ reason: k, n: v }));
  const qPanel = panel('数据质量门禁', {
    meta: `${ov.quality.n_passed} / ${ov.quality.n_wells} 通过 · 未通过的进隔离区，不进训练集`, flush: true
  }, qRows.length ? table([{ h: '未通过原因（前 5）', k: 'reason' }, { h: '井数', k: 'n', num: true, d: 0 }], qRows) : emptyState('全部通过'));

  /* ── 全局 SHAP 蜂群 ── */
  const tOpts = Object.keys(rep).filter(k => TARGET_CN[k]).map(k => [k, TARGET_CN[k]]);
  if (!S.gsTarget || !rep[S.gsTarget]) S.gsTarget = rep.eur ? 'eur' : (tOpts[0] || ['eur'])[0];
  const gsBody = el('div', {}, loading('计算全局 SHAP…', true));
  let gsReq = 0;
  async function loadGS(k) {
    const my = ++gsReq;
    gsBody.replaceChildren(loading('计算全局 SHAP…', true));
    try {
      S.gs = S.gs || {};
      const g = S.gs[k] || (S.gs[k] = await api('/model/global-shap', { target: k }));
      if (my !== gsReq) return;
      const fig = el('div');
      beeswarm(fig, g);
      gsBody.replaceChildren(rampLegend('特征取值', '低', '高', '灰色 = 缺失'), el('figure', {}, fig),
        el('div', { class: 'kn', text: `每个点是一口井 · 基准值 ${fmt(g.expected_value)} · 样本 ${g.n} 口 · 按平均 |SHAP| 取前 ${Math.min(10, g.features.length)} 个特征` }));
    } catch (e) { if (my === gsReq) gsBody.replaceChildren(emptyState(e.message)); }
  }
  const gsPanel = panel('全局特征归因 · SHAP 蜂群图', {
    meta: '梯度提升 P50 分量',
    actions: [segControl(tOpts.length ? tOpts : [['eur', 'EUR']], S.gsTarget, k => { S.gsTarget = k; loadGS(k); }, '预测目标')],
    note: ['精确 TreeSHAP（自研，与穷举 Shapley 逐位对拍）：每口井的 基准值 + 各特征贡献 = 模型输出。',
      '横轴是该特征对预测的推动（目标单位），颜色是该井的特征取值（5%–95% 分位间由浅到深）。颜色沿横轴单调渐变，说明模型学到的是单调关系。']
  }, gsBody);

  /* ── 模型族对比 ── */
  const famRows = Object.entries(rep).filter(([, r]) => r.families && r.families.blend)
    .map(([k, r]) => ({ target: TARGET_CN[k] || k, f: r.families, w: r.seq_weight }));
  const bestOf = f => Math.min(...['gbdt', 'seq', 'blend'].map(n => (f[n] ? f[n].mae : Infinity)));
  const maeCell = (r, n) => {
    const x = r.f[n];
    if (!x) return '—';
    const best = x.mae === bestOf(r.f);
    return el('span', { class: best ? 'best' : null, text: fmt(x.mae) + (best ? ' ✓' : '') });
  };
  const famPanel = panel('模型族对比', {
    meta: '测试集 · 各自保形校准 · ✓ = 该目标 MAE 最低', flush: true,
    note: ['梯度提升读前 90 天的统计特征；序列模型（纯 numpy 膨胀卷积 TCN，手写反向传播）直接读逐日曲线。',
      '融合权重在校准集 A 半上按分位数损失从 {0, 0.25, 0.5, 0.75, 1} 中选出，B 半做保形校准 —— 权重可能选到 0，融合不预设"一定更好"。']
  }, famRows.length ? table([{ h: '目标', k: 'target' },
    { h: '梯度提升 MAE', k: 'g', num: true, render: r => maeCell(r, 'gbdt') },
    { h: '序列模型 MAE', k: 's', num: true, render: r => maeCell(r, 'seq') },
    { h: '融合 MAE', k: 'b', num: true, render: r => maeCell(r, 'blend') },
    { h: '融合覆盖率', k: 'c', num: true, render: r => fmt(r.f.blend.coverage, 2) },
    { h: '序列权重', k: 'w', num: true, render: r => fmt(r.w, 2) }], famRows) : emptyState('当前模型包没有序列模型，重新训练后可见'));

  show(host, strip,
    el('div', { class: 'row c21' }, [mapPanel, el('div', { class: 'stack' }, [pulsePanel, btPanel, qPanel])]),
    el('div', { class: 'row c2' }, [gsPanel, famPanel]),
    el('div', { class: 'row' }, wellListPanel(wells)));
  loadGS(S.gsTarget);
}

function wellListPanel(wells) {
  const PAGE = 10;
  const tbHost = el('div'), pager = el('div', { class: 'pager' });
  const search = el('input', { type: 'text', placeholder: '搜索井号', 'aria-label': '搜索井号', value: S.wl.q, style: 'height:26px;width:160px;font-size:12px' });
  search.addEventListener('input', () => { S.wl.q = search.value; S.wl.page = 0; draw(); });
  const cols = [
    { h: '井号', k: 'well_code', render: r => el('a', { href: '#/well', text: r.well_code, onclick: e => { e.stopPropagation(); pickWell(r.well_code); } }) },
    { h: '区块', k: 'block' }, { h: '层系', k: 'layer' }, { h: '井型', k: 'well_type' },
    { h: '状态', k: 'status', render: r => WELL_STATUS_CN[r.status] || r.status },
    { h: '类型', k: 'is_new', render: r => r.is_new ? tag('新井', 'brand') : tag('老井') },
    { h: '投产日期', k: 'first_prod_date' }, { h: '生产天数', k: 'history_days', num: true, d: 0 },
    { h: '累产油 (t)', k: 'cum_oil_t', num: true, d: 0 }, { h: '达峰产量 (t/d)', k: 'q_peak', num: true },
    { h: 'EUR (t)', k: 'eur', num: true, d: 0 },
    { h: '操作', k: 'op', render: r => el('a', { href: '#/reserves', text: '储量', onclick: e => { e.stopPropagation(); pickWell(r.well_code); } }) }];
  function draw() {
    const q = S.wl.q.trim().toUpperCase();
    const rows = wells.filter(w => !q || w.well_code.toUpperCase().includes(q));
    const pages = Math.max(1, Math.ceil(rows.length / PAGE));
    S.wl.page = Math.min(S.wl.page, pages - 1);
    const pageRows = rows.slice(S.wl.page * PAGE, (S.wl.page + 1) * PAGE);
    tbHost.replaceChildren(rows.length ? table(cols, pageRows, { onRow: r => { pickWell(r.well_code); go('well'); } }) : emptyState('没有匹配的井'));
    /* 悬停列表行时在井位图上标出该井 */
    tbHost.querySelectorAll('tbody tr').forEach((tr, i) => {
      tr.addEventListener('mouseenter', () => S.mapApi && S.mapApi.highlight(pageRows[i].well_code));
      tr.addEventListener('mouseleave', () => S.mapApi && S.mapApi.highlight(null));
    });
    pager.replaceChildren(el('span', { text: `共 ${rows.length} 口 · 第 ${S.wl.page + 1} / ${pages} 页` }),
      el('button', { class: 'btn sm', type: 'button', text: '上一页', disabled: S.wl.page === 0, onclick: () => { S.wl.page--; draw(); } }),
      el('button', { class: 'btn sm', type: 'button', text: '下一页', disabled: S.wl.page >= pages - 1, onclick: () => { S.wl.page++; draw(); } }));
  }
  draw();
  return panel('井列表', { meta: '点击行进入全生命周期预测', flush: true, actions: [search] }, [tbHost, pager]);
}

/* ── 单井选择器（页头筛选） ── */
function wellPicker(onChange) {
  const sel = el('select', { onchange: e => onChange(e.target.value), style: 'max-width:260px' },
    S.wells.map(w => el('option', { value: w.well_code, text: `${w.well_code}　${w.block}/${w.layer}　${w.is_new ? '新井' : '老井'}` })));
  if (S.current) sel.value = S.current;
  return sel;
}

/* ── 全生命周期预测 ── */
async function renderWell() {
  const host = $('#tab-well'), token = ++S.tok.well;
  host.replaceChildren(loading('加载井数据…'));
  await ensureBase();
  if (token !== S.tok.well || S.page !== 'well') return;
  setCtx('well', [ctxField('井号', wellPicker(c => { S.current = c; renderWell(); })),
    el('button', { class: 'btn sm', type: 'button', text: '查看储量评估', onclick: () => go('reserves') })]);
  host.replaceChildren(loading('计算中… 首次访问需拟合递减曲线，约 1 秒'));

  let info, curve, pred, analogs, dca0;
  try {
    [info, curve, pred, analogs, dca0] = await Promise.all([
      api('/well/query', { well_code: S.current }), api('/well/curve', { well_code: S.current }),
      api('/predict/lifecycle', { well_code: S.current }), api('/analogs', { well_code: S.current, top_k: 5 }),
      api('/reserves/dca', { well_code: S.current }).catch(() => null)]);
  } catch (e) {
    if (token === S.tok.well) show(host, alertBar('crit', '加载失败', e.message));
    return;
  }
  if (token !== S.tok.well) return;

  const pr = pred.results;
  const act = curve.actual && curve.actual.label_quality === 'ok' ? curve.actual : null;
  const strip = kpiStrip(Object.entries(pr).map(([k, v]) => ({
    label: `${TARGET_CN[k] || k} · P50`, value: fmt(v.p50), unit: v.unit,
    note: `P10–P90 ${fmt(v.p10)} ~ ${fmt(v.p90)}` + (act && act[k] != null ? `｜实际 ${fmt(act[k])}` : '') })));

  /* 主图：实测 + 预测 + 概率带。压力不进同一张图，绝不双轴。 */
  const c1 = cssVar('--c1'), c2 = cssVar('--c2');
  const obs = curve.month.map((m, i) => ({ x: m, y: curve.oil_t_per_d[i] }));
  const cv = pred.curve;
  const ratio = { lo: pr.eur ? pr.eur.p10 / pr.eur.p50 : .8, hi: pr.eur ? pr.eur.p90 / pr.eur.p50 : 1.2 };
  /* 横轴裁到经济极限附近；新井拿不到经济极限，就用曲线降到峰值 8% 以下的位置 */
  let cut = cv ? cv.month.length : 0;
  if (cv && cv.q.length) {
    const qEcon = dca0 ? dca0.economics.q_econ_t_per_d : Math.max(...cv.q) * 0.08;
    const k = cv.q.findIndex(v => v < qEcon);
    if (k > 4) cut = Math.min(cv.month.length, Math.round(k * 1.15));
  }
  const p50 = cv ? cv.month.slice(0, cut).map((m, i) => ({ x: m, y: cv.q[i] })) : [];
  const band = cv ? cv.month.slice(0, cut).map((m, i) => ({ x: m, lo: cv.q[i] * ratio.lo, hi: cv.q[i] * ratio.hi })) : [];
  const plot = el('div');
  lineChart(plot, {
    xLabel: '投产后月份', yLabel: '日产油 t/d',
    series: [{ name: '实测', color: c2, points: obs, dots: obs.length < 40 },
      { name: '预测 P50', color: c1, points: p50, dashed: true }],
    band, bandColor: c1,
    hline: dca0 ? { y: dca0.economics.q_econ_t_per_d, label: `经济极限 ${dca0.economics.q_econ_t_per_d} t/d` } : null,
    vline: { x: Math.max(...curve.month, 1), label: '← 实测 / 预测 →' },
    markers: pr.t_peak ? [{ x: pr.t_peak.p50 / 30.4, y: pr.q_peak.p50, color: c2, label: `达峰 P50 ${fmt(pr.t_peak.p50, 0)} d` }] : []
  });
  const curvePanel = panel('产量剖面预测', {
    meta: `观测窗 ${pred.obs_days} 天 · 模型 ${pred.model_version} · Di=${cv ? cv.di : '—'} · b=${cv ? cv.b : '—'}`,
    note: ['预测曲线由预测出的达峰产量、达峰时间与 EUR 反推，与三个标量预测自洽；概率带按 EUR 区间等比缩放。',
      dca0 ? '经济极限线按 12 个月首日均价口径计算；横轴已裁到经济极限附近。' : '该井尚未达峰，递减分析不适用，故不画经济极限线。']
  }, [legend([{ name: '实测月均日产', color: c2 }, { name: '预测 P50', color: c1 },
    { name: 'P10–P90 区间', color: c1, kind: 'band' }, dca0 ? { name: '经济极限', kind: 'dash' } : null].filter(Boolean)),
  el('figure', {}, plot)]);

  /* ── 可解释性：SHAP 瀑布（目标切换）· 模型族区间 · 序列模型时间归因 ── */
  const tOpts = Object.keys(pr).map(k => [k, TARGET_CN[k] || k]);
  if (!S.xTarget || !pr[S.xTarget]) S.xTarget = pr.eur ? 'eur' : tOpts[0][0];
  const shapBody = el('div', {}, loading('计算 SHAP…', true));
  const tempBody = el('div', {}, loading('计算积分梯度…', true));
  const famBody = el('div');
  const shapMeta = el('span'), famMeta = el('span'), tempMeta = el('span');
  const shapPanel = panel('单井特征归因 · SHAP 瀑布', {
    meta: shapMeta,
    actions: [segControl(tOpts, S.xTarget, k => { S.xTarget = k; drawFam(); loadExplain(); }, '解释目标')],
    note: ['精确 TreeSHAP（路径依赖口径）：从训练集平均预测出发，逐个特征把预测推高或拉低，最后恰好落在该井的模型输出上。',
      '解释对象是梯度提升的 P50 分量；线上 P50 是它与序列模型的融合值，序列模型的依据见下方"时间归因"。']
  }, shapBody);
  const famPanel = panel('模型族区间对比', {
    meta: famMeta,
    note: ['三行分别是梯度提升、序列模型、融合（线上口径）的 P10–P90 区间与 P50，均经过各自的保形校准。',
      '有可信实际标签的老井会画出实际值竖线，可直观看到哪个模型更贴近。']
  }, famBody);
  const tempPanel = panel('序列模型时间归因 · 前 90 天', {
    meta: tempMeta,
    note: ['积分梯度（Integrated Gradients）：把输入从"训练集平均日曲线"逐步变到该井的实际曲线，累计每一天、每个通道对预测的贡献。',
      '青色格子把预测推高，橙色拉低，颜色越深贡献越大；贡献在对数空间，逐日合计之和 ≈ 该井与平均曲线预测值的对数差。']
  }, tempBody);

  function drawFam() {
    const t = S.xTarget, f = pred.model_families && pred.model_families[t];
    shapMeta.textContent = `${TARGET_CN[t] || t} · 单位 ${pr[t].unit}`;
    famMeta.textContent = `${TARGET_CN[t] || t}` + (f ? ` · 序列模型融合权重 ${fmt(f.seq_weight, 2)}` : '');
    if (!f) { famBody.replaceChildren(emptyState('当前模型包没有序列模型（旧版本），重新训练后可见')); return; }
    const fig = el('div');
    intervalChart(fig, [
      { label: '梯度提升', lo: f.gbdt[0], mid: f.gbdt[1], hi: f.gbdt[2], color: cssVar('--c3') },
      { label: '序列模型', lo: f.seq[0], mid: f.seq[1], hi: f.seq[2], color: cssVar('--c4') },
      { label: '融合（线上）', lo: f.blend[0], mid: f.blend[1], hi: f.blend[2], color: cssVar('--c1'), strong: true }],
    { actual: act && act[t] != null ? act[t] : null, unit: pr[t].unit, digits: t === 'eur' ? 0 : 2 });
    const dr = pred.input_drift;
    famBody.replaceChildren(...[dr && dr.flagged ? alertBar('warn', '输入超出序列模型训练范围',
      (dr.novel_category ? '该井的区块或层系在训练集中没出现过' : `特征"${FEAT(dr.top_feature)}"偏离训练分布（偏离度 ${dr.score}，阈值 ${dr.threshold}）`) +
      '，线上预测已退回梯度提升，区间也改用梯度提升的保形校准；序列模型一行仅供对照。') : null, el('figure', {}, fig)].filter(Boolean));
  }

  let xReq = 0;
  async function loadExplain() {
    const t = S.xTarget, my = ++xReq;
    shapBody.replaceChildren(loading('计算 SHAP…', true));
    tempBody.replaceChildren(loading('计算积分梯度…', true));
    let ex;
    try { ex = await api('/explain/lifecycle', { well_code: S.current, target: t }); } catch (e) {
      if (my === xReq) { shapBody.replaceChildren(emptyState(e.message)); tempBody.replaceChildren(emptyState(e.message)); }
      return;
    }
    if (my !== xReq || token !== S.tok.well) return;
    const sh = ex.shap[t];
    if (sh) {
      const fig = el('div');
      shapWaterfall(fig, sh, { unit: pr[t].unit, digits: t === 'eur' ? 0 : 2 });
      shapBody.replaceChildren(legend([{ name: '推高预测', color: c1, kind: 'box' }, { name: '拉低预测', color: c2, kind: 'box' },
        { name: '其余特征合计', color: cssVar('--neutral-2'), kind: 'box' }]), el('figure', {}, fig),
      el('div', { class: 'kn', text: `基准值 ${fmt(sh.expected_value)} + 各特征贡献 = ${fmt(sh.prediction)} ${pr[t].unit}（可加性误差 ${sh.additivity_gap}）` }));
    } else shapBody.replaceChildren(emptyState('该目标没有 SHAP 解释'));
    const tm = ex.temporal;
    tempMeta.textContent = tm ? `${TARGET_CN[tm.target] || tm.target} · 序列模型融合权重 ${fmt(tm.seq_weight, 2)}` + (tm.drift_flagged ? ' · 本井输入漂移，序列模型未参与线上融合' : '') : '';
    if (!tm) { tempBody.replaceChildren(emptyState('当前模型包没有序列模型，重新训练后可见')); return; }
    const fig = el('div');
    heatStrip(fig, tm);
    const ch = Object.entries(tm.per_channel).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
    tempBody.replaceChildren(legend([{ name: '推高预测', color: c1, kind: 'box' }, { name: '拉低预测', color: c2, kind: 'box' },
      { name: '日产油', color: cssVar('--c3') }]), el('figure', {}, fig),
    el('div', { class: 'kn', text: `各通道合计（对数空间，按绝对值排序）：${ch.map(([k, v]) => `${CHANNEL_CN[k] || k} ${signed(v, 3)}`).join('　')}　·　完备性误差 ${tm.completeness_gap}` }));
  }

  const anPanel = panel('类比井', { meta: `相似度前 ${analogs.analogs.length}`, note: analogs.method, flush: true },
    table([{ h: '井号', k: 'well_code' }, { h: '相似度', k: 'similarity', num: true },
      { h: '实际达峰 (d)', k: 't_peak_actual', num: true, d: 0 }, { h: '峰值 (t/d)', k: 'q_peak_actual', num: true },
      { h: 'EUR (t)', k: 'eur_actual', num: true, d: 0 }], analogs.analogs, { onRow: r => { S.current = r.well_code; renderWell(); } }));

  const warn = !act && curve.actual ? alertBar('info', '暂无可信实际标签',
    `质量位 ${curve.actual.label_quality || '—'}：峰后下降尚未持续足够长时间，不展示"实际达峰"，避免把还没到的峰当成真值。`) : null;
  show(host, ...[wellHead(info), warn, strip, curvePanel,
    el('div', { class: 'row c2' }, [shapPanel, el('div', { class: 'stack' }, [famPanel, anPanel])]),
    el('div', { class: 'row' }, tempPanel)].filter(Boolean));
  drawFam();
  loadExplain();
}

/* ── 储量与 SEC 预评估 ── */
async function renderReserves() {
  const host = $('#tab-reserves'), token = ++S.tok.reserves;
  host.replaceChildren(loading());
  await ensureBase();
  if (token !== S.tok.reserves || S.page !== 'reserves') return;
  setCtx('reserves', [ctxField('井号', wellPicker(c => { S.current = c; renderReserves(); })),
    el('button', { class: 'btn sm', type: 'button', text: '查看生命周期预测', onclick: () => go('well') })]);
  host.replaceChildren(loading('计算中…'));

  /* 逐个容错：新井做不了递减分析是正常业务状态，不该让整页报错 */
  const soft = p => p.catch(e => ({ _error: e.message }));
  const [info, dca, vol, cc, sec] = await Promise.all([
    soft(api('/well/query', { well_code: S.current })),
    soft(api('/reserves/dca', { well_code: S.current })), soft(api('/reserves/volumetric', { well_code: S.current })),
    soft(api('/reserves/crosscheck', { well_code: S.current })), soft(api('/sec/screen', { well_code: S.current }))]);
  if (token !== S.tok.reserves) return;
  if (info._error) { show(host, alertBar('crit', '加载失败', info._error)); return; }

  const strip = kpiStrip([
    { label: 'EUR · P50', ...(dca._error ? { value: '不可得' } : tU(dca.eur.p50)), note: dca._error ? '需峰后 180 天历史' : `P10–P90 ${fmt(dca.eur.p10, 0)} ~ ${fmt(dca.eur.p90, 0)} t` },
    { label: '已累产', ...(dca._error ? tU(info.cum_oil_t) : tU(dca.cum_to_date_t)), note: dca._error ? '井史累计' : '至评估基准日' },
    { label: '剩余可采 · P50', ...(dca._error ? { value: '—' } : tU(dca.remaining_t.p50)), note: dca._error ? '递减分析不适用' : '按递减曲线外推至经济极限' },
    { label: 'SEC 类别', value: sec._error ? '—' : sec.category, note: sec._error ? sec._error : sec.category_rationale },
    { label: '已证实储量', ...((sec._error || sec.proved_reserves_t === null) ? { value: '不可得' } : tU(sec.proved_reserves_t)), note: sec._error ? '' : sec.basis }]);

  const dcaPanel = dca._error ? panel('递减曲线分析', { meta: '不适用' }, emptyState(dca._error))
    : panel('递减曲线分析', { meta: `${dca.fit.model} · R² ${dca.fit.r2}`, note: dca.guard, flush: true },
      el('div', { style: 'padding:4px 16px' }, kv([
        ['递减参数', `b = ${dca.fit.b} · Di = ${dca.fit.di_per_month} /月 · 终端递减 ${dca.fit.d_min_per_month} /月`],
        ['经济极限产量', dca.economics.q_econ_t_per_d + ' t/d'],
        ['到达经济极限', '第 ' + fmt(dca.economics.t_econ_month, 0) + ' 个月'],
        ['12 个月首日均价', dca.economics.avg_12m_price_usd_bbl + ' USD/bbl'],
        ['价格册', dca.economics.price_deck_id],
        ['EUR 区间', `P10 ${fmt(dca.eur.p10, 0)} · P50 ${fmt(dca.eur.p50, 0)} · P90 ${fmt(dca.eur.p90, 0)} t`],
        ['不确定性', dca.eur.n_bootstrap + ' 次移动块自助法'],
        dca.economics.t_econ_capped ? ['注意', dca.economics.t_econ_note] : null])));

  /* 蒙特卡洛：用返回的分位数重建对数正态样本只为展示形状，参考线才是真值 */
  let volPanel;
  if (vol._error) volPanel = panel('容积法储量', { meta: '不可得' }, emptyState(vol._error));
  else {
    const o = vol.ooip_t, mu = Math.log(Math.max(o.p50, 1));
    const sigma = Math.max((Math.log(Math.max(o.p90, 1)) - Math.log(Math.max(o.p10, 1))) / 2.563, .05);
    const sample = Array.from({ length: 4000 }, () => {
      let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random();
      return Math.exp(mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v));
    });
    const mc = el('div');
    histogram(mc, sample, [{ x: o.p10, label: 'P10' }, { x: o.p50, label: 'P50' }, { x: o.p90, label: 'P90' }], '地质储量 OOIP (t)');
    volPanel = panel('容积法储量', {
      meta: `OOIP P50 ${fmtT(o.p50)} · P10–P90 ${fmtT(o.p10)} ~ ${fmtT(o.p90)}`,
      note: [vol.method, '直方图形状按接口返回的 P10/P50/P90 重建，仅示意分布宽度；三条参考线才是内核蒙特卡洛的实际输出。']
    }, el('figure', {}, mc));
  }

  const ccKind = c => c === 'consistent' ? 'ok' : c === 'conflict' ? 'crit' : 'warn';
  const ccPanel = cc._error ? panel('动静态互校', { meta: '不适用' }, emptyState(cc._error))
    : panel('动静态互校', { actions: [tag('判定：' + (CONSIST_CN[cc.consistency] || cc.consistency), ccKind(cc.consistency))] }, [
      kv([['隐含采收率', cc.rf_implied_pct + '%'],
        ['区块经验区间', `${cc.rf_reference_pct.low_pct}% ~ ${cc.rf_reference_pct.high_pct}%（10%–90% 分位）`],
        ['参考样本', `${cc.rf_reference_source.n} 口 · ${cc.rf_reference_source.source}`]]),
      el('div', { style: 'margin-top:8px' }, cc.findings.map(f => el('div', { class: 'finding ' + f.severity }, el('div', {}, [
        el('div', { text: f.finding }),
        f.reason ? el('div', { class: 'act', text: '可能原因：' + f.reason }) : null,
        f.action ? el('div', { class: 'act', text: '建议：' + f.action }) : null]))))]);

  const secPanel = sec._error ? panel('SEC 满足性检查', { meta: '不可得' }, emptyState(sec._error))
    : panel('SEC 满足性检查', {
      meta: `基准日 ${sec.as_of}`, flush: true,
      actions: [tag(`通过 ${sec.summary.n_pass} / ${sec.summary.n_items}`, 'ok'),
        sec.summary.n_needs_human ? tag(`待人工 ${sec.summary.n_needs_human}`, 'warn') : null].filter(Boolean),
      foot: [icon('alert'), sec.summary.disclaimer]
    }, el('ul', { class: 'chk' }, sec.checklist.map(i => el('li', {}, [
      el('span', {}, tag(STATUS_CN[i.status], STATUS_CLS[i.status])),
      el('div', {}, [el('div', { class: 'it', text: i.item }), el('div', { class: 'ev', text: '依据：' + i.evidence }),
        i.citation ? el('a', { class: 'ct mono', href: '#/standards', text: i.citation + ' ↗', title: '查看条款原文', onclick: () => { S.clause = i.citation; } }) : null])]))));

  /* ── 递减诊断：经验 Arps vs 带物理约束的递减模型（异步加载，不阻塞主体） ── */
  const diagBody = el('div', {}, loading('拟合带物理约束的递减模型…', true));
  const physBody = el('div', {}, loading('', true));
  const diagSeg = el('div');
  const diagRow = dca._error ? null : el('div', { class: 'row c21' }, [
    panel('递减诊断 · 经验 Arps vs 物理约束', {
      actions: [diagSeg],
      note: ['产量对比：月度开井日均产量（点）与两条外推曲线。物理约束模型在"线性流结束"处由 q∝t^-1/2 转入 b≤1 的边界控制流，最终进入终端递减。',
        '流态诊断：产量–时间双对数图。线性流的斜率约 −1/2，斜率明显变陡说明已进入边界控制流 —— 此时继续沿用早期的大 b 值外推会高估 EUR。',
        '规整化压力：RNP =（初始压力 − 井口压力）/ 产量，对物质平衡时间 MBT = 累产 / 产量。线性流斜率约 1/2，边界控制流约 1。井口压力代替井底流压，只看形态，不做定量试井解释。']
    }, diagBody),
    panel('物理约束递减复核', {
      flush: true,
      note: ['官方储量口径仍是左侧"递减曲线分析"的经验 Arps；本面板是独立复核。',
        '回测（python -m src.cli eval-dca）：峰后只有 6 个月历史时，物理约束模型的 EUR 高估超 20% 的井占比约为经验 Arps 的一半；历史长了两者相当。']
    }, physBody)]);

  async function loadPhysics() {
    let ph;
    try { ph = await api('/reserves/dca-physics', { well_code: S.current }); } catch (e) {
      if (token === S.tok.reserves) { diagBody.replaceChildren(emptyState(e.message)); physBody.replaceChildren(emptyState(e.message)); }
      return;
    }
    if (token !== S.tok.reserves) return;
    const ch = ph.chart, P = a => a.map(p => ({ x: p[0], y: p[1] }));
    const draw = k => {
      S.diagMode = k;
      const fig = el('div');
      if (k === 'rate') {
        const phys = P(ch.physics);
        const near = x => phys.reduce((a, b) => Math.abs(b.x - x) < Math.abs(a.x - x) ? b : a, phys[0] || { y: 0 });
        lineChart(fig, {
          xLabel: '投产后月份', yLabel: '开井日均产油 t/d',
          series: [{ name: '实测（月度）', color: cssVar('--neutral-2'), points: P(ch.observed), dots: ch.observed.length < 70 },
            { name: '经验 Arps', color: cssVar('--c2'), points: P(ch.arps), dashed: true },
            { name: '物理约束', color: cssVar('--c1'), points: phys }],
          hline: { y: ph.economics.q_econ_t_per_d, label: `经济极限 ${ph.economics.q_econ_t_per_d} t/d` },
          vline: ch.now_month != null ? { x: ch.now_month, label: '← 实测 / 外推 →' } : null,
          markers: ch.t_elf_month != null && ph.physics.t_elf_month > 0.3 && phys.length
            ? [{ x: ch.t_elf_month, y: near(ch.t_elf_month).y, color: cssVar('--c1'), label: `线性流结束 · 峰后 ${fmt(ph.physics.t_elf_month, 1)} 月` }] : []
        });
        diagBody.replaceChildren(legend([{ name: '实测（月度开井日均）', color: cssVar('--neutral-2'), kind: 'dot' },
          { name: '经验 Arps', color: cssVar('--c2'), kind: 'dash' }, { name: '物理约束（LF → BDF → 终端）', color: cssVar('--c1') },
          { name: '经济极限', kind: 'dash' }]), el('figure', {}, fig));
      } else if (k === 'flow') {
        const fr = ph.flow_regime, a = fr.points[0];
        logLogChart(fig, { xLabel: '投产后月份（对数）', yLabel: '日产油 t/d（对数）', xName: '月份', yName: '日产油',
          series: [{ name: '实测', color: cssVar('--c3'), points: fr.points, dots: true }],
          guides: a ? [{ slope: -0.5, label: '斜率 −1/2（线性流）', anchor: a }, { slope: -1, label: '斜率 −1', anchor: a }] : [] });
        diagBody.replaceChildren(el('figure', {}, fig), kv([['当前流态', fr.regime_now],
          ['早期 / 晚期双对数斜率', `${fr.early_slope ?? '—'} / ${fr.late_slope ?? '—'}`],
          ['诊断出的线性流结束', fr.t_elf_month != null ? `投产后第 ${fmt(fr.t_elf_month, 1)} 个月` : '未识别到明显转折']]));
      } else {
        const r = ph.rnp, a = r.points[0];
        logLogChart(fig, { xLabel: '物质平衡时间 MBT = 累产 / 产量（对数）', yLabel: 'RNP（对数）', xName: 'MBT', yName: 'RNP',
          empty: '压力数据不足，无法绘制规整化压力诊断',
          series: [{ name: '实测', color: cssVar('--c3'), points: r.points, dots: true, line: false }],
          guides: a ? [{ slope: 0.5, label: '斜率 1/2（线性流）', anchor: a }, { slope: 1, label: '斜率 1（边界控制流）', anchor: a }] : [] });
        diagBody.replaceChildren(el('figure', {}, fig), kv([['后半段斜率', r.slope ?? '—'], ['估算初始压力', r.p_init != null ? r.p_init + ' MPa（早期最高井口压力 × 1.05）' : '—']]));
      }
    };
    diagSeg.replaceChildren(segControl([['rate', '产量对比'], ['flow', '流态诊断'], ['rnp', '规整化压力']], S.diagMode || 'rate', draw, '诊断视图'));
    draw(S.diagMode || 'rate');
    const f = ph.physics, e = ph.eur;
    physBody.replaceChildren(el('div', { style: 'padding:4px 16px' }, kv([
      ['模型', '线性流 → 边界控制流 → 终端递减'],
      ['线性流结束 t_elf', `峰后 ${fmt(f.t_elf_month, 1)} 个月`],
      ['边界控制流 b', `${f.b_bdf}（物理上限 1）`],
      ['线性流段 Di', `${f.di_per_month} /月 · 终端递减 ${f.d_min_per_month} /月`],
      ['拟合 R² · 先验占比', `${f.r2} · ${fmt(f.prior_weight * 100, 0)}%`],
      ['先验来源', ph.prior.source],
      ['EUR 区间', `P10 ${fmtT(e.p10)} · P50 ${fmtT(e.p50)} · P90 ${fmtT(e.p90)}`],
      ['与经验 Arps', el('span', {}, [`Arps（${ph.arps.model}，b=${ph.arps.b}）${fmtT(ph.arps.eur_point_t)}；物理约束 ${fmtT(ph.eur_point_t)}　`,
        delta(ph.eur_vs_arps_pct, 1, '%')])],
      ['EUR 上限', ph.eur_cap_t != null ? el('span', {}, [`${fmtT(ph.eur_cap_t)}（OOIP P50 × 区块采收率 90% 分位）　`,
        ph.cap_binding ? tag('已触发', 'warn') : tag('未触发')]) : '不可得（缺静态参数）'],
      ['不确定性', e.n_bootstrap ? `${e.n_bootstrap} 次移动块自助法（每次重拟合都带同样的约束与先验）`
        : '峰后有效月份不足 12 个，未做自助法；区间为剩余可采量 ±40% 的经验带，仅作示意']])));
  }

  show(host, ...[wellHead(info),
    dca._error ? alertBar('warn', '递减分析不适用', `${dca._error}。递减分析要求已过峰，把上升段当递减段拟合会外推出荒谬的 EUR；该井储量区间请参考"全生命周期预测"中的 EUR。`) : null,
    strip,
    el('div', { class: 'row c2' }, [el('div', { class: 'stack' }, [dcaPanel, ccPanel, volPanel]), secPanel]), diagRow].filter(Boolean));
  if (diagRow) loadPhysics();
}

async function ensureUnits() {
  if (!S.units) {
    S.units = await api('/units');
    S.scope = S.units.company.name;
    S.asOf = S.units.evaluation_dates.at(-1);
    S.scenario = 'sec';
  }
  return S.units;
}

function unitCtx(opts, onChange) {
  const u = S.units;
  const scopeSel = el('select', { onchange: e => { S.scope = e.target.value; onChange(); }, style: 'max-width:280px' }, [
    el('optgroup', { label: '公司' }, el('option', { value: u.company.name, text: u.company.name })),
    el('optgroup', { label: '采油厂' }, u.plants.map(p => el('option', { value: p.plant_name, text: p.plant_name }))),
    el('optgroup', { label: 'SEC 单元' }, u.plants.flatMap(p => p.units.map(x =>
      el('option', { value: x.unit_id, text: `${x.unit_id}　${x.unit_name}　${x.n_wells} 口` }))))]);
  scopeSel.value = S.scope;
  const out = [ctxField('评估对象', scopeSel)];
  if (opts.date) {
    const d = el('select', { onchange: e => { S.asOf = e.target.value; onChange(); } },
      u.evaluation_dates.map(x => el('option', { value: x, text: x })));
    d.value = S.asOf; out.push(ctxField(opts.dateLabel || '基准日', d));
  }
  if (opts.scenario) {
    const sc = el('select', { onchange: e => { S.scenario = e.target.value; onChange(); } },
      u.scenarios.map(x => el('option', { value: x.key, text: x.label })));
    sc.value = S.scenario; out.push(ctxField('价格情景', sc));
  }
  return out;
}

/* 报告导出：按页头当前的评估对象、基准日、价格情景生成；Word 直接下载，打印版在新标签页打开 */
function reportButtons() {
  const qs = fmtName => new URLSearchParams({ scope: S.scope, as_of: S.asOf, scenario: S.scenario, format: fmtName });
  const word = el('button', { class: 'btn sm primary', type: 'button', title: '按当前评估对象、基准日与价格情景生成 Word 报告' },
    [icon('download'), '导出 Word']);
  word.addEventListener('click', async () => {
    const idle = [...word.childNodes];
    word.disabled = true;
    word.replaceChildren(el('i', { class: 'spin' }), '生成中…');
    try {
      const r = await fetch('/api/v1/unit/report?' + qs('docx'));
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'HTTP ' + r.status); }
      const blob = await r.blob(), cd = r.headers.get('content-disposition') || '';
      const m = /filename\*=utf-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)"?/i.exec(cd);
      const name = m ? decodeURIComponent(m[1]) : 'SEC储量预评估报告.docx';
      const a = el('a', { href: URL.createObjectURL(blob), download: name });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast(`报告已生成：${name}`);
    } catch (e) {
      toast('报告生成失败：' + e.message, 'crit');
    } finally {
      word.disabled = false;
      word.replaceChildren(...idle);
    }
  });
  const print = el('a', { class: 'btn sm', target: '_blank', rel: 'noopener', href: '/api/v1/unit/report?' + qs('html'),
    title: '打开可打印版本，浏览器打印时选择"另存为 PDF"' }, [icon('printer'), '打印版 / PDF']);
  return [el('span', { class: 'ctx-sep', 'aria-hidden': 'true' }), word, print];
}

function evidenceText(kind, e) {
  if (kind === 'wells') return `${e.well_code}（${e.unit_id}）${fmt(e.reserves_t, 0)} t，${e.basis}，投产 ${e.months_on} 个月`;
  if (kind === 'measures') return `${e.well_code}（${e.unit_id}）${e.event_name} ${e.event_ym}，增加可采 ${fmt(e.inc_eur_t, 0)} t`;
  if (kind === 'economics') return `油价 ${fmt(e.price_open_usd_bbl)} → ${fmt(e.price_close_usd_bbl)} USD/bbl，单井经济极限 ${fmt(e.q_econ_open_t_per_d)} → ${fmt(e.q_econ_close_t_per_d)} t/d`;
  if (kind === 'category') return `${e.well_code}（${e.unit_id}）${e.change} ${fmt(e.reserves_t, 0)} t`;
  if (kind === 'wells_rate_change') return `${e.well_code}（${e.unit_id}）日产 ${fmt(e.rate_open_t_per_d)} → ${fmt(e.rate_close_t_per_d)} t/d，含水 ${fmt(e.water_cut_open_pct, 1)}% → ${fmt(e.water_cut_close_pct, 1)}%`;
  return '';
}

/* ── SEC 构成评估（技术人员视角）：一次取数，子页签切换不重复请求 ── */
async function renderUnit() {
  const host = $('#tab-unit'), token = ++S.tok.unit;
  host.replaceChildren(loading('加载评估单元…'));
  await ensureUnits();
  if (token !== S.tok.unit || S.page !== 'unit') return;
  setCtx('unit', [...unitCtx({ date: true, scenario: true }, renderUnit), ...reportButtons()]);
  host.replaceChildren(loading('评估中… 首次评估需逐井拟合全部老井（公司级约 10 秒）；结果会存为快照，服务重启后直接读取'));

  const dates = S.units.evaluation_dates, idx = dates.indexOf(S.asOf);
  const q = { scope: S.scope, as_of: S.asOf }, qs = { ...q, scenario: S.scenario };
  const rq = idx > 0 ? { scope: S.scope, from_as_of: dates[idx - 1], to_as_of: S.asOf, scenario: S.scenario } : null;
  const noPrev = Promise.resolve({ _error: `${S.asOf} 是首个评估基准日，没有上期结果可对账` });
  /* 先单独请求构成：服务端这一步做逐井拟合，其余请求随后直接命中缓存 */
  const comp = await softApi('/unit/composition', qs);
  const [prod, dec, nw, meas, recon, attr, sens] = await Promise.all([
    softApi('/unit/production', q), softApi('/unit/decline', q), softApi('/unit/new-wells', q),
    softApi('/unit/measures', q), rq ? softApi('/unit/reconcile', rq) : noPrev,
    rq ? softApi('/unit/attribution', rq) : noPrev, softApi('/unit/sensitivity', qs)]);
  if (token !== S.tok.unit) return;            /* 筛选已改：丢弃过期结果 */
  if (comp._error) { show(host, alertBar('crit', '构成评估失败', comp._error)); return; }

  const C = COMP(), color = Object.fromEntries(C.map(c => [c.key, c.color]));
  const D = { comp, prod, dec, nw, meas, recon, attr, sens, C, color };
  const strip = kpiStrip([
    { label: `PDP 合计 · ${comp.scenario_label}`, ...tU(comp.total_t), note: `本期产量 ${fmtT(comp.production_in_period_t)}` },
    ...comp.components.map(c => ({ label: c.name, sw: color[c.key], ...tU(c.reserves_t),
      note: `占 ${fmt(c.share_pct, 1)}% · ${c.n_items} ${c.key === 'measure' ? '次措施' : '口井'}` }))]);
  const tabs = [
    { k: 'comp', label: '储量构成' },
    { k: 'recon', label: '对账与归因' },
    { k: 'wells', label: '新井识别', cnt: nw._error ? undefined : nw.n_infill + nw.n_extension },
    { k: 'measures', label: '措施与递减', cnt: meas._error ? undefined : meas.overall.n },
    { k: 'sens', label: '敏感性' }];
  if (!tabs.some(t => t.k === S.unitSub)) S.unitSub = 'comp';
  const subHost = el('div');
  const drawSub = () => show(subHost, ...UNIT_SUB[S.unitSub](D));
  show(host, strip, subTabs(tabs, S.unitSub, k => { S.unitSub = k; drawSub(); }), subHost);
  drawSub();
}

};

/* ── 运行监控（管理层视角） ── */
async function renderMonitor() {
  const host = $('#tab-monitor'), token = ++S.tok.monitor;
  host.replaceChildren(loading('加载评估单元…'));
  await ensureUnits();
  if (token !== S.tok.monitor || S.page !== 'monitor') return;
  const profs = await softApi('/indicator-profiles');
  if (token !== S.tok.monitor || S.page !== 'monitor') return;
  const profSel = profs._error ? null : el('select', { onchange: e => { S.monProfile = e.target.value; renderMonitor(); }, style: 'max-width:220px' },
    profs.profiles.map(p => el('option', { value: p.profile_id, text: p.name + (p.is_default ? '（默认）' : '') })));
  if (profSel) {
    if (!profs.profiles.some(p => p.profile_id === S.monProfile)) S.monProfile = (profs.profiles.find(p => p.is_default) || profs.profiles[0]).profile_id;
    profSel.value = S.monProfile;
  }
  setCtx('monitor', [...unitCtx({ date: true, dateLabel: '计划对标基准日' }, renderMonitor), profSel ? ctxField('指标方案', profSel) : null]);
  host.replaceChildren(loading('汇总中…'));
  const dates = S.units.evaluation_dates;
  const comps = [];
  for (const d of dates) comps.push(await softApi('/unit/composition', { scope: S.scope, as_of: d, scenario: 'sec' }));
  const [indi, prod] = await Promise.all([softApi('/unit/indicators', { scope: S.scope, as_of_list: dates.join(','), ...(S.monProfile ? { profile: S.monProfile } : {}) }),
    softApi('/unit/production', { scope: S.scope, as_of: S.asOf })]);
  if (token !== S.tok.monitor) return;
  const C = COMP();
  const [prev, cur] = [comps[0], comps.at(-1)];
  const out = [];
  let monLeft = null;

  const pa = indi._error ? null : indi.periods[0], pb = indi._error ? null : indi.periods.at(-1);
  if (!cur._error && !prev._error) {
    const dPdp = cur.total_t - prev.total_t;
    out.push(kpiStrip([
      { label: `PDP · ${cur.as_of}`, ...tU(cur.total_t), note: [`较 ${prev.as_of} `, delta(dPdp / 1e4, 2, ' 万 t')] },
      { label: `本期产量 · ${cur.as_of.slice(0, 4)}`, ...tU(cur.production_in_period_t), note: `上期 ${fmtT(prev.production_in_period_t)}` },
      { label: '本期新井', value: cur.new_wells.n_infill + cur.new_wells.n_extension, unit: '口', note: `提采 ${cur.new_wells.n_infill} · 扩边 ${cur.new_wells.n_extension}` },
      { label: '本期措施', value: cur.measures.n_in_period, unit: '次', note: `有效 ${cur.measures.n_effective} · 增加可采 ${fmtT(cur.measures.inc_eur_total_t)}` },
      ...(pb ? pb.groups.map(g => {
        const a = pa.groups.find(x => x.group === g.group) || {};
        return { label: `${g.name}综合分`, value: fmt(g.score, 1), unit: '分', note: ['较上期 ', delta(g.score - a.score, 1)] };
      }) : [])]));
  }

  /* 指标两期对比 */
  if (indi._error) out.push(errPanel('开发与经营指标', indi._error));
  else {
    const rows = pb.indicators.map(r => {
      const a = pa.indicators.find(x => x.key === r.key) || {};
      return { label: r.name, a: a.score, b: r.score, r, prevRow: a,
        tip: `<b>${r.name}</b>` +
          `<div class="row"><span>${pa.as_of}</span><span class="mono">${fmt(a.value)} ${r.unit}｜${fmt(a.score, 1)} 分</span></div>` +
          `<div class="row"><span>${pb.as_of}</span><span class="mono">${fmt(r.value)} ${r.unit}｜${fmt(r.score, 1)} 分</span></div>` +
          `<div class="row"><span>锚点</span><span class="mono">优 ${r.good}｜差 ${r.bad}</span></div>` };
    });
    const plot = el('div');
    dumbbell(plot, rows, { aColor: cssVar('--c1-soft'), bColor: cssVar('--c1') });
    const dPanel = panel('开发与经营指标评价', {
      meta: `${indi.scope.name} · 得分 0 ~ 100 · ${indi.profile.name}`,
      actions: [el('a', { class: 'btn sm', href: '#/indicators' }, [icon('sliders'), '调整锚点'])],
      note: [indi.scoring + '。', '两期对比用哑铃图而不是雷达图：雷达图的面积随轴的排列顺序变化，读不准差值。']
    }, [legend([{ name: pa.as_of, color: cssVar('--c1-soft'), kind: 'dot' }, { name: pb.as_of, color: cssVar('--c1'), kind: 'dot' }]), el('figure', {}, plot)]);
    const tPanel = panel('指标明细', { meta: `${pb.as_of} 较 ${pa.as_of}`, flush: true },
      table([{ h: '指标', k: 'label' },
        { h: '本期值', k: 'v', num: true, render: x => `${fmt(x.r.value)} ${x.r.unit}` },
        { h: '得分', k: 'b', num: true, d: 1 },
        { h: '较上期', k: 'd', num: true, render: x => delta(x.b - x.a, 1) }], rows));
    monLeft = el('div', { class: 'stack' }, dPanel);
    out.push(el('div', { class: 'row c21' }, [monLeft, tPanel]));
  }

  const lower = [];
  /* 计划与实际 */
  if (prod._error) lower.push(errPanel('计划与实际对标', prod._error));
  else {
    const PT = [['new_wells', '新井投产（口）'], ['new_oil', '新井产油（t）'], ['measure_wells', '措施（井次）'], ['measure_inc', '措施增油（t）'], ['old_oil', '老井产油（t）']];
    const rows = PT.map(([k, label]) => ({ label, value: prod.period_totals[k].deviation_pct ?? 0, raw: prod.period_totals[k] }));
    const plot = el('div');
    divergingBars(plot, rows, '%', { color: cssVar('--neutral-2'), suffix: '%', axisLabel: '← 低于计划　偏差（%）　高于计划 →',
      tip: r => `<b>${r.label}</b><div class="row"><span>计划</span><span class="mono">${fmt(r.raw.plan, 0)}</span></div>` +
        `<div class="row"><span>实际</span><span class="mono">${fmt(r.raw.actual, 0)}</span></div>` +
        `<div class="row"><span>偏差</span><span class="mono">${fmt(r.raw.deviation_pct, 1)}%</span></div>` });
    lower.push(panel('计划与实际对标', {
      meta: `${prod.scope.name} · 本期 ${prod.period_start_ym} ~ ${prod.period_end_ym}`,
      actions: prod.plan_available ? [] : [tag('未导入计划数据', 'warn')],
      note: '量级悬殊的几项（老井产油与措施增油差一个数量级）画偏差百分比，绝对值见表格。',
      table: table([{ h: '项目', k: 'label' }, { h: '计划', k: 'plan', num: true, d: 0 }, { h: '实际', k: 'actual', num: true, d: 0 },
        { h: '偏差', k: 'deviation_pct', num: true, render: r => r.deviation_pct == null ? '—' : signed(r.deviation_pct, 1) + '%' }],
        rows.map(r => ({ label: r.label, ...r.raw })))
    }, el('figure', {}, plot)));
  }

  /* 各单元 SEC 储量构成：两期对比 */
  if (!cur._error && !prev._error) {
    const rows = cur.units.flatMap(u => {
      const p = prev.units.find(x => x.unit_id === u.unit_id);
      return [{ label: `${u.unit_id} · ${prev.as_of.slice(0, 4)}`, tip: `${u.unit_name} · ${prev.as_of}`, values: p ? p.components : {} },
        { label: `${u.unit_id} · ${cur.as_of.slice(0, 4)}`, tip: `${u.unit_name} · ${cur.as_of}`, values: u.components }];
    });
    const plot = el('div');
    hStackedBars(plot, { rows, series: C, unit: 't', labelW: 150 });
    lower.push(panel('各单元 SEC 储量构成 · 两期', {
      meta: `${prev.as_of} 与 ${cur.as_of} · SEC 价口径`,
      note: '上一期的"本期新井 / 本期措施"到了下一期已并入老井基础，所以老井基础逐期抬升是正常现象。',
      table: table([{ h: '单元', k: 'unit_id' }, { h: '基准日', k: 'as_of' }, ...C.map(c => ({ h: c.name + ' (t)', k: c.key, num: true, d: 0 })), { h: '合计 (t)', k: 'total_t', num: true, d: 0 }],
        cur.units.flatMap(u => [prev, cur].map(cp => {
          const x = cp.units.find(v => v.unit_id === u.unit_id) || { components: {} };
          return { unit_id: u.unit_id, as_of: cp.as_of, total_t: x.total_t, ...x.components };
        })), { scroll: true })
    }, [legend(C.map(c => ({ name: c.name, color: c.color, kind: 'box' }))), el('figure', {}, plot)]));
  }
  /* 计划对标面板较矮：放进左栏指标图下方，与右侧指标明细等高；两期构成单独占满一行 */
  const [planPanel, unitsPanel] = lower;
  if (monLeft) monLeft.appendChild(planPanel);
  else out.push(el('div', { class: 'row' }, planPanel));
  if (unitsPanel) out.push(el('div', { class: 'row' }, unitsPanel));
  show(host, ...out);
}

/* ── SEC 单元 · 证实储量类别跟踪（PDP / PDNP / PUD） ── */
const CAT = () => [
  { key: 'PDP', name: '已开发已生产 PDP', color: cssVar('--k1') },
  { key: 'PDNP', name: '已开发未生产 PDNP', color: cssVar('--k2') },
  { key: 'PUD', name: '未开发 PUD', color: cssVar('--k3') }];
const PUD_KIND = { booked: 'ok', drilled: 'brand', expired_5yr: 'crit', beyond_5yr: 'warn', not_certain: 'warn', uneconomic: 'warn' };
const PDNP_KIND = { booked: 'ok', long_shut_in: 'crit', uneconomic: 'warn' };
const ROLL_TINY = { opening: '期初', converted: '转开发', expired_5yr: '超五年', removed: '其他移出', revision: '修订', new_booking: '新入账', closing: '期末' };

async function renderCategories() {
  const host = $('#tab-categories'), token = ++S.tok.categories;
  host.replaceChildren(loading('加载评估单元…'));
  await ensureUnits();
  if (token !== S.tok.categories || S.page !== 'categories') return;
  setCtx('categories', unitCtx({ date: true, scenario: true }, renderCategories));
  host.replaceChildren(loading('评估中… 停产井逐井续算、部署井位逐个判定连续性、五年规则与经济性'));
  const dates = S.units.evaluation_dates, idx = dates.indexOf(S.asOf);
  const noPrev = { _error: `${S.asOf} 是首个评估基准日，没有上期结果可滚动` };
  const [cat, track, disc] = await Promise.all([
    softApi('/unit/categories', { scope: S.scope, as_of: S.asOf, scenario: S.scenario }),
    idx > 0 ? softApi('/unit/category-tracking', { scope: S.scope, from_as_of: dates[idx - 1], to_as_of: S.asOf, scenario: S.scenario })
      : Promise.resolve(noPrev),
    idx > 0 ? softApi('/unit/pud-disclosure', { scope: S.scope, from_as_of: dates[idx - 1], to_as_of: S.asOf, scenario: S.scenario })
      : Promise.resolve(noPrev)]);
  await ensureBase().catch(() => null);
  if (token !== S.tok.categories) return;
  if (cat._error) { show(host, alertBar('crit', '类别评估失败', cat._error)); return; }
  const K = CAT(), color = Object.fromEntries(K.map(k => [k.key, k.color]));
  const byKey = Object.fromEntries(cat.categories.map(c => [c.key, c]));
  const pud = track._error ? null : track.pud, pdnpT = track._error ? null : track.pdnp;

  const strip = kpiStrip([
    { label: `证实储量合计 · ${cat.scenario_label}`, ...tU(cat.total_proved_t), note: 'PDP + PDNP + PUD' },
    ...K.map(k => ({ label: k.name, sw: k.color, ...tU(byKey[k.key].reserves_t),
      note: `占 ${fmt(byKey[k.key].share_pct, 1)}% · ${byKey[k.key].n_items} ${k.key === 'PUD' ? '个井位' : '口井'}` })),
    { label: 'PUD 转化率', value: pud && pud.conversion_rate_pct != null ? fmt(pud.conversion_rate_pct, 1) : '—', unit: pud ? '%' : null,
      note: pud ? `期初 ${pud.n_opening} 个井位，本期钻井 ${pud.n_converted} 个` : '需要上一期结果' },
    { label: '五年规则', value: pud ? pud.n_expired : '—', unit: pud ? '个移出' : null,
      note: cat.warnings.length ? [tag(`${cat.warnings.length} 条预警`, 'warn')] : '无临期井位' }]);

  const unitPlot = el('div');
  hStackedBars(unitPlot, { rows: cat.units.map(u => ({ label: u.unit_id, tip: `${u.unit_id} ${u.unit_name}`, values: u })), series: K, unit: 't', labelW: 120 });
  const unitPanel = panel('各单元证实储量类别', {
    meta: `${cat.scope.name} · 基准日 ${cat.as_of}`,
    note: cat.categories.map(c => `${c.name}：${c.basis}。`).concat([cat.note + '。']),
    table: table([{ h: '单元', k: 'unit_id' }, { h: '名称', k: 'unit_name' }, ...K.map(k => ({ h: k.key + ' (t)', k: k.key, num: true, d: 0 })),
      { h: '合计 (t)', k: 'total_t', num: true, d: 0 }], cat.units, { scroll: true })
  }, [legend(K.map(k => ({ name: k.name, color: k.color, kind: 'box' }))), el('figure', {}, unitPlot)]);

  let rollPanel;
  if (!pud) rollPanel = panel('PUD 滚动', { meta: '不可得' }, emptyState(track._error));
  else {
    const RC = { opening: cssVar('--neutral'), closing: cssVar('--neutral'), converted: color.PDP, new_booking: color.PUD };
    const rows = pud.table.map(r => ({ ...r, label: ROLL_TINY[r.key] || r.item, tiny: ROLL_TINY[r.key],
      total: r.key === 'opening' || r.key === 'closing', color: RC[r.key] || cssVar('--neutral-2') }));
    const plot = el('div');
    waterfall(plot, rows);
    rollPanel = panel('PUD 滚动', {
      meta: `${track.from_as_of} → ${track.to_as_of}`,
      actions: [tag(pud.balanced ? '已闭合' : '未闭合', pud.balanced ? 'ok' : 'crit')],
      note: [track.note + '。', '钻井转化的井位本期起按提采新井计入 PDP（见构成评估）。'],
      table: table([{ h: '行项', k: 'item' }, { h: '储量 (t)', k: 'value', num: true, d: 0 }], pud.table)
    }, [legend([{ name: '期初 / 期末', color: cssVar('--neutral'), kind: 'box' }, { name: '钻井转为 PDP', color: color.PDP, kind: 'box' },
      { name: '新入账', color: color.PUD, kind: 'box' }, { name: '移出与修订', color: cssVar('--neutral-2'), kind: 'box' }]),
      el('figure', {}, plot),
      kv([['期初 → 期末井位', `${pud.n_opening} → ${pud.n_closing} 个`],
        ['本期钻井转化', `${pud.n_converted} 个`], ['五年规则移出 / 其他移出', `${pud.n_expired} / ${pud.n_removed} 个`],
        ['按目前节奏消化期末 PUD', pud.years_to_convert_at_pace != null ? `约 ${fmt(pud.years_to_convert_at_pace, 1)} 年` : '—']])]);
  }

  const pdnpSet = new Set(cat.pdnp.wells.filter(w => w.status === 'booked').map(w => w.well_code));
  const LOC = { booked: [color.PUD, false], not_booked_yet: [color.PUD, true], drilled: [color.PDP, true] };
  const extra = cat.pud.locations.filter(l => l.status !== 'drilled').map(l => {
    const [c, hollow] = LOC[l.status] || [cssVar('--neutral-2'), true];
    return { x: l.x_off, y: l.y_off, color: c, hollow,
      tip: `<b>${l.location_id}</b>　<span class="mono">${l.unit_id}</span>` +
        `<div class="row"><span>判定</span><span>${l.status_cn}</span></div>` +
        `<div class="row"><span>计划钻井</span><span class="mono">${l.planned_drill_ym}</span></div>` +
        `<div class="row"><span>五年期限</span><span class="mono">${l.deadline_ym}</span></div>` +
        `<div class="row"><span>周边在产井</span><span class="mono">${l.n_producing_neighbors} 口</span></div>` +
        `<div class="row"><span>剩余可采</span><span class="mono">${fmt(l.reserves_t, 0)} t</span></div>` };
  });
  const mapHost = el('div');
  if (S.wells.length) wellMap(mapHost, { wells: S.wells, colors: BLOCK_COLORS(), current: null, extra,
    fill: w => pdnpSet.has(w.well_code) ? color.PDNP : cssVar('--neutral'), onPick: code => { pickWell(code); go('well'); } });
  const mapPanel = panel('部署井位与停产井', {
    meta: `${extra.length} 个未钻部署井位 · ${pdnpSet.size} 口 PDNP 停产井`,
    note: ['菱形为未钻部署井位：实心紫色 = 已入账 PUD；空心紫色 = 尚未入账；空心灰色 = 未入账（超五年、连续性不足、计划晚于五年、不经济）。已钻井位已是生产井，不再单独标出。',
      '圆点为井：橙色 = 计入 PDNP 的停产井，灰色 = 其它井。坐标已统一偏移。']
  }, [legend([{ name: '其它井', color: cssVar('--neutral'), kind: 'dot' }, { name: 'PDNP 停产井', color: color.PDNP, kind: 'dot' },
    { name: 'PUD 已入账', color: color.PUD, kind: 'box' }, { name: '未入账井位（空心）', color: cssVar('--neutral-2'), kind: 'box' }]),
    el('figure', {}, mapHost)]);

  const cc = track._error ? null : track.pdp_category_change;
  const pdnpPanel = panel('停产井（PDNP）', {
    meta: `计入 ${cat.pdnp.n_booked} 口 · ${fmtT(cat.pdnp.reserves_t)}`, note: cat.pdnp.rule + '。', flush: true
  }, [pdnpT ? el('div', { style: 'padding:6px 16px 8px;border-bottom:1px solid var(--rule-soft)' }, kv([
      ['期初 → 期末', `${pdnpT.n_opening} → ${pdnpT.n_closing} 口`],
      ['复产转 PDP / 新增停产', `${pdnpT.n_reactivated} / ${pdnpT.n_new} 口`],
      ['长停或不经济移出', `${pdnpT.n_removed} 口`],
      ['PDP 对账类别调整', `复产转入 ${fmtT(cc.reactivated_t)}（${cc.n_reactivated} 口）；停井转出 ${fmtT(cc.shut_in_t)}（${cc.n_shut_in} 口）`]])) : null,
    table([{ h: '井号', k: 'well_code', render: r => el('a', { href: '#/well', text: r.well_code, onclick: () => pickWell(r.well_code) }) },
      { h: '单元', k: 'unit_id' }, { h: '最后生产', k: 'last_prod_ym' }, { h: '停产月数', k: 'shut_in_months', num: true, d: 0 },
      { h: '判定', k: 'status', render: r => tag(r.status_cn, PDNP_KIND[r.status]) },
      { h: 'PDNP (t)', k: 'reserves_t', num: true, d: 0 }, { h: '续算估计 (t)', k: 'estimate_t', num: true, d: 0 },
      { h: '停产时日产 (t/d)', k: 'rate_at_shut_t_per_d', num: true }], cat.pdnp.wells, { scroll: true })]);

  const warnIds = new Set(cat.warnings.map(w => w.location_id));
  const locHost = el('div');
  const drawLocs = () => locHost.replaceChildren(table([
    { h: '井位', k: 'location_id', render: r => el('span', { class: 'mono', text: r.location_id }) }, { h: '单元', k: 'unit_id' },
    { h: '判定', k: 'status', render: r => tag(r.status_cn, PUD_KIND[r.status]) },
    { h: '计划钻井', k: 'planned_drill_ym' }, { h: '首次入账', k: 'first_booked_as_of', render: r => r.first_booked_as_of || '—' },
    { h: '五年期限', k: 'deadline_ym' },
    { h: '剩余年限', k: 'years_to_deadline', num: true, render: r => ['booked', 'expired_5yr'].includes(r.status) ? fmt(r.years_to_deadline, 1) + ' 年' : '—' },
    { h: '周边在产井', k: 'n_producing_neighbors', num: true, d: 0 },
    { h: '投资 (万元)', k: 'capex_wan', num: true, d: 0 }, { h: '净现金流 (万元)', k: 'cash_wan', num: true, d: 0 },
    { h: '剩余可采 (t)', k: 'reserves_t', num: true, d: 0 },
    { h: '已钻井号', k: 'drilled_well_code', render: r => r.drilled_well_code || '—' }],
  cat.pud.locations.filter(l => S.locFilter === 'all' || (S.locFilter === 'booked' ? l.status === 'booked'
    : S.locFilter === 'warn' ? warnIds.has(l.location_id) || l.status === 'expired_5yr' : !['booked', 'drilled'].includes(l.status))), { scroll: true }));
  drawLocs();
  const locPanel = panel('部署井位清单', {
    meta: cat.pud.rule, flush: true,
    actions: [segControl([['all', '全部'], ['booked', '已入账'], ['warn', '预警 / 超五年'], ['out', '未入账']], S.locFilter,
      k => { S.locFilter = k; drawLocs(); }, '按判定筛选')]
  }, locHost);

  /* Item 1203 披露草稿：逐段文字 + 条款引用 + 取数明细；复制为纯文本 */
  let discPanel;
  if (disc._error) discPanel = panel('Item 1203 披露草稿 · 已证实未开发储量', { meta: '不可得' }, emptyState(disc._error));
  else {
    const plain = disc.sections.map(x => `${x.item} ${x.title}\n${x.text}（依据：${x.citations.join('；')}）`).join('\n\n');
    const copy = el('button', { class: 'btn sm', type: 'button' }, [icon('download'), '复制草稿']);
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(plain + '\n\n' + disc.draft_note); toast('已复制披露草稿'); } catch (_) { toast('浏览器不允许写剪贴板', 'crit'); }
    });
    discPanel = panel('Item 1203 披露草稿 · 已证实未开发储量', {
      meta: `${disc.scope.name} · ${disc.from_as_of} → ${disc.to_as_of}`, actions: [copy],
      note: [disc.draft_note, '每段数字均来自类别评估与 PUD 滚动（接口 /unit/categories、/unit/category-tracking），条款号点开可看 eCFR 原文。'],
      foot: [icon('alert'), '草稿不是定稿：未开发原因、开发计划变更等定性说明须由业务部门补充。']
    }, el('div', { class: 'disc' }, disc.sections.map(x => el('section', { class: 'disc-sec' }, [
      el('h4', {}, [el('span', { class: 'mono', text: x.item }), ' ', x.title]),
      el('p', { text: x.text }),
      el('div', { class: 'disc-cite' }, [el('span', { class: 'muted', text: '依据' }),
        ...x.citations.map(c => el('a', { class: 'cite', href: '#/standards', text: c, onclick: () => { S.clause = c; } }))]),
      el('dl', { class: 'facts' }, x.facts.map(f => el('div', {}, [el('dt', { text: f.label }),
        el('dd', { text: f.value == null ? '—' : `${fmt(f.value, 1)}${f.unit ? ' ' + f.unit : ''}` })])))]))));
  }

  show(host, strip,
    cat.warnings.length ? alertBar('warn', `五年规则预警 ${cat.warnings.length} 条`,
      cat.warnings.slice(0, 3).map(w => w.text).join('；') + (cat.warnings.length > 3 ? '；其余见部署井位清单' : '')) : null,
    el('div', { class: 'row c2' }, [unitPanel, rollPanel]),
    el('div', { class: 'row' }, discPanel),
    el('div', { class: 'row c2' }, [mapPanel, pdnpPanel]),
    el('div', { class: 'row' }, locPanel));
}

/* ── SEC 单元 · 折耗与减值 ── */
const wanU = v => v == null ? { value: '—' } : Math.abs(v) >= 1e4 ? { value: fmt(v / 1e4, 2), unit: '亿元' } : { value: fmt(v, 0), unit: '万元' };
const fmtW = v => v == null ? '—' : Math.abs(v) >= 1e4 ? fmt(v / 1e4, 2) + ' 亿元' : fmt(v, 0) + ' 万元';

async function renderDepletion() {
  const host = $('#tab-depletion'), token = ++S.tok.depletion;
  host.replaceChildren(loading('加载评估单元…'));
  await ensureUnits();
  if (token !== S.tok.depletion || S.page !== 'depletion') return;
  setCtx('depletion', unitCtx({ date: true }, renderDepletion));
  host.replaceChildren(loading('计算中… 折耗按 SEC 价证实已开发储量，减值测试另按减值测试价重新评估'));
  const d = await softApi('/unit/depletion', { scope: S.scope, as_of: S.asOf });
  if (token !== S.tok.depletion) return;
  if (d._error) { show(host, alertBar('crit', '折耗与减值不可得', d._error)); return; }
  const s = d.summary, a = d.assumptions;
  const strip = kpiStrip([
    { label: '期初资产净值', ...wanU(s.opening_nbv_wan), note: `${s.n_units} 个单元合计` },
    { label: '本期资本化投入', ...wanU(s.capex_additions_wan), note: '新井钻完井与措施费用' },
    { label: '折耗额', ...wanU(s.depletion_wan), note: `产量法折耗率 ${fmt(s.depletion_rate_pct, 2)}%` },
    { label: '可收回金额', ...wanU(s.recoverable_wan), note: `${a.impairment_scenario} · 折现率 ${fmt(a.discount_rate * 100, 0)}%` },
    { label: '减值额', ...wanU(s.impairment_wan), note: s.n_impaired ? [tag(`${s.n_impaired} 个单元减值`, 'crit')] : '未发生减值' },
    { label: '期末资产净值', ...wanU(s.closing_nbv_wan), note: `整体账面余量 ${s.headroom_pct == null ? '—' : signed(s.headroom_pct, 1) + '%'}` }]);

  const flow = [
    { key: 'opening', item: '期初资产净值', label: '期初', value: s.opening_nbv_wan, total: true, color: cssVar('--neutral') },
    { key: 'capex', item: '本期资本化投入', label: '投入', value: s.capex_additions_wan, color: cssVar('--neutral-2') },
    { key: 'dep', item: '折耗', label: '折耗', value: -s.depletion_wan, color: cssVar('--neutral-2') },
    { key: 'imp', item: '减值', label: '减值', value: -s.impairment_wan, color: cssVar('--crit') },
    { key: 'closing', item: '期末资产净值', label: '期末', value: s.closing_nbv_wan, total: true, color: cssVar('--neutral') }];
  const plot = el('div');
  waterfall(plot, flow, { unit: '万元', totalLabel: '净值', compact: v => Math.abs(v) >= 1e4 ? fmt(v / 1e4, 1) + '亿' : fmt(v, 0) });
  const flowPanel = panel('资产净值变动', { meta: `${d.scope.name} · ${d.as_of} · 单位 万元`,
    table: table([{ h: '项目', k: 'item' }, { h: '金额 (万元)', k: 'value', num: true, d: 1 }], flow) },
  [legend([{ name: '期初 / 期末', color: cssVar('--neutral'), kind: 'box' }, { name: '投入与折耗', color: cssVar('--neutral-2'), kind: 'box' },
    { name: '减值', color: cssVar('--crit'), kind: 'box' }]), el('figure', {}, plot)]);
  const methodPanel = panel('口径与假设', { note: d.note + '。' }, [
    el('ol', { class: 'method' }, d.method.map(m => el('li', { text: m }))),
    kv([['汇率', `${a.fx_cny_per_usd} 元 / 美元`], ['折现率', fmt(a.discount_rate * 100, 0) + '%'], ['减值测试价格情景', a.impairment_scenario],
      ['账面数据', '单元资产账面价值表（可在 系统 · 数据导入 替换为财务台账）']])]);

  const units = d.units.slice().sort((p, q) => (p.headroom_pct ?? 0) - (q.headroom_pct ?? 0));
  const hplot = el('div');
  divergingBars(hplot, units.map(u => ({ label: u.unit_id, value: Math.max(-150, Math.min(150, u.headroom_pct ?? 0)), raw: u })), '%', {
    colorOf: r => r.raw.impaired ? cssVar('--crit') : cssVar('--neutral-2'),
    labelOf: r => r.raw.headroom_pct == null ? '—' : signed(r.raw.headroom_pct, 1) + '%',
    axisLabel: '← 减值　账面余量（%）　有余量 →',
    tip: r => `<b>${r.raw.unit_id} ${r.raw.unit_name}</b>` +
      `<div class="row"><span>折耗后账面价值</span><span class="mono">${fmtW(r.raw.carrying_wan)}</span></div>` +
      `<div class="row"><span>可收回金额</span><span class="mono">${fmtW(r.raw.recoverable_wan)}</span></div>` +
      `<div class="row"><span>减值额</span><span class="mono">${fmtW(r.raw.impairment_wan)}</span></div>` +
      `<div class="row"><span>账面余量</span><span class="mono">${signed(r.raw.headroom_pct, 1)}%</span></div>` });
  const headPanel = panel('各单元减值测试', { meta: '账面余量 =（可收回金额 − 折耗后账面价值）/ 折耗后账面价值',
    note: '条形超过 ±150% 截断显示，标注的是实际余量。' },
  [legend([{ name: '有余量', color: cssVar('--neutral-2'), kind: 'box' }, { name: '减值', color: cssVar('--crit'), kind: 'box' }]), el('figure', {}, hplot)]);

  const detail = panel('单元明细', { meta: '金额单位 万元', flush: true },
    table([{ h: '单元', k: 'unit_id' }, { h: '期初净值', k: 'opening_nbv_wan', num: true, d: 0 },
      { h: '期初来源', k: 'opening_source' }, { h: '本期投入', k: 'capex_additions_wan', num: true, d: 0 },
      { h: '本期产量 (t)', k: 'production_t', num: true, d: 0 }, { h: 'PD 储量 (t)', k: 'pd_reserves_t', num: true, d: 0 },
      { h: '折耗率', k: 'depletion_rate_pct', num: true, render: r => fmt(r.depletion_rate_pct, 2) + '%' },
      { h: '折耗额', k: 'depletion_wan', num: true, d: 0 }, { h: '账面价值', k: 'carrying_wan', num: true, d: 0 },
      { h: '减值价 PD (t)', k: 'pd_reserves_impairment_t', num: true, d: 0 },
      { h: '吨油净现金流 (USD)', k: 'cash_usd_per_t', num: true, d: 1 },
      { h: '可收回金额', k: 'recoverable_wan', num: true, d: 0 },
      { h: '减值额', k: 'impairment_wan', num: true, render: r => r.impaired ? tag(fmt(r.impairment_wan, 0), 'crit') : '—' },
      { h: '期末净值', k: 'closing_nbv_wan', num: true, d: 0 }], d.units, { scroll: true }));
  show(host, strip, el('div', { class: 'row c21' }, [flowPanel, methodPanel]), el('div', { class: 'row c12' }, [headPanel, detail]));
