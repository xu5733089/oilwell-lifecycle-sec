/* ── 系统 · 数据导入 ── */
async function renderImport() {
  const host = $('#tab-import');
  host.replaceChildren(loading());
  const types = await api('/import/types');
  if (S.page !== 'import') return;
  setCtx('import', [tag('CSV（UTF-8 / GBK）或 Excel'), tag('先预检，后导入，可撤销')]);
  if (!types.types.some(t => t.key === S.importType)) S.importType = types.types[0].key;
  const state = { file: null, b64: null, preview: null };
  const typeOf = () => types.types.find(t => t.key === S.importType);

  const steps = el('div', { class: 'steps' });
  const drawSteps = k => steps.replaceChildren(...['选择类型', '上传文件', '预检', '确认导入'].flatMap((txt, i) =>
    [i ? el('span', { text: '›', 'aria-hidden': 'true' }) : null, el('span', { class: i <= k ? 'on' : null, text: `${i + 1} ${txt}` })]).filter(Boolean));
  const tpl = el('a', { class: 'btn sm' }, [icon('download'), '下载模板']);
  const cards = el('div', { class: 'types', role: 'group', 'aria-label': '导入类型' });
  const specHost = el('div');
  const result = el('div');
  const fileInput = el('input', { type: 'file', accept: '.csv,.xlsx,.xlsm', hidden: true });
  const drop = el('div', { class: 'drop', tabindex: 0, role: 'button', 'aria-label': '选择或拖入文件' },
    [icon('upload'), el('div', {}, [el('b', { text: '点击选择文件' }), '，或把 CSV / Excel 拖到这里']),
      el('div', { style: 'font-size:11.5px', text: '单个文件不超过 5 MB；有错误时不会写入任何数据' })]);

  const drawCards = () => cards.replaceChildren(...types.types.map(t => {
    const b = el('button', { type: 'button', 'aria-pressed': String(t.key === S.importType) }, [el('b', { text: t.title }), el('span', { text: t.description })]);
    b.addEventListener('click', () => { if (t.key !== S.importType) { S.importType = t.key; resetFile(); drawCards(); drawSpec(); } });
    return b;
  }));
  const drawSpec = () => {
    const t = typeOf();
    tpl.href = '/api/v1/import/template?type=' + t.key;
    specHost.replaceChildren(
      el('p', { class: 'muted', style: 'margin:0 0 10px', text: t.description }),
      table([{ h: '中文列名', k: 'label' }, { h: '字段名', k: 'name', render: r => el('span', { class: 'mono', text: r.name }) },
        { h: '必填', k: 'required', render: r => r.required ? tag('必填', 'brand') : tag('可选') }], t.columns),
      el('ul', { class: 'method', style: 'margin-top:12px' }, [
        '表头用中文列名或字段名均可，列顺序不限',
        `按主键（${t.keys.map(k => (t.columns.find(c => c.name === k) || {}).label || k).join(' + ')}）替换已有数据，文件里没有的行保持不动`,
        '导入后受影响的评估会自动重算；在下方导入记录里可撤销最近一次导入'].map(x => el('li', { text: x }))));
  };
  function resetFile(keep) {
    state.file = state.b64 = state.preview = null;
    if (!keep) result.replaceChildren();
    drawSteps(1);
  }
  async function pick(f) {
    if (f.size > 5 * 1024 * 1024) { toast('文件超过 5 MB', 'crit'); return; }
    state.file = f;
    drawSteps(2);
    result.replaceChildren(loading(`正在预检 ${f.name}…`, true));
    try {
      state.b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1] || '');
        r.onerror = () => rej(new Error('文件读取失败'));
        r.readAsDataURL(f);
      });
      state.preview = await apiPost('/import/preview', { import_type: S.importType, filename: f.name, content_base64: state.b64 });
      drawResult();
    } catch (e) {
      result.replaceChildren(alertBar('crit', '预检失败', e.message));
    }
  }
  function drawResult() {
    const p = state.preview, sm = p.summary;
    const label = () => [icon('upload'), `确认导入 ${sm.n_valid} 行`];
    const commit = el('button', { class: 'btn primary', type: 'button', disabled: !p.can_commit }, label());
    const again = el('button', { class: 'btn', type: 'button', text: '重新选择' });
    again.addEventListener('click', () => { resetFile(); fileInput.click(); });
    commit.addEventListener('click', async () => {
      commit.disabled = true;
      commit.replaceChildren(el('i', { class: 'spin' }), '导入中…');
      try {
        const r = await apiPost('/import/commit', { import_type: S.importType, filename: state.file.name, content_base64: state.b64 });
        toast(`已导入 ${r.n_rows} 行（新增 ${r.n_insert}，替换 ${r.n_replace}），批次 ${r.batch_id}`);
        drawSteps(3);
        result.replaceChildren(alertBar('info', '导入完成', `批次 ${r.batch_id}：新增 ${r.n_insert} 行，替换 ${r.n_replace} 行。相关页面再次打开时会按新数据重算。`));
        state.file = state.b64 = state.preview = null;
        refreshHistory();
      } catch (e) {
        toast('导入失败：' + e.message, 'crit');
        commit.disabled = false;
        commit.replaceChildren(...label());
      }
    });
    const ks = kpiStrip([{ label: '文件行数', value: sm.n_rows, unit: '行' }, { label: '有效', value: sm.n_valid, unit: '行' },
      { label: '错误', value: sm.n_errors, unit: '处' }, { label: '提醒', value: sm.n_warnings, unit: '处' },
      { label: '新增', value: sm.n_insert, unit: '行' }, { label: '替换已有', value: sm.n_replace, unit: '行' }]);
    ks.classList.add('inset');
    const issueCols = [{ h: '行', k: 'row', num: true, render: r => r.row == null ? '表头' : String(r.row) },
      { h: '列', k: 'column', render: r => r.column || '—' }, { h: '值', k: 'value', render: r => r.value || '—' },
      { h: '问题', k: 'message', cls: 'wrap' }];
    drawSteps(2);
    show(result, ...[
      el('div', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px' },
        [el('b', { text: p.filename }), p.can_commit ? tag('预检通过', 'ok') : tag('有错误，不能导入', 'crit'), el('span', { class: 'spacer' }), again, commit]),
      ks,
      p.errors.length ? box(`错误 ${p.errors.length} 处（修正后重新上传）`, table(issueCols, p.errors, { scroll: true })) : null,
      p.warnings.length ? box(`提醒 ${p.warnings.length} 处（不阻断导入）`, table(issueCols, p.warnings, { scroll: true })) : null,
      p.sample.length ? box('数据预览（前 20 行，已按字段换算）', table(p.columns.map(c => ({ h: c.label, k: c.name,
        render: r => r[c.name] == null ? '—' : String(r[c.name]) })), p.sample, { scroll: true })) : null].filter(Boolean));
  }

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) pick(f); });
  fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) pick(f); fileInput.value = ''; });

  const histHost = el('div');
  async function refreshHistory() {
    let h;
    try { h = await api('/import/history'); } catch (e) { histHost.replaceChildren(alertBar('crit', '导入记录不可得', e.message)); return; }
    histHost.replaceChildren(h.batches.length ? table([
      { h: '批次', k: 'batch_id', render: r => el('span', { class: 'mono', text: r.batch_id }) },
      { h: '类型', k: 'title' }, { h: '文件', k: 'filename' }, { h: '行数', k: 'n_rows', num: true, d: 0 },
      { h: '新增 / 替换', k: 'x', num: true, render: r => `${r.summary.n_insert ?? '—'} / ${r.summary.n_replace ?? '—'}` },
      { h: '导入时间', k: 'created_at', render: r => String(r.created_at || '').slice(0, 19).replace('T', ' ') },
      { h: '状态', k: 'status', render: r => r.status === 'active' ? tag('有效', 'ok') : tag('已撤销') },
      { h: '操作', k: 'op', render: r => {
        if (!r.can_undo) return '—';
        const b = el('button', { class: 'btn sm', type: 'button', text: '撤销' });
        b.addEventListener('click', async () => {
          if (!confirm(`撤销批次 ${r.batch_id}？将恢复导入前的数据。`)) return;
          b.disabled = true;
          try { const u = await apiPost('/import/undo', { batch_id: r.batch_id }); toast(`已撤销 ${u.batch_id}：删除 ${u.removed} 行，恢复 ${u.restored} 行`); refreshHistory(); }
          catch (e) { toast('撤销失败：' + e.message, 'crit'); b.disabled = false; }
        });
        return b;
      } }], h.batches) : emptyState('还没有导入记录'));
  }

  drawCards(); drawSpec(); drawSteps(0);
  const uploadPanel = panel('上传数据', { actions: [tpl] }, [steps, cards, el('div', { style: 'margin-top:12px' }, drop), fileInput, result]);
  const specPanel = panel('字段说明', { meta: '以模板为准' }, specHost);
  const histPanel = panel('导入记录', { meta: '只能撤销每种类型最近一次仍有效的导入', flush: true }, histHost);
  show(host, el('div', { class: 'row c21' }, [uploadPanel, specPanel]), el('div', { class: 'row' }, histPanel));
  refreshHistory();
}

/* ── 系统 · 指标口径（评分锚点方案） ── */
async function renderProfiles() {
  const host = $('#tab-indicators'), token = ++S.tok.profiles;
  host.replaceChildren(loading());
  await ensureUnits();
  if (token !== S.tok.profiles || S.page !== 'indicators') return;
  const lst = await api('/indicator-profiles');
  if (token !== S.tok.profiles) return;
  setCtx('indicators', [...unitCtx({}, renderProfiles), tag('预览基准日 ' + S.units.evaluation_dates.at(-1))]);
  const ref = lst.reference, asOf = S.units.evaluation_dates.at(-1);
  const byId = Object.fromEntries(lst.profiles.map(p => [p.profile_id, p]));
  if (!byId[S.profileSel]) S.profileSel = (lst.profiles.find(p => p.is_default) || lst.profiles[0]).profile_id;
  const cur = byId[S.profileSel];
  const draft = JSON.parse(JSON.stringify(cur.spec.indicators));
  let dirty = false, saved = null;

  const list = el('div', { class: 'plist' }, lst.profiles.map(p => {
    const b = el('button', { type: 'button', 'aria-current': String(p.profile_id === S.profileSel) }, [
      el('span', { class: 'pn' }, [p.name, p.is_builtin ? tag('内置') : tag('自定义', 'brand'), p.is_default ? tag('默认', 'ok') : null]),
      el('span', { class: 'pd', text: p.description || '—' })]);
    b.addEventListener('click', () => {
      if (p.profile_id === S.profileSel) return;
      if (dirty && !confirm('当前方案有未保存的修改，确定切换？')) return;
      S.profileSel = p.profile_id; renderProfiles();
    });
    return b;
  }));

  const errBox = el('div'), scoreStrip = el('div', { class: 'kpis inset' });
  const inputs = {}, valueCells = {}, scoreCells = {};
  const dirText = k => {
    const x = draft[k];
    return !Number.isFinite(x.good) || !Number.isFinite(x.bad) || x.good === x.bad ? '—' : x.good > x.bad ? '越大越好' : '越小越好';
  };
  const numIn = (key, field) => {
    const inp = el('input', { type: 'number', step: 'any', class: 'num-in', value: String(draft[key][field]),
      'aria-label': `${ref.indicators[key].name} ${{ good: '优值锚点', bad: '差值锚点', weight: '权重' }[field]}` });
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      draft[key][field] = Number.isFinite(v) ? v : NaN;
      inp.classList.toggle('changed', draft[key][field] !== cur.spec.indicators[key][field]);
      dirty = true;
      if (validate()) schedule();
    });
    inputs[key + ':' + field] = inp;
    return inp;
  };
  const rows = Object.entries(ref.indicators).map(([k, r]) => ({ key: k, ...r }));
  const tbl = table([
    { h: '指标', k: 'name', render: r => el('span', {}, [r.name, el('div', { class: 'sub2', text: ref.groups[r.group] || r.group })]) },
    { h: '本期值', k: 'v', num: true, render: r => (valueCells[r.key] = el('span', { text: '…' })) },
    { h: '优值锚点', k: 'good', num: true, render: r => numIn(r.key, 'good') },
    { h: '差值锚点', k: 'bad', num: true, render: r => numIn(r.key, 'bad') },
    { h: '方向', k: 'dir', render: r => (inputs[r.key + ':dir'] = el('span', { class: 'muted', text: dirText(r.key) })) },
    { h: '权重', k: 'weight', num: true, render: r => numIn(r.key, 'weight') },
    { h: '得分（预览）', k: 's', num: true, render: r => (scoreCells[r.key] = el('span', { text: '…' })) }], rows, { scroll: true });

  const nameIn = el('input', { type: 'text', value: cur.name, disabled: cur.is_builtin });
  const descIn = el('input', { type: 'text', value: cur.description || '', disabled: cur.is_builtin });
  [nameIn, descIn].forEach(i => i.addEventListener('input', () => { dirty = true; validate(); }));
  const saveBtn = el('button', { class: 'btn sm primary', type: 'button', text: '保存' });
  const saveAsBtn = el('button', { class: 'btn sm', type: 'button', text: '另存为新方案' });
  const defBtn = el('button', { class: 'btn sm', type: 'button', text: cur.is_default ? '已是默认' : '设为默认', disabled: cur.is_default });
  const delBtn = cur.is_builtin ? null : el('button', { class: 'btn sm', type: 'button', text: '删除' });
  const resetBtn = el('button', { class: 'btn sm', type: 'button', text: '撤销修改' });
  const specOf = () => ({ indicators: Object.fromEntries(Object.entries(draft).map(([k, v]) => [k, { good: v.good, bad: v.bad, weight: v.weight }])) });

  function validate() {
    const errs = [];
    Object.entries(draft).forEach(([k, x]) => {
      const badAnchor = !Number.isFinite(x.good) || !Number.isFinite(x.bad) || x.good === x.bad;
      const badWeight = !Number.isFinite(x.weight) || x.weight < 0;
      inputs[k + ':good'].classList.toggle('bad', badAnchor);
      inputs[k + ':bad'].classList.toggle('bad', badAnchor);
      inputs[k + ':weight'].classList.toggle('bad', badWeight);
      inputs[k + ':dir'].textContent = dirText(k);
      if (badAnchor) errs.push(`${ref.indicators[k].name}：优值与差值锚点须为不同的数值`);
      if (badWeight) errs.push(`${ref.indicators[k].name}：权重须为非负数值`);
    });
    if (!cur.is_builtin && !nameIn.value.trim()) errs.push('方案名称不能为空');
    errBox.replaceChildren(...(errs.length ? [alertBar('crit', `${errs.length} 处需要修正`, errs.slice(0, 4).join('；') + (errs.length > 4 ? '…' : ''))] : []));
    saveBtn.disabled = cur.is_builtin || !dirty || !!errs.length;
    saveAsBtn.disabled = !!errs.length;
    return !errs.length;
  }
  let timer = 0, seq = 0;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(preview, 350); };
  function paint(p) {
    p.indicators.forEach(x => {
      if (!valueCells[x.key]) return;
      valueCells[x.key].textContent = x.value == null ? '—' : `${fmt(x.value, 2)} ${x.unit}`;
      const s0 = saved && saved.indicators.find(y => y.key === x.key);
      scoreCells[x.key].replaceChildren(x.score == null ? '—' : fmt(x.score, 1),
        s0 && x.score != null && s0.score != null && Math.abs(x.score - s0.score) >= 0.05 ? el('span', { style: 'margin-left:6px' }, delta(x.score - s0.score, 1)) : '');
    });
    const ks = kpiStrip(p.groups.map(g => {
      const g0 = saved && saved.groups.find(y => y.group === g.group);
      return { label: `${g.name}综合分`, value: fmt(g.score, 1), unit: '分',
        note: g0 && Math.abs(g.score - g0.score) >= 0.05 ? ['较已保存 ', delta(g.score - g0.score, 1)] : '与已保存方案一致' };
    }));
    scoreStrip.replaceChildren(...ks.children);
  }
  async function preview() {
    const my = ++seq;
    try {
      const r = await apiPost('/indicator-profiles/preview', { scope: S.scope, as_of_list: asOf, spec: specOf() });
      if (my === seq) paint(r.periods[0]);
    } catch (e) { errBox.replaceChildren(alertBar('crit', '预览失败', e.message)); }
  }

  saveBtn.addEventListener('click', async () => {
    if (!validate()) return;
    try {
      await apiPost('/indicator-profiles/save', { profile_id: cur.profile_id, name: nameIn.value.trim(), description: descIn.value.trim(), spec: specOf() });
      toast(`已保存方案"${nameIn.value.trim()}"`); dirty = false; renderProfiles();
    } catch (e) { toast('保存失败：' + e.message, 'crit'); }
  });
  saveAsBtn.addEventListener('click', async () => {
    if (!validate()) return;
    const name = prompt('新方案名称', `${cur.name}（调整）`);
    if (!name || !name.trim()) return;
    try {
      const r = await apiPost('/indicator-profiles/save', { name: name.trim(), description: `基于"${cur.name}"调整`, spec: specOf() });
      toast(`已另存为"${r.profile.name}"`); dirty = false; S.profileSel = r.profile.profile_id; renderProfiles();
    } catch (e) { toast('另存失败：' + e.message, 'crit'); }
  });
  defBtn.addEventListener('click', async () => {
    try { await apiPost('/indicator-profiles/default', { profile_id: cur.profile_id }); toast(`"${cur.name}"已设为默认方案，运行监控与报告将按它评分`); renderProfiles(); }
    catch (e) { toast('设置失败：' + e.message, 'crit'); }
  });
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (!confirm(`删除方案"${cur.name}"？此操作不可恢复。`)) return;
    try { await apiPost('/indicator-profiles/delete', { profile_id: cur.profile_id }); toast(`已删除"${cur.name}"`); S.profileSel = null; renderProfiles(); }
    catch (e) { toast('删除失败：' + e.message, 'crit'); }
  });
  resetBtn.addEventListener('click', () => { if (!dirty || confirm('放弃未保存的修改？')) { dirty = false; renderProfiles(); } });

  const listPanel = panel('锚点方案', { meta: `${lst.profiles.length} 个`, flush: true, note: lst.scoring }, list);
  const editor = panel(cur.name, {
    meta: cur.is_builtin ? '内置方案（只读，可另存为新方案）' : `自定义方案 · 更新于 ${String(cur.updated_at || '').slice(0, 19).replace('T', ' ')}`,
    actions: [resetBtn, saveAsBtn, defBtn, delBtn, saveBtn].filter(Boolean)
  }, [
    cur.is_builtin ? alertBar('info', '内置方案只读', '可以直接修改下方锚点预览效果，满意后"另存为新方案"。锚点为示例值，正式使用须由开发与经营部门按本油田水平标定。')
      : el('div', { class: 'fields' }, [el('label', {}, ['方案名称', nameIn]), el('label', {}, ['说明', descIn])]),
    errBox, scoreStrip, box(`锚点与权重 · ${S.scope} · ${asOf}`, tbl)]);
  show(host, el('div', { class: 'row c-side' }, [listPanel, editor]));
  validate();
  try {
    const r = await api('/unit/indicators', { scope: S.scope, as_of_list: asOf, profile: cur.profile_id });
    if (token !== S.tok.profiles) return;
    saved = r.periods[0];
    paint(saved);
  } catch (e) { errBox.replaceChildren(alertBar('crit', '指标值不可得', e.message)); }
}

/* ── 智能问答：工具调用轨迹是这一页的主角 ── */
function renderChat() {
  const host = $('#tab-chat');
  setCtx('chat', [tag('规则路由 + 固定工具链', 'brand'), tag('数值逐个回查')]);
  if (host.dataset.built) return;
  host.dataset.built = '1';

  const input = el('textarea', { rows: 3, placeholder: '输入问题，例如：某口井的 SEC 储量预评估；某个 SEC 单元的储量为什么变化', 'aria-label': '问题' });
  const btn = el('button', { class: 'btn primary', type: 'button' }, [icon('send'), '发送']);
  const aWell = () => S.current || (S.wells[0] && S.wells[0].well_code) || '';
  const qBtn = (text, q) => el('button', { type: 'button', text, onclick: () => { input.value = q(); ask(); } });
  const unitGroup = el('div', {}, [el('div', { class: 'qg', text: 'SEC 单元' }), el('div', { class: 'qg', text: '加载中…' })]);
  const qlist = el('div', { class: 'qlist' }, [
    el('div', { class: 'qg', text: '单井' }),
    ...[['达峰时间预测', '什么时候达峰'], ['SEC 储量预评估', '的 SEC 储量预评估'], ['动静态储量互校', '动静态储量对得上吗'],
      ['递减曲线分析', '递减曲线分析']].map(([t, q]) => qBtn(t, () => `${aWell()} ${q}`)),
    unitGroup,
    el('div', { class: 'qg', text: '边界测试' }),
    qBtn('缺井号（反问澄清）', () => '帮我预测达峰时间'),
    qBtn('不存在的井（异常处理）', () => 'GL-Z-9999 什么时候达峰'),
    qBtn('越权请求（边界拦截）', () => `把 ${aWell()} 的储量结果写回生产库`)]);
  ensureBase().catch(() => null);
  ensureUnits().then(u => {
    const unit = u.plants[0].units[0].unit_id, plant = u.plants[0].plant_name;
    const [y0, y1] = [u.evaluation_dates[0].slice(0, 4), u.evaluation_dates.at(-1).slice(0, 4)];
    const qs = [['储量构成', `${u.company.name} 的 SEC 储量构成`], ['对账与变化归因', `${unit} ${y0}年到${y1}年储量为什么变化`],
      ['自然递减率', `${plant} 扣3年和扣5年自然递减率`], ['措施效果', `${unit} 本期措施效果`], ['油价与成本敏感性', `${u.company.name} 油价和成本敏感性`]];
    unitGroup.replaceChildren(el('div', { class: 'qg', text: 'SEC 单元' }), ...qs.map(([t, q]) => qBtn(t, () => q)));
  }).catch(() => unitGroup.remove());

  const meta = el('div', { class: 'ameta' });
  const answer = el('div', { class: 'answer placeholder', text: '输入问题，或点选常用问题。' });
  const composer = el('div', { class: 'composer' }, [input, el('div', { class: 'cbar' }, [
    el('span', { class: 'hint', text: 'Enter 发送 · Shift + Enter 换行' }), el('span', { class: 'spacer' }), btn])]);
  const ansPanel = panel('分析结果', { meta: '回答由工具返回值成文' }, [meta, answer]);
  ansPanel.appendChild(composer);

  const idle = () => [['意图路由', '先判断问的是单井还是 SEC 单元，再选意图；越权请求直接拦下'],
    ['槽位抽取', '井号、评估对象、年份、价格情景；缺了就反问，不猜'],
    ['按计划调工具', '固定的工具链，大模型只填参数；工具失败如实转述'],
    ['成文与数值回查', '回答里的每个数字逐个回查工具返回值，对不上就重写或降级为模板']
  ].map(([t, d], i) => el('div', { class: 'tstep idle' }, [el('div', {}, el('div', { class: 'tdot' })),
    el('div', {}, [el('div', { class: 'tname', text: `${i + 1}. ${t}` }), el('div', { class: 'targs', text: d })])]));
  const trace = el('div', { class: 'trace' }, idle());
  const tracePanel = panel('调用轨迹', { note: '它只能调用下列工具；回答里的每个数字都要能在工具返回值里找到。' }, trace);
  tracePanel.querySelector('.pb').classList.add('flush');

  show(host, el('div', { class: 'chat' }, [
    el('div', { class: 'qcol' }, panel('常用问题', { flush: true }, qlist)), ansPanel,
    el('div', { class: 'trace-col' }, tracePanel)]));

  async function ask() {
    const q = input.value.trim(); if (!q) return;
    btn.disabled = true; answer.className = 'answer placeholder'; answer.textContent = '分析中…';
    meta.replaceChildren(); trace.replaceChildren(loading('调用工具中…', true));
    try {
      const r = await fetch('/api/v1/agent/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q })
      });
      const a = await r.json();
      answer.className = 'answer'; answer.replaceChildren(...citeNodes(a.answer));
      const g = a.guard || {};
      meta.replaceChildren(...[
        tag(g.ok ? `数值一致性通过 · ${g.numbers_checked} 个数字` : `数值一致性未通过 · ${(g.violations || []).length} 处`, g.ok ? 'ok' : 'crit'),
        tag(`意图 ${a.intent} · ${a.route.method} · 置信度 ${a.route.confidence}`),
        tag(a.elapsed_ms + ' ms'),
        a.degraded ? tag('已降级为模板成文', 'warn') : null,
        (a.citations && a.citations.cited && a.citations.cited.length)
          ? tag(`条款引用 ${a.citations.cited.length} 条 · 无效 ${a.citations.invalid.length}`, a.citations.invalid.length ? 'crit' : 'ok') : null
      ].filter(Boolean));
      trace.replaceChildren(...(a.tool_trace.length ? a.tool_trace.map(t => el('div', { class: 'tstep ' + t.status }, [
        el('div', {}, el('div', { class: 'tdot' })),
        el('div', {}, [
          el('div', { class: 'tname' }, [t.tool, tag(t.status, t.status === 'ok' ? 'ok' : 'crit'), el('span', { class: 'muted mono', style: 'font-size:11px', text: t.elapsed_ms + ' ms' })]),
          el('div', { class: 'targs mono', text: JSON.stringify(t.args) }),
          t.error ? el('div', { class: 'terr', text: t.error }) : null])])) : [emptyState('本次未调用任何工具（反问澄清或越权拦截）')]),
        el('div', { class: 'targs', style: 'padding:10px 0', text: `trace_id ${a.trace_id} · 全链路留痕已写入 audit_log，可回溯到输入数据与模型版本。` }));
    } catch (e) {
      answer.className = 'answer'; answer.textContent = '请求失败：' + e.message; trace.replaceChildren(...idle());
    } finally { btn.disabled = false; }
  }
  btn.addEventListener('click', ask);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
}

/* ── 模型评测 ── */
/* ── 准则条文：eCFR 官方原文，条款号精确到段落 ── */
async function renderStandards() {
  const host = $('#tab-standards'), token = ++S.tok.standards;
  const hm = location.hash.match(/[?&]c=([^&]+)/);
  if (hm) S.clause = decodeURIComponent(hm[1]);
  if (!S.clause) S.clause = 'Rule 4-10(a)(22)';
  host.replaceChildren(loading('加载条文库…'));
  try { S.toc = S.toc || await api('/standards/toc'); } catch (e) {
    if (token === S.tok.standards) show(host, alertBar('crit', '条文库不可得', e.message + '。请运行 python -m src.cli build-standards'));
    return;
  }
  if (token !== S.tok.standards || S.page !== 'standards') return;
  const toc = S.toc.clauses;
  setCtx('standards', [tag(S.toc.edition || 'eCFR'), tag(`${S.toc.n} 段条款`)]);

  const q = el('input', { type: 'text', placeholder: '检索：中文或英文，如 五年规则、合理确定性、first-day-of-the-month', 'aria-label': '检索条款', value: S.stdQ || '' });
  const list = el('div', { class: 'clist', role: 'list' });
  const reader = el('div', { class: 'reader' });
  const listMeta = el('span');
  let hits = null, timer = 0, req = 0;

  function drawList() {
    const reg = S.stdReg || 'all';
    const items = hits ? hits : toc.filter(c => reg === 'all' || c.regulation === reg);
    listMeta.textContent = hits ? `命中 ${hits.length} 段（按相关度）` : `${items.length} 段`;
    list.replaceChildren(...items.map(c => {
      const b = el('button', { type: 'button', role: 'listitem', 'aria-current': String(c.citation === S.clause),
        style: hits ? null : `padding-left:${12 + Math.min(c.level || 0, 5) * 12}px` }, [
        el('span', { class: 'cc mono', text: c.citation }),
        el('span', { class: 'ct2', text: c.zh_title ? `${c.zh_title} · ${c.title}` : c.title }),
        hits && c.match === 'citation' ? el('span', { class: 'cm', text: '条款号精确命中' }) : null]);
      b.addEventListener('click', () => openClause(c.citation));
      return b;
    }));
    const cur = list.querySelector('[aria-current="true"]');
    if (cur && !hits) cur.scrollIntoView({ block: 'nearest' });
  }

  async function openClause(c) {
    S.clause = c;
    list.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(b.firstChild.textContent === c)));
    const my = ++req;
    reader.replaceChildren(loading('', true));
    let r;
    try { r = await api('/standards/clause', { citation: c }); } catch (e) { if (my === req) reader.replaceChildren(emptyState(e.message)); return; }
    if (my !== req || token !== S.tok.standards) return;
    const k = r.clause;
    const copy = el('button', { class: 'btn sm', type: 'button', text: '复制引用' });
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(`[${k.citation}]（${k.cfr}）`); toast('已复制条款引用'); } catch (_) { toast('浏览器不允许写剪贴板', 'crit'); }
    });
    const terms = (S.stdQ || '').match(/[A-Za-z][A-Za-z\-]{3,}/g) || [];
    const para = text => {
      if (!terms.length) return el('p', { text });
      const re = new RegExp(`(${terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
      return el('p', {}, text.split(re).map((s, i) => (i % 2 ? el('mark', { text: s }) : s)).filter(x => x !== ''));
    };
    reader.replaceChildren(...[
      el('nav', { class: 'crumbs', 'aria-label': '上级条款' }, [...k.ancestors.flatMap(a => [
        el('button', { type: 'button', class: 'ibtn mono', text: a.citation, title: a.title, onclick: () => openClause(a.citation) }), el('span', { text: '›' })]),
      el('span', { class: 'mono', text: k.citation })]),
      el('h2', { class: 'ctitle' }, [k.title, k.zh_title ? el('small', { text: k.zh_title }) : null]),
      el('div', { class: 'cmeta' }, [tag(k.cfr, 'brand'), k.regulation ? tag(k.regulation) : null, k.edition ? tag(k.edition) : null,
        k.kind === 'instruction' ? tag('指令（Instruction）', 'warn') : null, copy]),
      el('div', { class: 'otext', lang: 'en' }, k.text.split(/\n\n+/).map(para)),
      k.note_zh ? el('div', { class: 'znote' }, [el('b', { text: '要点（非官方中文说明）' }), el('p', { text: k.note_zh })]) : null,
      k.children.length ? box(`下级条款 · ${k.children.length}`, el('div', { class: 'kids' }, k.children.map(ch =>
        el('button', { type: 'button', class: 'kid', onclick: () => openClause(ch.citation) }, [el('span', { class: 'mono', text: ch.citation }), el('span', { text: ch.title })])))) : null].filter(Boolean));
    history.replaceState(null, '', '#/standards?c=' + encodeURIComponent(c));
  }

  q.addEventListener('input', () => {
    S.stdQ = q.value;
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const v = q.value.trim();
      if (!v) { hits = null; drawList(); return; }
      try {
        const r = await api('/standards/search', { query: v, top_k: 12 });
        if (q.value.trim() !== v || token !== S.tok.standards) return;
        hits = r.results; drawList();
      } catch (e) { listMeta.textContent = e.message; }
    }, 260);
  });

  const regSeg = segControl([['all', '全部'], ['Regulation S-X', 'Rule 4-10'], ['Regulation S-K', 'Items 1201–1208']], S.stdReg || 'all',
    k => { S.stdReg = k; hits = null; q.value = ''; S.stdQ = ''; drawList(); }, '法规');
  const tocPanel = panel('条款目录', {
    meta: listMeta, actions: [regSeg], flush: true,
    note: ['17 CFR 210.4-10（Regulation S-X Rule 4-10，油气储量定义与会计）与 17 CFR 229.1201–1208（Regulation S-K Items 1201–1208，油气披露）。',
      '检索用 BM25 + TF-IDF 混合、RRF 融合；中文检索词经术语表扩展到原文关键词，直接输入条款号（如 4-10(a)(31)(ii)、Item 1203）精确命中。']
  }, [el('div', { class: 'csearch' }, q), list]);
  const readPanel = panel('条款原文', {
    meta: '英文为官方原文 · 中文要点为非官方说明',
    note: [S.toc.note, '智能问答与 SEC 满足性检查里出现的条款号都可以点开，跳转到这里核对原文。']
  }, reader);
  show(host, el('div', { class: 'row c-side std' }, [tocPanel, readPanel]));
  if (S.stdQ) q.dispatchEvent(new Event('input')); else drawList();
  openClause(S.clause);
}

async function renderEval() {
  const host = $('#tab-eval');
  host.replaceChildren(loading());
  const e = await api('/eval/summary');
  if (S.page !== 'eval') return;
  const CN = {
    intent_accuracy: '意图识别准确率', slot_f1: '槽位抽取 F1', tool_chain_accuracy: '工具链正确率',
    numeric_consistency: '数值一致性通过率', citation_hit_rate: '条款引用命中率',
    hallucination_rate: '无据结论率（幻觉率）', p95_latency_ms: 'P95 响应时间 (ms)', human_intervention_rate: '人工干预率'
  };
  const out = [];
  if (!e.agent) out.push(alertBar('info', '尚未运行智能体评测', e.hint));
  else {
    const m = e.agent.metrics, t = e.agent.targets, p = m.pass_targets;
    const nPass = Object.values(p).filter(Boolean).length, nAll = Object.keys(t).length;
    setCtx('eval', [tag(`评测集 ${m.n_cases} 条`), tag(`达标 ${nPass} / ${nAll}`, nPass === nAll ? 'ok' : 'warn')]);
    out.push(kpiStrip([
      { label: '意图识别准确率', value: fmt(m.intent_accuracy * 100, 1), unit: '%', note: `目标 ≥ ${fmt(t.intent_accuracy * 100, 0)}%` },
      { label: '数值一致性', value: fmt(m.numeric_consistency * 100, 1), unit: '%', note: '由 guard.py 逐个数字回查' },
      { label: '幻觉率', value: fmt(m.hallucination_rate * 100, 1), unit: '%', note: `目标 ≤ ${fmt(t.hallucination_rate * 100, 0)}%` },
      { label: 'P95 响应', value: fmt(m.p95_latency_ms, 0), unit: 'ms', note: `中位 ${fmt(m.median_latency_ms, 0)} ms` },
      { label: '指标达标', value: `${nPass} / ${nAll}`, note: `人工干预率 ${fmt(m.human_intervention_rate * 100, 1)}%` }]));
    const rows = Object.keys(t).map(k => ({ k: CN[k] || k, v: m[k], target: t[k], ok: p[k], d: k === 'p95_latency_ms' ? 0 : 2 }));
    const aPanel = panel('智能体层指标', {
      meta: `评测集 ${m.n_cases} 条 · 六类构成`, flush: true,
      note: ['数值一致性由 guard.py 逐个数字回查工具返回值保证，不是模型自觉。',
        '150 条用例由模板按井号铺开生成，是我们自己出的题，不是硬基准；真正有价值的评测集要由业务方出题。']
    }, table([{ h: '指标', k: 'k' },
      { h: '实测', k: 'v', num: true, render: r => r.d ? Number(r.v).toFixed(r.d) : fmt(r.v, 0) },
      { h: '目标', k: 'target', num: true, render: r => r.d ? Number(r.target).toFixed(r.d) : fmt(r.target, 0) },
      { h: '状态', k: 'ok', render: r => tag(r.ok ? '达标' : '未达标', r.ok ? 'ok' : 'crit') }], rows));
    const CAT_CN = { normal: '正常问法', colloquial: '口语省略', composite: '跨模块组合', missing_data: '缺数据',
      out_of_scope: '越权请求', adversarial: '诱导性提问' };
    const byCat = Object.entries(e.agent.by_category).map(([k, v]) => ({ cat: CAT_CN[k] || k, ...v }));
    const cPanel = panel('分类别表现', { meta: '诱导性提问与越权请求是幻觉最容易冒出来的地方', flush: true },
      table([{ h: '类别', k: 'cat' }, { h: '用例数', k: 'n', num: true, d: 0 },
        { h: '意图准确率', k: 'intent_accuracy', num: true, render: r => Number(r.intent_accuracy).toFixed(2) },
        { h: '数值一致性', k: 'numeric_consistency', num: true, render: r => Number(r.numeric_consistency).toFixed(2) }], byCat));
    out.push(el('div', { class: 'row c2' }, [aPanel, cPanel]));
  }
  if (e.algo) {
    const SPLIT_CN = { time: '时间外推', group: '按区块留出', random: '随机（仅对照）' };
    const order = Object.keys(SPLIT_CN);
    const splits = [...new Set(e.algo.rows.map(r => r.split))].sort((a, b) => (order.indexOf(a) + 99 * (order.indexOf(a) < 0)) - (order.indexOf(b) + 99 * (order.indexOf(b) < 0)));
    const rows = splits.flatMap(s => [{ _group: SPLIT_CN[s] || s },
      ...e.algo.rows.filter(r => r.split === s).map(r => ({ ...r, target: TARGET_CN[r.target] || r.target }))]);
    out.push(el('div', { class: 'row' }, panel('算法层 · 切分方式对比', { meta: '对外报告一律使用时间外推切分的指标', note: e.algo.conclusion, flush: true },
      table([{ h: '目标', k: 'target' }, { h: '线上 MAE', k: 'mae', num: true }, { h: '覆盖率', k: 'coverage', num: true },
        { h: '相对基线 (%)', k: 'gain_pct', num: true, d: 1 }, { h: '梯度提升 MAE', k: 'gbdt_mae', num: true },
        { h: '未加守卫的融合 MAE', k: 'blend_no_guard_mae', num: true }, { h: '漂移退回 (口)', k: 'n_drift_flagged', num: true, d: 0 }], rows))));
  }
  const DCA_SETS = [['dca', '主合成数据'], ['dca_linear_flow', '线性流队列'], ['dca_ndic', 'NDIC 真实井']].filter(([k]) => e[k]);
  if (DCA_SETS.length) {
    if (!S.dcaSet || !e[S.dcaSet]) S.dcaSet = DCA_SETS[0][0];
    const dBody = el('div'), dMeta = el('span'), dNote = el('div', { class: 'pnote-inline' });
    const drawD = k => {
      S.dcaSet = k;
      const D = e[k], useEur = D.truth_available, m = useEur ? 'EUR' : '未来 24 月产量';
      dMeta.textContent = `${D.dataset_label || '主合成数据集'} · 井 ${D.n_wells_total ?? '—'} 口 · 类比井库 ${D.n_library} 口`;
      dNote.textContent = D.conclusion;
      const rows = D.horizons.flatMap(H => [{ _group: `峰后只用前 ${H} 个月历史拟合` },
        ...D.table.filter(r => r.horizon_months === H).map(r => {
          const x = (useEur ? r.eur : r.next24) || {};
          return { m: r.method_cn, n: r.n_wells, next: r.next12.mdape_pct, err: x.mdape_pct, bias: x.bias_pct, over: x.over20_pct, p90: x.p90_pct, cap: r.cap_binding_pct };
        })]);
      dBody.replaceChildren(dNote, table([{ h: '方法', k: 'm' }, { h: '井数', k: 'n', num: true, d: 0 },
        { h: '未来 12 月产量误差 (%)', k: 'next', num: true, d: 1 }, { h: `${m}中位误差 (%)`, k: 'err', num: true, d: 1 },
        { h: `${m}中位偏差 (%)`, k: 'bias', num: true, d: 1 }, { h: '高估 > 20% 的井 (%)', k: 'over', num: true, d: 1 },
        { h: `${m}误差 90% 分位 (%)`, k: 'p90', num: true, d: 1 }, { h: '上限触发 (%)', k: 'cap', num: true, d: 1 }], rows));
    };
    out.push(el('div', { class: 'row' }, panel('算法层 · 递减模型回测', {
      meta: dMeta, flush: true,
      actions: [segControl(DCA_SETS, S.dcaSet, drawD, '回测数据集')],
      note: ['三个数据集的出题方式不同：主合成数据的递减按 Arps 生成（偏向 Arps）；线性流队列按改造区 + 外围基质的复合平板解析解生成（与两种拟合公式都不同，带真值）；NDIC 是北达科他州公开的真实井（没有 EUR 真值，比未来 24 个月产量）。',
        '"高估 > 20%" 是 SEC 口径最关心的一列：已证实储量宁低勿高。']
    }, dBody)));
    drawD(S.dcaSet);
  } else out.push(alertBar('info', '尚未运行递减模型回测', 'python -m src.cli eval-dca'));

  /* ── 失败样例：主动暴露模型、智能体与递减模型的边界 ── */
  const fc = e.model && e.model.failure_cases;
  if (fc && Object.keys(fc).length) {
    const keys = Object.keys(fc).filter(k => TARGET_CN[k]);
    if (!S.fcTarget || !fc[S.fcTarget]) S.fcTarget = fc.eur ? 'eur' : keys[0];
    const UNIT = { t_oil_break: 'd', t_peak: 'd', q_peak: 't/d', p_peak: 'MPa', eur: 't' };
    const body = el('div'), meta = el('span'), dr = e.model.drift;
    const draw = k => {
      S.fcTarget = k;
      const f = fc[k], d = k === 'eur' ? 0 : 2;
      meta.textContent = `测试集 ${f.n} 口 · 实际低于 P10：${f.below_p10} 口（高估风险）· 实际高于 P90：${f.above_p90} 口`;
      body.replaceChildren(table([
        { h: '井号', k: 'well_code', render: r => el('a', { href: '#/well', text: r.well_code, onclick: () => { S.current = r.well_code; } }) },
        { h: '区块', k: 'block' }, { h: '投产日期', k: 'first_prod_date' },
        { h: `实际 (${UNIT[k] || ''})`, k: 'actual', num: true, d },
        { h: 'P50（P10 ~ P90）', k: 'p50', num: true, render: r => `${fmt(Math.max(r.p50, 0), d)}（${fmt(Math.max(r.p10, 0), d)}${r.p10 < 0 ? '*' : ''} ~ ${fmt(r.p90, d)}）` },
        { h: '误差', k: 'rel_error_pct', num: true, render: r => el('span', {}, [tag(r.direction, r.direction === '高估' ? 'crit' : 'warn'), ` ${fmt(r.rel_error_pct, 1)}%`]) },
        { h: '实际落点', k: 'position', render: r => tag(r.position, r.position === '区间内' ? 'ok' : r.position === '低于 P10' ? 'crit' : 'warn') },
        { h: '梯度提升 / 序列 P50', k: 'gbdt_p50', num: true, render: r => `${fmt(r.gbdt_p50, d)} / ${r.seq_p50 == null ? '—' : fmt(r.seq_p50, d)}` },
        { h: '序列权重', k: 'seq_weight_used', num: true, render: r => (r.drift && r.drift.flagged ? tag('漂移 · 0', 'warn') : fmt(r.seq_weight_used, 2)) },
        { h: 'SHAP 前三（梯度提升）', k: 'shap', cls: 'wrap', render: r => r.shap_top.map(x => `${FEAT(x.feature)} ${signed(x.contrib, d)}`).join('；') }
      ], f.worst));
    };
    out.push(el('div', { class: 'row' }, panel('失败样例 · 预测模型', {
      meta, flush: true,
      actions: [segControl(keys.map(x => [x, TARGET_CN[x]]), S.fcTarget, draw, '预测目标')],
      note: ['每个目标列出测试集误差最大的 8 口井，口径与线上一致（融合 + 漂移守卫 + 保形校准）；点击井号进入单井页看完整解释。',
        '"实际低于 P10"是 SEC 口径最危险的一类：实际采出比低估计还少，按区间下沿报的已证实储量也会偏高。',
        '带 * 的区间下沿：保形校准对称加宽后低于 0，按物理下界 0 显示；覆盖率按未截断的区间计算（截断不改变是否覆盖）。',
        dr ? `漂移守卫：阈值 ${dr.threshold}（校准集 ${Math.round(dr.quantile * 100)}% 分位），测试集标记 ${dr.n_flagged_test} / ${dr.n_test} 口，其中区块或层系没见过的 ${dr.n_novel_category_test} 口。` : null]
    }, body)));
    draw(S.fcTarget);
  }
  if (e.agent && e.agent.issues) {
    const iss = e.agent.issues;
    const CAT = { normal: '正常问法', colloquial: '口语省略', composite: '跨模块组合', missing_data: '缺数据', out_of_scope: '越权请求', adversarial: '诱导性提问' };
    out.push(el('div', { class: 'row' }, panel('失败与需人工的样例 · 智能体', {
      meta: `共 ${e.agent.n_issues} 条 · 按设计应追问或拒答 ${e.agent.n_issues_by_design} 条 · 需要改进 ${e.agent.n_issues - e.agent.n_issues_by_design} 条`, flush: true,
      note: ['六类问题：意图错误、数值校验未过、槽位错误、工具链不全、降级为模板成文、追问或拒答。',
        '越权请求被拒、缺少必要参数被追问是设计行为，标为"按设计"，不算失败；需要改进的排在前面。']
    }, iss.length ? table([
      { h: '用例', k: 'id' }, { h: '类别', k: 'category', render: r => CAT[r.category] || r.category },
      { h: '问题', k: 'question', cls: 'wrap' },
      { h: '问题类型', k: 'issues', render: r => el('span', { class: 'tags' }, [...r.issues.map(x => tag(x, r.by_design ? null : 'warn')), r.by_design ? tag('按设计', 'ok') : null]) },
      { h: '期望 / 实际意图', k: 'intent', render: r => `${r.expected_intent} / ${r.got_intent}` },
      { h: '期望工具 / 实际调用', k: 'tools', cls: 'wrap', render: r => `${(r.expected_tools || []).join('、') || '—'} / ${(r.got_tools || []).join('、') || '—'}` }
    ], iss, { scroll: true }) : emptyState('没有失败或需人工的用例'))));
  }
  if (DCA_SETS.length) {
    const wBody = el('div');
    const drawW = k => {
      const D = e[k], list = D.worst_overestimates || [];
      if (!list.length) { wBody.replaceChildren(emptyState('该数据集没有逐井高估明细')); return; }
      const metric = list[0].metric || 'EUR';
      const rows = D.horizons.flatMap(h => [{ _group: `峰后只用前 ${h} 个月历史拟合` }, ...list.filter(r => r.horizon_months === h)]);
      wBody.replaceChildren(table([{ h: '方法', k: 'method_cn' },
        { h: '井号', k: 'well_code', render: r => (k === 'dca' ? el('a', { href: '#/reserves', text: r.well_code, onclick: () => { S.current = r.well_code; } }) : el('span', { class: 'mono', text: r.well_code })) },
        { h: '区块 / 层位', k: 'block' }, { h: `${metric} 真值 (t)`, k: 'eur_true', num: true, d: 0 }, { h: `${metric} 预测 (t)`, k: 'eur_pred', num: true, d: 0 },
        { h: '高估', k: 'error_pct', num: true, render: r => tag(`${r.error_pct > 0 ? '+' : ''}${fmt(r.error_pct, 1)}%`, r.error_pct > 20 ? 'crit' : 'warn') },
        { h: '另一方法同井误差', k: 'other_error_pct', num: true, render: r => `${r.other_method_cn} ${signed(r.other_error_pct, 1)}%` }], rows, { scroll: true }));
    };
    out.push(el('div', { class: 'row' }, panel('失败样例 · 递减模型高估最多的井', {
      meta: '每种方法各取高估最多的 5 口，并给另一种方法在同一口井上的误差', flush: true,
      actions: [segControl(DCA_SETS, S.dcaSet, drawW, '回测数据集')],
      note: ['高估是 SEC 口径最需要避免的错误。对照列能看出是"这口井本身难"（两种方法都高估）还是"某种方法的缺陷"（只有一种高估）。',
        'NDIC 井号为不可逆哈希，不对应任何可识别的真实井；真实井没有 EUR 真值，这里比较的是未来 24 个月产量。']
    }, wBody)));
    drawW(S.dcaSet);
  }
  show(host, ...out);
}

/* ══════════════════════════════════════════════════════════════
   5. 路由与启动（hash 路由：#/unit 可直接收藏、分享）
   ══════════════════════════════════════════════════════════════ */
const PAGES = {
  overview: { group: '工作台', title: '总览', icon: 'dash', render: renderOverview },
  well: { group: '单井分析', title: '全生命周期预测', icon: 'trend', render: renderWell },
  reserves: { group: '单井分析', title: '储量与 SEC 预评估', icon: 'db', render: renderReserves },
  unit: { group: 'SEC 单元', title: '构成评估', icon: 'layers', render: renderUnit },
  categories: { group: 'SEC 单元', title: '类别跟踪', icon: 'pie', render: renderCategories },
  depletion: { group: 'SEC 单元', title: '折耗与减值', icon: 'coins', render: renderDepletion },
  monitor: { group: 'SEC 单元', title: '运行监控', icon: 'bars', render: renderMonitor },
  chat: { group: '智能分析', title: '智能问答', icon: 'chat', render: renderChat },
  standards: { group: '智能分析', title: '准则条文', icon: 'book', render: renderStandards },
  import: { group: '系统', title: '数据导入', icon: 'upload', render: renderImport },
  indicators: { group: '系统', title: '指标口径', icon: 'sliders', render: renderProfiles },
  eval: { group: '系统', title: '模型评测', icon: 'check', render: renderEval }
};
(function buildNav() {
  const nav = $('#nav');
  let g = null;
  Object.entries(PAGES).forEach(([k, p]) => {
    if (p.group !== g) { g = p.group; nav.appendChild(el('div', { class: 'ngroup', text: g })); }
    nav.appendChild(el('a', { href: '#/' + k, 'data-page': k }, [icon(p.icon), el('span', { text: p.title })]));
  });
})();

function switchTab(name) {
  if (!PAGES[name]) name = 'overview';
  const p = PAGES[name];
  S.page = name; hideTip();
  if (S.pb) { S.pb.playing = false; clearTimeout(S.pb.timer); }
  document.querySelectorAll('#nav a').forEach(a => {
    if (a.dataset.page === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  Object.keys(PAGES).forEach(k => { $('#tab-' + k).hidden = k !== name; });
  $('#crumb').replaceChildren(el('span', { text: p.group }), el('span', { class: 'sep', text: '/' }), el('span', { class: 'cur', text: p.title }));
  $('#ptitle').textContent = p.title;
  document.title = `${p.title} · 储量评估系统`;
  $('#ctx').replaceChildren();
  if (location.hash.split('?')[0] !== '#/' + name) history.replaceState(null, '', '#/' + name);
  Promise.resolve(p.render()).catch(e => {
    if (S.page === name) $('#tab-' + name).replaceChildren(alertBar('crit', '加载失败', e.message));
  });
}
const routeFromHash = () => (location.hash.match(/^#\/(\w+)/) || [])[1] || 'overview';
addEventListener('hashchange', () => { if (routeFromHash() !== S.page) { switchTab(routeFromHash()); scrollTo(0, 0); } });

const themeBtn = $('#themeBtn');
const isDark = () => {
  const t = document.documentElement.getAttribute('data-theme');
  return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
};
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  themeBtn.replaceChildren(icon(isDark() ? 'sun' : 'moon'));
  themeBtn.title = isDark() ? '切换到浅色' : '切换到深色';
}
themeBtn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('theme', next); } catch (_) { }
  applyTheme(next);
  if (S.page) switchTab(S.page);   /* 重画图表，让 SVG 取到新的色值 */
});
try { applyTheme(localStorage.getItem('theme')); } catch (_) { applyTheme(null); }

switchTab(routeFromHash());
</script>
</body>
</html>
