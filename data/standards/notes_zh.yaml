notes:
  "Rule 4-10(a)(2)": >-
    类比油藏须与目标油藏岩石流体性质、油藏条件、驱动机理相近，且通常处于更成熟的开发阶段；
    用于建立合理确定性时须同一层位、同一沉积环境、相似构造与相同驱动机理，且类比油藏的性质总体上不得优于目标油藏。
  "Rule 4-10(a)(5)": 确定性估算：每个参数取单一最佳值，得到单一的储量结果。
  "Rule 4-10(a)(6)": >-
    已开发储量：可通过现有井、现有设备和操作方法采出（或所需设备费用相对新钻井很小），
    或通过估算时已投运的采油设施采出。PDP 与 PDNP 都属于已开发储量。
  "Rule 4-10(a)(6)(i)": 已开发储量的第一种情形：现有井、现有设备与操作方法，或所需设备费用相对新钻井相对较小。
  "Rule 4-10(a)(9)": 开发井：在油气藏已证实区域内钻至已知产层的井。
  "Rule 4-10(a)(10)": >-
    经济可采：资源产生的收入超过（或合理预期超过）作业成本。产品价值按其首次可售时点确定。
    这是储量剖面在经济极限处截断的依据。
  "Rule 4-10(a)(11)": EUR（最终可采量）= 给定日期的剩余储量 + 截至该日期的累计产量。
  "Rule 4-10(a)(14)": 扩边井：为扩大已知油藏边界而钻的井。
  "Rule 4-10(a)(19)": 概率性估算：用全部地质、工程与经济数据生成可能结果的全区间及其相应概率。
  "Rule 4-10(a)(22)": >-
    已证实储量：通过地质与工程数据分析，能以合理确定性估计在现有经济条件、操作方法和政府法规下，
    自给定日期起（至作业权到期前，除非有证据表明续期合理确定）经济可采的油气量；
    开采项目须已开始，或作业者须合理确定将在合理时间内开始。
  "Rule 4-10(a)(22)(i)": 已证实面积包括：钻遇并受流体界面限制的区域；以及可合理确定与之连续、经济可采的相邻未钻部分。
  "Rule 4-10(a)(22)(i)(B)": 相邻未钻部分可计入已证实面积的条件：依据现有地质与工程数据，可合理确定其与已钻区域连续且经济可采。
  "Rule 4-10(a)(22)(ii)": 缺少流体界面资料时，已证实量以井中所见最低已知烃（LKH）为限，除非可靠技术证明界面更低。
  "Rule 4-10(a)(22)(iv)": 提高采收率（如注水）的储量计入已证实的条件：先导试验或同油藏、类比油藏的已实施项目证明有效，且项目已获全部批准。
  "Rule 4-10(a)(22)(v)": >-
    现有经济条件：价格取报告期末前 12 个月内每月首日价格的未加权算术平均（合同约定价格除外，
    合同价格的升级条款只按现有合同计入）；成本取当前成本。
  "Rule 4-10(a)(24)": >-
    合理确定性：采用确定性方法时，指高度相信该数量将被采出；采用概率方法时，实际采出量等于或超过估计值的概率至少为 90%。
    随地质、工程与经济数据（含 EUR 随时间的变化）的增加与复核，估计更可能上调而非下调。
  "Rule 4-10(a)(25)": >-
    可靠技术：一种或多种技术（含计算方法）的组合，已经过现场检验，并在被评估的地层或类比地层中
    证明能以一致性和可重复性给出合理确定的结果。数据驱动方法须提供本地区的回测依据。
  "Rule 4-10(a)(26)": 储量：自给定日期起、通过开发项目从已知聚集体中预期经济可采的剩余油气量，须具备开采的合法权利、已安装或合理预期安装的销售设施及必要许可。
  "Rule 4-10(a)(31)": 未开发储量：预期从未钻区新井采出，或从现有井但需较大支出（如重新完井）才能采出的储量。
  "Rule 4-10(a)(31)(i)": 未钻区的储量限于直接相邻开发井距、钻后合理确定能生产的区域；超出相邻井距须有可靠技术证明经济可采的合理确定性。
  "Rule 4-10(a)(31)(ii)": >-
    五年规则：只有已通过开发计划、安排在五年内钻井的未钻井位，才能归类为未开发储量；
    特殊情况可以更长，但须有具体理由支撑。
  "Rule 4-10(a)(31)(iii)": 拟实施注水等提高采收率技术的面积，除非该技术已在同油藏或类比油藏证明有效，否则不得计入未开发储量。
  "Item 1202(a)(2)": 按地区及占已证实储量 15% 以上的国家披露：已证实已开发、已证实未开发、已证实合计（概算、可能储量可选）。
  "Item 1202(a)(7)": 披露储量估算的内部控制，以及主要负责储量估算或审计的技术人员的资质。
  "Item 1202(a)(8)": 称由第三方编制或审计储量时，须附第三方报告，并说明目的、生效日、覆盖比例、假设与方法、经济假设、法规影响、不确定性、结论与签字。
  "Item 1202(b)": 储量对价格的敏感性分析（可选）：按主要产品类型与价格情景披露储量估计，并说明价格与成本假设。
  "Item 1203(a)": 披露年末已证实未开发储量总量。
  "Item 1203(b)": 披露年内已证实未开发储量的重大变化，包括转为已证实已开发的数量。
  "Item 1203(c)": 说明年内为把未开发储量转为已开发所做的投资与进展，包括资本支出。
  "Item 1203(d)": 说明个别油田或国家中大量未开发储量五年或更长时间仍未开发的原因。
  "Item 1204(a)": 按地区与占 15% 以上的国家披露各年产量。
  "Item 1204(b)": 披露平均销售价格与平均单位生产成本（不含从价税与开采税）。

